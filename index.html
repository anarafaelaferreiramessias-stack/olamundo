<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá, Mundo! </title>
    <style>
        /* Reset básico para limpar as margens do navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fundo animado com gradiente */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            overflow: hidden;
        }

        /* Animação do fundo mexendo */
        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Cartão principal com efeito Glassmorphism (efeito de vidro) */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            transform: translateY(50px);
            opacity: 0;
            animation: fadeInUp 1s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards;
        }

        /* Animação para o cartão surgir suavemente */
        @keyframes fadeInUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Título principal decorado */
        h1 {
            color: #ffffff;
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        /* Subtítulo ou texto de apoio */
        p {
            color: #f0f0f0;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        /* Botão interativo e decorado */
        .btn-decorado {
            background: #ffffff;
            color: #e73c7e;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        /* Efeito de passar o mouse no botão (Hover) */
        .btn-decorado:hover {
            background: #e73c7e;
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(231, 60, 126, 0.4);
        }

        /* Efeito de clique no botão */
        .btn-decorado:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>✨ Olá, Mundo! ✨</h1>
        <p>Seja bem-vindo ao desenvolvimento web levado a outro nível.</p>
        <button class="btn-decorado" onclick="celebrar()">Clique Aqui</button>
    </div>

    <script>
        function celebrar() {
            // Um alerta simpático, mas você pode mudar para o que quiser!
            alert("🎉 Parabéns! Você acabou de executar um Olá, Mundo com muito estilo!");
        }
    </script>

</body>
</html>
