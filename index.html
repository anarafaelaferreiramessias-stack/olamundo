<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Survival Alpha</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        
        /* MENU */
        #menu {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.imgur.com/u7q13eH.jpg') center/cover;
            transition: 0.5s;
        }
        .btn { padding: 15px 40px; background: #4e4e4e; border: 3px solid #000; color: white; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #8dc63f; }

        /* HUD & INVENTÁRIO */
        #hotbar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 364px; height: 44px; background: rgba(0,0,0,0.5); border: 2px solid #fff;
            display: none; display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .slot { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border: 2px solid #888; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; position: relative; }
        .slot-count { position: absolute; bottom: 2px; right: 2px; font-weight: bold; color: #fff; text-shadow: 1px 1px #000; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
    </style>
</head>
<body>

    <div id="menu">
        <img src="https://minecraft.wiki/images/Minecraft_Logo.png" style="width: 400px; margin-bottom: 20px;">
        <button class="btn" onclick="start()">JOGAR 2026</button>
    </div>

    <div id="hotbar">
        <div class="slot"><div id="inv-wood" class="slot-count">0</div></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();
        let blocks = [], drops = []; 
        let inventoryWood = 0;

        const loader = new THREE.TextureLoader();
        const woodTex = loader.load('https://threejs.org/examples/textures/crate.gif');

        function start() {
            document.getElementById('menu').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('hotbar').style.display = 'flex';
                document.getElementById('crosshair').style.display = 'block';
                init();
            }, 500);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x74b9ff);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Chão
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshLambertMaterial({color: 0x3d611c}));
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            // Mão
            hand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.8), new THREE.MeshLambertMaterial({color: 0xdbac82}));
            scene.add(hand);

            // Criar Árvores (Bloco por Bloco)
            for(let i=0; i<30; i++) spawnTree(Math.random()*100-50, Math.random()*100-50);

            raycaster = new THREE.Raycaster();

            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) {
                    renderer.domElement.requestPointerLock();
                } else {
                    if (e.button === 0) breakBlock();
                    if (e.button === 2) placeBlock();
                }
            });

            document.addEventListener('keydown', (e) => handleKeys(e.code, true));
            document.addEventListener('keyup', (e) => handleKeys(e.code, false));
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            animate();
        }

        function spawnTree(x, z) {
            for(let h=0; h<4; h++) {
                const log = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                log.position.set(x, h + 0.5, z);
                scene.add(log);
                blocks.push(log);
            }
        }

        function breakBlock() {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(blocks);
            if (intersects.length > 0) {
                const target = intersects[0].object;
                createDrop(target.position.clone()); // Cria o item no chão
                scene.remove(target);
                blocks = blocks.filter(b => b !== target);
                hand.position.z += 0.2; // Animação soco
            }
        }

        function createDrop(pos) {
            const drop = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshLambertMaterial({map: woodTex}));
            drop.position.set(pos.x, 0.3, pos.z);
            scene.add(drop);
            drops.push(drop);
        }

        function placeBlock() {
            if (inventoryWood <= 0) return;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const pos = camera.position.clone().add(dir.multiplyScalar(3));
            const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
            b.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
            scene.add(b);
            blocks.push(b);
            inventoryWood--;
            document.getElementById('inv-wood').innerText = inventoryWood;
        }

        function handleKeys(c, v) {
            if(c==='KeyW') moveF=v; if(c==='KeyS') moveB=v; if(c==='KeyA') moveL=v; if(c==='KeyD') moveR=v;
            if(c==='Space' && v && canJump) { velocity.y += 4; canJump = false; }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 100.0 * delta; // Lento como pedido
            if (moveL || moveR) velocity.x -= direction.x * 100.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 1.6) { velocity.y = 0; camera.position.y = 1.6; canJump = true; }

            // Lógica de Coleta (Drops)
            drops.forEach((drop, index) => {
                drop.rotation.y += 0.02; // Item girando
                const dist = camera.position.distanceTo(drop.position);
                if (dist < 1.5) { // Se o jogador encostar
                    inventoryWood++;
                    document.getElementById('inv-wood').innerText = inventoryWood;
                    scene.remove(drop);
                    drops.splice(index, 1);
                }
            });

            // Mão
            hand.position.copy(camera.position);
            hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.5); hand.translateY(-0.4); hand.translateZ(-0.8);

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
