<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo - Mario Kart Style!</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(to bottom, #4a90e2 0%, #4a90e2 40%, #87cefa 40%, #d2b48c 70%, #8b4513 100%);
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Efeito de pista com linhas de velocidade */
        .road-lines {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0%,
                transparent 20px,
                #ffd700 20px,
                #ffd700 40px
            );
            animation: moveRoad 1.2s linear infinite;
            opacity: 0.8;
        }

        @keyframes moveRoad {
            0% { transform: translateY(0); }
            100% { transform: translateY(-80px); }
        }

        /* Kart simples central (CSS puro) */
        .kart {
            position: relative;
            width: 280px;
            height: 180px;
            animation: bounce 1.8s ease-in-out infinite;
            z-index: 10;
        }

        .kart-body {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 80px;
            background: #e31e24; /* Vermelho Mario */
            border: 8px solid #000;
            border-radius: 20px 60px 20px 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }

        .kart-top {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 60px;
            background: #000;
            border: 8px solid #e31e24;
            border-radius: 50% 50% 10px 10px;
        }

        .wheel {
            position: absolute;
            background: #111;
            border: 10px solid #ffd700;
            border-radius: 50%;
            box-shadow: inset 0 0 15px #000;
        }

        .wheel-front-left { width: 70px; height: 70px; bottom: -20px; left: 20px; }
        .wheel-front-right { width: 70px; height: 70px; bottom: -20px; right: 20px; }
        .wheel-back-left { width: 80px; height: 80px; bottom: -30px; left: 10px; }
        .wheel-back-right { width: 80px; height: 80px; bottom: -30px; right: 10px; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(3deg); }
        }

        /* Texto Olá Mundo estilo Mario Kart */
        .hello {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.2em;
            color: #ffd700;
            text-shadow: 6px 6px 0 #e31e24, 10px 10px 0 #000;
            letter-spacing: 8px;
            text-align: center;
            z-index: 5;
            white-space: nowrap;
        }

        .subtitle {
            font-size: 1.4em;
            color: #fff;
            text-shadow: 4px 4px 0 #000;
            margin-top: 20px;
        }

        .card {
            position: absolute;
            bottom: 80px;
            background: rgba(0, 0, 0, 0.7);
            padding: 25px 50px;
            border: 8px solid #e31e24;
            border-radius: 20px;
            text-align: center;
            z-index: 5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .card p {
            font-size: 1.1em;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <!-- Linhas da pista em movimento -->
    <div class="road-lines"></div>

    <!-- Kart central -->
    <div class="kart">
        <div class="kart-body">
            <div class="kart-top"></div>
        </div>
        <div class="wheel wheel-front-left"></div>
        <div class="wheel wheel-front-right"></div>
        <div class="wheel wheel-back-left"></div>
        <div class="wheel wheel-back-right"></div>
    </div>

    <!-- Texto principal -->
    <div class="hello">
        Olá Mundo!
        <div class="subtitle">Mario Kart Edition</div>
    </div>

    <!-- Card inferior -->
    <div class="card">
        <p>Ready... Set... GO!</p>
        <p>Clique para começar a corrida!</p>
    </div>

    <!-- Música de fundo: Super Mario Kart - Title Screen / Main Theme -->
    <audio id="bgm" loop preload="auto" volume="0.35">
        <source src="https://vgmsite.com/soundtracks/super-mario-kart-gamerip/1-02.%20Title%20Screen.mp3" type="audio/mpeg">
        <!-- Alternativa se falhar: https://downloads.khinsider.com/game-soundtracks/album/super-mario-kart-gamerip/1-02.%2520Title%2520Screen.mp3 -->
    </audio>

    <!-- Som de "start" ou coin no clique -->
    <audio id="startSound" preload="auto">
        <source src="https://www.orangefreesounds.com/wp-content/uploads/2014/08/Mario-coin-sound.mp3" type="audio/mpeg">
        <!-- Alternativa: https://themushroomkingdom.net/sounds/wav/smk/smk_race_start.wav (se encontrar link direto) -->
    </audio>

    <script>
        const bgm = document.getElementById('bgm');
        const startSound = document.getElementById('startSound');

        // Tenta tocar música de fundo
        bgm.play().catch(() => {
            document.body.addEventListener('click', () => bgm.play(), { once: true });
        });

        // Ao clicar: som + redireciona
        document.body.addEventListener('click', () => {
            startSound.currentTime = 0;
            startSound.play().catch(() => {});
            setTimeout(() => {
                window.location.href = "https://www.nintendo.com/pt-br/";
            }, 1500); // Delay pra curtir o som
        });
    </script>

</body>
</html>
