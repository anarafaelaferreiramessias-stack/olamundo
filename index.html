<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Build & Foliage</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        #menu {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://i.imgur.com/u7q13eH.jpg') center/cover;
            transition: 0.5s;
        }
        .btn { padding: 15px 50px; background: #3c3c3c; border: 4px solid #000; color: #fff; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #8dc63f; }

        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; gap: 5px; padding: 5px; background: rgba(0,0,0,0.6); border: 2px solid #fff;
        }
        .slot { width: 44px; height: 44px; border: 2px solid #555; display: flex; align-items: center; justify-content: center; position: relative; }
        .slot.selected { border: 2px solid #fff; background: rgba(255,255,255,0.2); }
        .count { position: absolute; bottom: 2px; right: 2px; color: #fff; font-size: 14px; text-shadow: 1px 1px #000; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #mining-progress { position: absolute; top: 53%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 4px; background: #000; display: none; }
        #mining-bar { width: 0%; height: 100%; background: #00ff00; }
    </style>
</head>
<body>

    <div id="menu">
        <img src="https://minecraft.wiki/images/Minecraft_Logo.png" style="width: 400px; margin-bottom: 20px;">
        <button class="btn" onclick="start()">SPAWN WORLD</button>
    </div>

    <div id="mining-progress"><div id="mining-bar"></div></div>
    <div id="hotbar">
        <div class="slot selected" id="s0"><div id="inv-wood" class="count">0</div></div>
        <div class="slot" id="s1"></div><div class="slot" id="s2"></div><div class="slot" id="s3"></div><div class="slot" id="s4"></div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand, handItem;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();
        let blocks = [], drops = []; 
        let inventoryWood = 0, selectedSlot = 0;
        let isMining = false, miningTime = 0, currentTarget = null;

        const loader = new THREE.TextureLoader();
        const woodTex = loader.load('https://threejs.org/examples/textures/crate.gif');

        function start() {
            document.getElementById('menu').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('hotbar').style.display = 'flex';
                document.getElementById('crosshair').style.display = 'block';
                init();
            }, 500);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x74b9ff);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshLambertMaterial({color: 0x3d611c}));
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            hand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.8), new THREE.MeshLambertMaterial({color: 0xdbac82}));
            scene.add(hand);

            handItem = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), new THREE.MeshLambertMaterial({map: woodTex}));
            handItem.visible = false;
            scene.add(handItem);

            // Gerar Árvores com Folhas
            for(let i=0; i<40; i++) spawnTree(Math.random()*120-60, Math.random()*120-60);

            raycaster = new THREE.Raycaster();

            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) {
                    renderer.domElement.requestPointerLock();
                } else {
                    if (e.button === 0) startMining();
                    if (e.button === 2) placeBlock();
                }
            });
            document.addEventListener('mouseup', () => stopMining());
            document.addEventListener('keydown', (e) => {
                handleKeys(e.code, true);
                if (e.key >= 1 && e.key <= 5) updateSlot(parseInt(e.key) - 1);
            });
            document.addEventListener('keyup', (e) => handleKeys(e.code, false));
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    camera.rotation.y -= e.movementX * 0.0015;
                    camera.rotation.x -= e.movementY * 0.0015;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });
            animate();
        }

        function spawnTree(x, z) {
            // Tronco
            for(let h=0; h<4; h++) {
                const log = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                log.position.set(x, h + 0.5, z);
                log.userData = { type: 'wood', t: 1.5 };
                scene.add(log);
                blocks.push(log);
            }
            // Folhas (Copa)
            for(let h=3; h<5; h++) {
                for(let lx=-1; lx<=1; lx++) {
                    for(let lz=-1; lz<=1; lz++) {
                        if(lx==0 && lz==0 && h==3) continue;
                        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({color: 0x228b22}));
                        leaf.position.set(x+lx, h+0.5, z+lz);
                        leaf.userData = { type: 'leaf', t: 0.4 };
                        scene.add(leaf);
                        blocks.push(leaf);
                    }
                }
            }
        }

        function updateSlot(idx) {
            document.getElementById('s'+selectedSlot).classList.remove('selected');
            selectedSlot = idx;
            document.getElementById('s'+selectedSlot).classList.add('selected');
            handItem.visible = (selectedSlot === 0 && inventoryWood > 0);
        }

        function startMining() {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(blocks);
            if (hits.length > 0 && hits[0].distance < 4) {
                isMining = true; currentTarget = hits[0].object; miningTime = 0;
                document.getElementById('mining-progress').style.display = 'block';
            }
        }

        function stopMining() { isMining = false; document.getElementById('mining-progress').style.display = 'none'; }

        function placeBlock() {
            if (selectedSlot !== 0 || inventoryWood <= 0) return;
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects([scene.children[0], ...blocks]);
            if (hits.length > 0 && hits[0].distance < 5) {
                const normal = hits[0].face.normal;
                const pos = hits[0].object.position.clone().add(normal);
                if (hits[0].object === scene.children[0]) pos.set(Math.round(hits[0].point.x), 0.5, Math.round(hits[0].point.z));

                const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                b.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                scene.add(b);
                blocks.push(b);
                inventoryWood--;
                document.getElementById('inv-wood').innerText = inventoryWood;
                handItem.visible = inventoryWood > 0;
            }
        }

        function handleKeys(c, v) {
            if(c==='KeyW') moveF=v; if(c==='KeyS') moveB=v; if(c==='KeyA') moveL=v; if(c==='KeyD') moveR=v;
            if(c==='Space' && v && canJump) { velocity.y += 4.5; canJump = false; }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 8.0 * delta;
            velocity.z -= velocity.z * 8.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 60.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 60.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;
            if (camera.position.y < 1.7) { velocity.y = 0; camera.position.y = 1.7; canJump = true; }

            if (isMining && currentTarget) {
                miningTime += delta;
                document.getElementById('mining-bar').style.width = (miningTime/currentTarget.userData.t)*100 + '%';
                hand.position.z += Math.sin(time*0.02)*0.03;
                if (miningTime >= currentTarget.userData.t) {
                    const d = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshLambertMaterial({map: woodTex}));
                    d.position.copy(currentTarget.position);
                    scene.add(d); drops.push(d);
                    scene.remove(currentTarget);
                    blocks = blocks.filter(b => b !== currentTarget);
                    stopMining();
                }
            }

            drops.forEach((d, i) => {
                d.rotation.y += 0.05;
                if (camera.position.distanceTo(d.position) < 1.5) {
                    inventoryWood++; document.getElementById('inv-wood').innerText = inventoryWood;
                    if(selectedSlot===0) handItem.visible = true;
                    scene.remove(d); drops.splice(i, 1);
                }
            });

            hand.position.copy(camera.position); hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.5); hand.translateY(-0.4); hand.translateZ(-0.8);
            handItem.position.copy(hand.position); handItem.quaternion.copy(hand.quaternion);
            handItem.translateZ(-0.4);

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
