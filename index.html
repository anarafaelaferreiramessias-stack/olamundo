<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FNAF: Pizzaria Security</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="noise"></div>

    <div id="main-stage">
        <div id="office">
            <div class="wall left-wall"></div>
            <div class="wall right-wall"></div>
            <div class="desk">
                <div class="fan"></div>
            </div>
            
            <div class="door-system left" onclick="toggleDoor('L')">
                <div id="door-L" class="door-visual"></div>
                <button class="light-btn">LIGHT</button>
            </div>
        </div>

        <div id="monitor" class="monitor-hidden">
            <div id="camera-view">
                <div class="cam-info">CAM <span id="cam-id">1A</span> - <span id="cam-name">SHOW STAGE</span></div>
                <div class="static-effect"></div>
            </div>

            <div class="pizzaria-map">
                <button class="map-point" onclick="changeRoom('1A', 'SHOW STAGE')">1A</button>
                <button class="map-point" onclick="changeRoom('1B', 'DINING AREA')">1B</button>
                <button class="map-point" onclick="changeRoom('2A', 'WEST HALL')">2A</button>
                <button class="map-point" onclick="changeRoom('5', 'BACKSTAGE')">5</button>
            </div>
        </div>

        <div id="monitor-toggle" onmouseenter="toggleMonitor()"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
