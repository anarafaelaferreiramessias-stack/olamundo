<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploração Espacial 3D - Sistema Solar Realista</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            height: 100vh;
            overflow: hidden;
            background: #000;
            perspective: 1800px;
            cursor: grab;
            font-family: 'Segoe UI', sans-serif;
        }

        .universe {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            animation: slowRotate 420s linear infinite;
        }

        @keyframes slowRotate {
            from { transform: rotateY(0deg) rotateX(8deg); }
            to   { transform: rotateY(360deg) rotateX(8deg); }
        }

        /* ==================== ESTRELAS REALISTAS (múltiplas camadas) ==================== */
        .stars, .stars2, .stars3 {
            position: absolute;
            inset: 0;
            background: transparent;
            pointer-events: none;
        }
        .stars {
            background: radial-gradient(white 1px, transparent 1px) 0 0 / 90px 90px,
                        radial-gradient(white 0.8px, transparent 0.8px) 40px 40px / 70px 70px;
            opacity: 0.85;
            animation: starsDrift 240s linear infinite;
        }
        .stars2 {
            background: radial-gradient(white 1.2px, transparent 1px) 0 0 / 140px 140px;
            opacity: 0.65;
            animation: starsDrift 380s linear infinite reverse;
        }
        .stars3 {
            background: radial-gradient(white 0.7px, transparent 0.7px) 0 0 / 50px 50px;
            opacity: 0.45;
            animation: starsDrift 520s linear infinite;
        }
        @keyframes starsDrift {
            to { transform: translateZ(-3500px); }
        }

        /* ==================== NEBULOSA REALISTA (múltiplas camadas) ==================== */
        .nebula {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 15% 25%, rgba(120,40,255,0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 65%, rgba(0,220,255,0.16) 0%, transparent 55%),
                radial-gradient(circle at 45% 80%, rgba(255,80,180,0.12) 0%, transparent 60%);
            filter: blur(40px);
            animation: nebulaBreath 55s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes nebulaBreath {
            0%   { opacity: 0.55; transform: scale(0.95); }
            100% { opacity: 0.95; transform: scale(1.08); }
        }

        /* ==================== SOL COM FLARES ==================== */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #fff 15%, #ffeb3b 35%, #ff9800 65%, #f44336 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 
                0 0 80px #fff,
                0 0 180px #ffeb3b,
                0 0 320px #ff9800,
                0 0 520px #f44336;
            z-index: 10;
            animation: sunPulse 8s ease-in-out infinite alternate;
        }
        @keyframes sunPulse {
            0%   { box-shadow: 0 0 80px #fff, 0 0 180px #ffeb3b, 0 0 320px #ff9800; }
            100% { box-shadow: 0 0 110px #fff, 0 0 240px #ffeb3b, 0 0 420px #ff9800, 0 0 620px #f44336; }
        }

        /* ==================== PLANETAS COM DETALHES REALISTAS ==================== */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%);
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            transform-style: preserve-3d;
            box-shadow: 0 0 35px rgba(255,255,255,0.35);
            animation: selfRotate 25s linear infinite;
        }

        /* Mercúrio */
        .mercury  { width:22px; height:22px; background:#aaa; animation-duration: 9s; }
        /* Vênus */
        .venus    { width:42px; height:42px; background:#e0c090; animation-duration: 28s; }
        /* Terra + nuvens + lua */
        .earth    { width:48px; height:48px; background:linear-gradient(#0b66cc,#00aaff,#228b22); position:relative; }
        .earth::after {
            content:''; position:absolute; inset:0; background:radial-gradient(transparent 40%, rgba(255,255,255,0.35) 70%);
            border-radius:50%; animation: clouds 120s linear infinite;
        }
        /* Lua orbitando Terra */
        .moon {
            position:absolute; width:14px; height:14px; background:#ddd; border-radius:50%;
            top:50%; left:50%; transform:translate(-50%,-50%) translateX(38px);
            box-shadow:0 0 12px #fff; animation: moonOrbit 28s linear infinite;
        }

        /* Marte */
        .mars     { width:32px; height:32px; background:#c1440e; animation-duration: 65s; }
        /* Júpiter com faixas */
        .jupiter  { width:110px; height:110px; background:repeating-linear-gradient(45deg,#d4a373,#d4a373 12px,#b58a5a 12px,#b58a5a 24px); animation-duration: 180s; }
        /* Saturno com anéis */
        .saturn   { width:98px; height:98px; background:#e0d0a0; animation-duration: 280s; }
        .saturn::after {
            content:''; position:absolute; inset:-26px; border:12px solid #d0c090; border-radius:50%;
            transform:rotateX(72deg); box-shadow:0 0 40px #d0c090;
        }

        /* Urano */
        .uranus   { width:68px; height:68px; background:#9cf; animation-duration: 420s; }
        /* Netuno */
        .neptune  { width:66px; height:66px; background:#4488ff; animation-duration: 520s; }
        /* Plutão (anão) */
        .pluto    { width:18px; height:18px; background:#c8b8a0; animation-duration: 720s; }

        @keyframes selfRotate {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }
        @keyframes moonOrbit {
            from { transform: translate(-50%,-50%) rotate(0deg) translateX(38px) rotate(0deg); }
            to   { transform: translate(-50%,-50%) rotate(360deg) translateX(38px) rotate(-360deg); }
        }
        @keyframes clouds { to { transform: rotate(360deg); } }

        /* Distâncias reais aproximadas */
        .mercury  { --dist: 160px; }
        .venus    { --dist: 240px; }
        .earth    { --dist: 330px; }
        .mars     { --dist: 420px; }
        .jupiter  { --dist: 620px; }
        .saturn   { --dist: 820px; }
        .uranus   { --dist: 1020px; }
        .neptune  { --dist: 1180px; }
        .pluto    { --dist: 1350px; }

        /* ==================== COMETA COM CAUDA REALISTA ==================== */
        .comet {
            position: absolute;
            width: 18px; height: 18px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 30px #fff, 0 0 60px #a0f0ff;
            top: 30%;
            animation: cometFly 18s linear forwards;
            z-index: 8;
            opacity: 0;
        }
        .comet::after {
            content: '';
            position: absolute;
            left: -120px; top: 50%;
            width: 140px; height: 6px;
            background: linear-gradient(90deg, transparent, #a0f0ff, #fff);
            filter: blur(8px);
            transform: translateY(-50%) rotate(-35deg);
        }

        /* ==================== ESTRELAS CADENTES ==================== */
        .shooting-star {
            position: absolute;
            width: 4px; height: 4px;
            background: white;
            box-shadow: 0 0 20px #fff, 0 0 40px #a0f0ff;
            animation: shoot 2.2s linear forwards;
            opacity: 0;
        }

        @keyframes shoot {
            0%   { transform: translate(0,0) rotate(35deg); opacity: 0; }
            10%  { opacity: 1; }
            100% { transform: translate(800px, -600px) rotate(35deg); opacity: 0; }
        }

        /* HUD informativo */
        .hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0,0,0,0.65);
            padding: 18px 28px;
            border-radius: 14px;
            color: #a0f0ff;
            font-size: 1.05rem;
            text-shadow: 0 0 10px #00ffff;
            pointer-events: none;
            z-index: 30;
            border: 2px solid #00ffff;
        }
    </style>
</head>
<body>

    <div class="universe">
        <!-- Estrelas -->
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>

        <!-- Nebulosas -->
        <div class="nebula"></div>

        <!-- Sol -->
        <div class="sun"></div>

        <!-- Órbitas -->
        <div class="orbit">
            <div class="planet mercury"  style="--dist:160px"></div>
            <div class="planet venus"    style="--dist:240px"></div>
            
            <!-- Terra -->
            <div class="planet earth"    style="--dist:330px">
                <div class="moon"></div>
            </div>
            
            <div class="planet mars"     style="--dist:420px"></div>
            <div class="planet jupiter"  style="--dist:620px"></div>
            <div class="planet saturn"   style="--dist:820px"></div>
            <div class="planet uranus"   style="--dist:1020px"></div>
            <div class="planet neptune"  style="--dist:1180px"></div>
            <div class="planet pluto"    style="--dist:1350px"></div>
        </div>
    </div>

    <!-- HUD -->
    <div class="hud">
        Sistema Solar em Tempo Real<br>
        <span style="color:#ffeb3b">Mova o mouse</span> para explorar • <span style="color:#ffeb3b">Clique</span> para iniciar som
    </div>

    <!-- Áudio espacial imersivo -->
    <audio id="spaceSound" loop preload="auto" volume="0.28">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8d9f8e6d8e.mp3?filename=cosmos-galaxy-stars-universe-milky-way-planet-ambient-music-208619.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('spaceSound');
        audio.play().catch(() => {
            document.addEventListener('click', () => audio.play(), { once: true });
        });

        // Mouse controla a câmera 3D (efeito de voo espacial)
        let rotX = 8, rotY = 0;
        document.addEventListener('mousemove', e => {
            rotY = (e.clientX / window.innerWidth - 0.5) * 55;
            rotX = 8 + (e.clientY / window.innerHeight - 0.5) * 28;
            document.querySelector('.universe').style.transform = 
                `rotateY(${rotY}deg) rotateX(${rotX}deg)`;
        });

        // Cometa aleatório (passa de tempos em tempos)
        function launchComet() {
            const comet = document.createElement('div');
            comet.className = 'comet';
            comet.style.left = Math.random() * 40 + '%';
            comet.style.top  = Math.random() * 50 + '%';
            comet.style.animationDuration = (14 + Math.random() * 12) + 's';
            document.body.appendChild(comet);
            
            setTimeout(() => comet.remove(), 35000);
        }
        setInterval(() => { if (Math.random() > 0.6) launchComet(); }, 11000);

        // Estrelas cadentes impressionantes
        function createShootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            star.style.left = Math.random() * 70 + '%';
            star.style.top  = Math.random() * 60 + '%';
            star.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 4000);
        }
        setInterval(() => {
            if (Math.random() > 0.45) createShootingStar();
        }, 800);

        // Primeiras estrelas cadentes e cometas ao carregar
        setTimeout(() => {
            for (let i = 0; i < 6; i++) setTimeout(createShootingStar, i * 220);
        }, 800);
    </script>

</body>
</html>
