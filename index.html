<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_OVERRIDE_01</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        /* TELA DE HACKER */
        #hacker-terminal {
            position: absolute; width: 100%; height: 100%; background: #000; color: #0f0;
            padding: 20px; box-sizing: border-box; font-size: 14px; z-index: 1000;
            display: block; overflow-y: hidden;
        }
        .line { margin-bottom: 5px; opacity: 0; animation: fadeIn 0.2s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        #input-area { margin-top: 20px; display: flex; color: #0f0; }
        #cmd-input { background: transparent; border: none; color: #0f0; outline: none; font-family: inherit; font-size: inherit; width: 100%; }

        /* O JOGO (ESCONDIDO) */
        #game-container { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 15px; height: 15px; border: 2px solid white; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="hacker-terminal">
        <div id="log-container"></div>
        <div id="input-area">
            <span>root@internal_server:~$ </span>
            <input type="text" id="cmd-input" autofocus autocomplete="off">
        </div>
    </div>

    <div id="game-container">
        <div id="crosshair"></div>
    </div>

    <script>
        const logContainer = document.getElementById('log-container');
        const cmdInput = document.getElementById('cmd-input');
        const secretKey = "admin2026"; // <-- SUA CHAVE SECRETA AQUI

        const fakeLogs = [
            "INITIALIZING KERNEL EXPLOIT...",
            "BYPASSING FIREWALL LAYER 7...",
            "DECRYPTING SHA-256 PACKETS...",
            "ESTABLISHING SECURE TUNNEL TO 192.168.1.254...",
            "ACCESSING VIRTUAL MACHINE INSTANCE...",
            "WARNING: UNAUTHORIZED ACCESS DETECTED",
            "EXECUTING STEALTH PROTOCOL...",
            "SYSTEM STATUS: STABLE",
            "AWAITING COMMAND..."
        ];

        // Simula o texto de hacker aparecendo
        let logIndex = 0;
        function printLogs() {
            if (logIndex < fakeLogs.length) {
                const line = document.createElement('div');
                line.className = 'line';
                line.textContent = `[${new Date().toLocaleTimeString()}] ${fakeLogs[logIndex]}`;
                logContainer.appendChild(line);
                logIndex++;
                setTimeout(printLogs, 600);
            }
        }
        printLogs();

        // Escuta o comando secreto
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = cmdInput.value.toLowerCase();
                
                if (val === secretKey) {
                    // SEGREDO REVELADO: Inicia o jogo
                    document.getElementById('hacker-terminal').style.background = '#fff'; // Flash de luz
                    setTimeout(() => {
                        document.getElementById('hacker-terminal').style.display = 'none';
                        document.getElementById('game-container').style.display = 'block';
                        initMinecraft(); // Inicia o motor do jogo
                    }, 100);
                } else {
                    // Se errar, mostra erro de comando
                    const err = document.createElement('div');
                    err.className = 'line';
                    err.style.color = 'red';
                    err.textContent = `ERROR: Command '${val}' not recognized. Access Denied.`;
                    logContainer.appendChild(err);
                    cmdInput.value = '';
                }
            }
        });

        // --- MOTOR DO JOGO (MINECRAFT) ---
        function initMinecraft() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Iluminação
            const light = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(light);

            // Texturas Procedurais
            function createTex(color) {
                const canvas = document.createElement('canvas');
                canvas.width = 16; canvas.height = 16;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = color; ctx.fillRect(0,0,16,16);
                for(let i=0; i<32; i++) {
                    ctx.fillStyle = 'rgba(0,0,0,0.1)';
                    ctx.fillRect(Math.random()*16, Math.random()*16, 1, 1);
                }
                const t = new THREE.CanvasTexture(canvas);
                t.magFilter = THREE.NearestFilter;
                return t;
            }

            const grassMat = new THREE.MeshLambertMaterial({ map: createTex('#5d9948') });
            const woodMat = new THREE.MeshLambertMaterial({ map: createTex('#6a4e32') });

            // Chão
            const blocks = [];
            for(let x=-10; x<10; x++) {
                for(let z=-10; z<10; z++) {
                    const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), grassMat);
                    b.position.set(x, 0, z);
                    scene.add(b);
                    blocks.push(b);
                }
            }

            // Árvores
            for(let i=0; i<5; i++) {
                let rx = Math.floor(Math.random()*18-9);
                let rz = Math.floor(Math.random()*18-9);
                for(let h=1; h<4; h++) {
                    const trunk = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), woodMat);
                    trunk.position.set(rx, h, rz);
                    scene.add(trunk);
                    blocks.push(trunk);
                }
            }

            camera.position.set(0, 3, 10);
            
            // Controles Básicos
            let move = { f: false, b: false, l: false, r: false };
            window.onkeydown = (e) => {
                if(e.code === 'KeyW') move.f = true;
                if(e.code === 'KeyS') move.b = true;
                if(e.code === 'KeyA') move.l = true;
                if(e.code === 'KeyD') move.r = true;
            };
            window.onkeyup = (e) => {
                if(e.code === 'KeyW') move.f = false;
                if(e.code === 'KeyS') move.b = false;
                if(e.code === 'KeyA') move.l = false;
                if(e.code === 'KeyD') move.r = false;
            };

            function animate() {
                requestAnimationFrame(animate);
                if(move.f) camera.translateZ(-0.1);
                if(move.b) camera.translateZ(0.1);
                if(move.l) camera.translateX(-0.1);
                if(move.r) camera.translateX(0.1);
                renderer.render(scene, camera);
            }
            animate();
            
            renderer.domElement.onclick = () => renderer.domElement.requestPointerLock();
            window.onmousemove = (e) => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                }
            };
        }
    </script>
</body>
</html>
