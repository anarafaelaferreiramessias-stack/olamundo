<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Edição Sobrevivência</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #tela-inicial {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('https://images.alphacoders.com/133/1331001.png');
            background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .btn { padding: 15px 50px; background: #5fa03d; color: white; border: 4px solid #1e3511; cursor: pointer; font-size: 22px; font-weight: bold; box-shadow: 0 5px #2d511b; }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px #2d511b; }
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 24px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <h1 style="color: white; font-size: 70px; text-shadow: 5px 5px #000; margin-bottom: 20px;">BLOCKS 3D</h1>
        <button class="btn" onclick="iniciar()">JOGAR</button>
    </div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let handGroup; // Grupo para a mão + bloco

        function criarTextura(corBase, corRuidosa, densidade = 60) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = corBase;
            ctx.fillRect(0, 0, 16, 16);
            for (let i = 0; i < densidade; i++) {
                ctx.fillStyle = corRuidosa;
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function iniciar() {
            document.getElementById('tela-inicial').style.display = 'none';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x72a0ff);
            scene.fog = new THREE.Fog(0x72a0ff, 20, 80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sol = new THREE.DirectionalLight(0xffffff, 0.6);
            sol.position.set(10, 20, 10);
            scene.add(sol);

            // Texturas
            const texGrama = criarTextura('#598a32', '#4a752a', 80);
            const texTerra = criarTextura('#79553a', '#5d3f2a', 50);
            const texPele = criarTextura('#d8bb9d', '#c2a385', 30);
            const texFolha = criarTextura('#2d4c1e', '#1e3314', 90);

            const matGrama = [
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texGrama }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra })
            ];

            const geo = new THREE.BoxGeometry(1, 1, 1);
            
            // Gerar mundo 100x100 com relevo
            for (let x = -50; x < 50; x++) {
                for (let z = -50; z < 50; z++) {
                    // MATEMÁTICA DO RELEVO (Seno e Cosseno cria "montanhas")
                    let h = Math.floor(Math.sin(x/8) * Math.cos(z/8) * 2);
                    
                    const bloco = new THREE.Mesh(geo, matGrama);
                    bloco.position.set(x, h, z);
                    scene.add(bloco);
                    objects.push(bloco);

                    if(Math.random() > 0.99) criarArvore(x, h+1, z, texTerra, texFolha);
                }
            }

            // --- CRIANDO A MÃO DO STEVE ---
            handGroup = new THREE.Group();
            
            // O Braço
            const braco = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.8), new THREE.MeshLambertMaterial({ map: texPele }));
            braco.position.set(0.6, -0.5, -0.6);
            handGroup.add(braco);

            // O Bloco na mão
            const blocoMao = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), matGrama);
            blocoMao.position.set(0.6, -0.35, -1.1);
            handGroup.add(blocoMao);

            scene.add(handGroup);

            setupControls();
        }

        function criarArvore(x, y, z, texM, texF) {
            const geo = new THREE.BoxGeometry(1,1,1);
            const matM = new THREE.MeshLambertMaterial({ map: texM });
            const matF = new THREE.MeshLambertMaterial({ map: texF });
            for(let i=0; i<4; i++) {
                const t = new THREE.Mesh(geo, matM);
                t.position.set(x, y+i, z);
                scene.add(t);
                objects.push(t);
            }
            for(let fx=-2; fx<=2; fx++) {
                for(let fy=3; fy<=5; fy++) {
                    for(let fz=-2; fz<=2; fz++) {
                        if(Math.abs(fx)+Math.abs(fz) > 3) continue;
                        const f = new THREE.Mesh(geo, matF);
                        f.position.set(x+fx, y+fy, z+fz);
                        scene.add(f);
                        objects.push(f);
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.18; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            document.addEventListener('mousedown', () => document.body.requestPointerLock());
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            velocity.x -= velocity.x * 0.1;
            velocity.z -= velocity.z * 0.1;
            velocity.y -= 0.008;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 0.06;
            if (moveL || moveR) velocity.x -= direction.x * 0.06;

            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);
            camera.position.y += velocity.y;

            // Colisão com o relevo dinâmico
            let gridX = Math.round(camera.position.x);
            let gridZ = Math.round(camera.position.z);
            let groundY = Math.sin(gridX/8) * Math.cos(gridZ/8) * 2;

            if (camera.position.y < groundY + 1.6) {
                velocity.y = 0;
                camera.position.y = groundY + 1.6;
                canJump = true;
            }

            if(handGroup) {
                handGroup.position.copy(camera.position);
                handGroup.rotation.copy(camera.rotation);
                let bob = (moveF || moveB || moveL || moveR) ? Math.sin(Date.now() * 0.008) * 0.03 : 0;
                handGroup.position.y += bob;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
