<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar o Espaço - Viagem Cósmica</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            height: 100vh;
            overflow: hidden;
            background: #000;
            perspective: 1200px; /* Profundidade 3D */
            font-family: Arial, sans-serif;
            color: #eee;
            cursor: move;
        }

        .scene {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            animation: rotateScene 240s linear infinite;
        }

        @keyframes rotateScene {
            from { transform: rotateY(0deg) rotateX(5deg); }
            to   { transform: rotateY(360deg) rotateX(5deg); }
        }

        /* Estrelas em camadas para sensação de velocidade */
        .stars {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(white 0.8px, transparent 0.8px);
            background-size: 80px 80px, 60px 60px, 40px 40px;
            background-position: 0 0, 30px 30px, 50px 50px;
            opacity: 0.7;
            animation: starMove 180s linear infinite;
        }

        .stars-front {
            animation-duration: 60s;
            opacity: 0.9;
        }

        @keyframes starMove {
            to { transform: translateZ(-2000px); }
        }

        /* Sol central com glow */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #ffeb3b 30%, #ff9800 70%, transparent 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 120px #ffeb3b, 0 0 240px #ff9800, 0 0 400px #f44336;
            z-index: 5;
        }

        /* Planetas orbitando */
        .planet-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%);
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255,255,255,0.4);
        }

        .mercury  { width: 20px;  height: 20px;  background: #a9a9a9; animation: orbit 12s linear infinite; }
        .venus    { width: 38px;  height: 38px;  background: #e0c070; animation: orbit 30s linear infinite; }
        .earth    { width: 40px;  height: 40px;  background: linear-gradient(#0066cc, #00aaff, #228b22); animation: orbit 45s linear infinite; }
        .mars     { width: 28px;  height: 28px;  background: #c1440e; animation: orbit 70s linear infinite; }
        .jupiter  { width: 100px; height: 100px; background: #d4a373; animation: orbit 200s linear infinite; }
        .saturn   { width: 90px;  height: 90px;  background: #e0d0a0; animation: orbit 300s linear infinite; }

        .saturn::after { /* Anéis simples */
            content: '';
            position: absolute;
            inset: -20px;
            border: 8px solid #c0b080;
            border-radius: 50%;
            transform: rotateX(70deg);
            box-shadow: 0 0 40px #c0b080;
        }

        @keyframes orbit {
            from { transform: rotateY(0deg) translateX(var(--distance)) rotateY(0deg); }
            to   { transform: rotateY(360deg) translateX(var(--distance)) rotateY(-360deg); }
        }

        .mercury  { --distance: 140px; }
        .venus    { --distance: 220px; }
        .earth    { --distance: 300px; }
        .mars     { --distance: 380px; }
        .jupiter  { --distance: 580px; }
        .saturn   { --distance: 780px; }

        /* Nebulosa / glow cósmico */
        .nebula {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(100,0,255,0.12) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(0,200,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(255,100,200,0.08) 0%, transparent 60%);
            pointer-events: none;
            animation: pulse 40s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 0.9; transform: scale(1.08); }
        }

        /* Texto flutuante (opcional - remova se quiser puro espaço) */
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #00ffff;
            pointer-events: none;
            z-index: 20;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="stars"></div>
        <div class="stars stars-front"></div>
        
        <div class="nebula"></div>

        <div class="sun"></div>

        <div class="planet-orbit">
            <div class="planet mercury"></div>
            <div class="planet venus"></div>
            <div class="planet earth"></div>
            <div class="planet mars"></div>
            <div class="planet jupiter"></div>
            <div class="planet saturn"></div>
        </div>
    </div>

    <div class="info">Explorando o espaço... Mova o mouse para navegar</div>

    <!-- Música ambiente espacial (royalty-free Pixabay) -->
    <audio id="spaceAudio" loop preload="auto" volume="0.25">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8d9f8e6d8e.mp3?filename=cosmos-galaxy-stars-universe-milky-way-planet-ambient-music-208619.mp3" type="audio/mpeg">
        <!-- Alternativa vibe Super Mario Galaxy (se preferir nostálgico): -->
        <!-- <source src="https://vgmsite.com/soundtracks/super-mario-galaxy-complete-soundtrack-wii-wii-u-gamerip-2007/1-02.%20Title%20Theme.mp3" type="audio/mpeg"> -->
    </audio>

    <script>
        const audio = document.getElementById('spaceAudio');
        
        // Tenta autoplay (navegadores bloqueiam sem interação)
        audio.play().catch(() => {
            document.body.addEventListener('click', () => audio.play(), { once: true });
        });

        // Parallax simples com mouse (sensação de exploração)
        document.addEventListener('mousemove', e => {
            const x = (e.clientX / window.innerWidth - 0.5) * 30;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            document.querySelector('.scene').style.transform = 
                `rotateY(${x}deg) rotateX(${-y}deg)`;
        });
    </script>

</body>
</html>
