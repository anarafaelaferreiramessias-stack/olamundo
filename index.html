<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Clone 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background: #000; }
        #menu {
            position: absolute; width: 100%; height: 100%; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://wallpaperaccess.com/full/465691.jpg') center/cover;
        }
        h1 { color: white; font-size: 80px; text-shadow: 5px 5px #373737; margin-bottom: 50px; }
        .btn { 
            padding: 15px 60px; background: #6c6c6c; border: 4px solid #000; color: white; 
            font-size: 24px; cursor: pointer; transition: 0.2s; 
        }
        .btn:hover { background: #3c8527; transform: scale(1.1); }
        #crosshair { 
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; 
            transform: translate(-50%, -50%); display: none; pointer-events: none; 
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; background: rgba(0,0,0,0.5); border: 4px solid #1e1e1e; padding: 5px;
        }
        .slot { width: 50px; height: 50px; background: #8b8b8b; border: 4px solid #373737; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>MINECRAFT 2.0</h1>
        <button class="btn" onclick="initGame()">NEW GAME</button>
    </div>

    <div id="crosshair"></div>
    <div id="hotbar">
        <div class="slot">ID: 1</div>
    </div>

    <script>
        let scene, camera, renderer, raycaster, controls;
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let blocks = [];
        let prevTime = performance.now();

        // --- GERADOR DE TEXTURAS (PARA NÃO DAR ERRO) ---
        function createCanvasTexture(color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color1;
            ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = color2;
            for(let i=0; i<16; i++) {
                ctx.fillRect(Math.random()*16, Math.random()*16, 2, 2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        const texGrass = createCanvasTexture('#59903c', '#4a7a32');
        const texDirt = createCanvasTexture('#79553a', '#5d4037');
        const texWood = createCanvasTexture('#6a4e32', '#4d3926');
        const texLeaf = createCanvasTexture('#3a5e24', '#2d4a1c');

        // --- MÚSICA SINTETIZADA ---
        function playMinecraftMusic() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [261.63, 293.66, 329.63, 392.00]; // C, D, E, G (Vibe calma)
            
            setInterval(() => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[Math.floor(Math.random() * notes.length)], ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 4);
            }, 5000);
        }

        function initGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hotbar').style.display = 'flex';
            
            playMinecraftMusic();

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee);
            scene.fog = new THREE.Fog(0x7ec0ee, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            const light = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(light);
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Chão de Grama
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshLambertMaterial({ map: texGrass });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Gerar Árvores
            for (let i = 0; i < 40; i++) {
                spawnTree(
                    Math.floor(Math.random() * 80 - 40), 
                    0, 
                    Math.floor(Math.random() * 80 - 40)
                );
            }

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            // Controles de Mouse
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) {
                    renderer.domElement.requestPointerLock();
                } else {
                    if (e.button === 0) breakBlock();
                    if (e.button === 2) placeBlock();
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            window.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveF = true;
                if(e.code === 'KeyS') moveB = true;
                if(e.code === 'KeyA') moveL = true;
                if(e.code === 'KeyD') moveR = true;
                if(e.code === 'Space' && camera.position.y <= 2.1) velocity.y = 5;
            });
            window.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveF = false;
                if(e.code === 'KeyS') moveB = false;
                if(e.code === 'KeyA') moveL = false;
                if(e.code === 'KeyD') moveR = false;
            });

            animate();
        }

        function spawnTree(x, y, z) {
            // Tronco
            for (let h = 0; h < 4; h++) {
                const log = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({map: texWood}));
                log.position.set(x, y + h + 0.5, z);
                scene.add(log);
                blocks.push(log);
            }
            // Folhas
            for (let lx = -1; lx <= 1; lx++) {
                for (let ly = 3; ly <= 5; ly++) {
                    for (let lz = -1; lz <= 1; lz++) {
                        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({map: texLeaf}));
                        leaf.position.set(x + lx, y + ly + 0.5, z + lz);
                        scene.add(leaf);
                        blocks.push(leaf);
                    }
                }
            }
        }

        function breakBlock() {
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);
            if (hits.length > 0 && hits[0].distance < 5) {
                scene.remove(hits[0].object);
                blocks = blocks.filter(b => b !== hits[0].object);
            }
        }

        function placeBlock() {
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);
            if (hits.length > 0 && hits[0].distance < 5) {
                const hit = hits[0];
                const pos = hit.object.position.clone().add(hit.face.normal);
                const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({map: texWood}));
                b.position.copy(pos);
                scene.add(b);
                blocks.push(b);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 15.0 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 100.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 100.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 2) {
                velocity.y = 0;
                camera.position.y = 2;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
