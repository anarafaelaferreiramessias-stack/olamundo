<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocks 3D - Aria Math</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/minecraftia');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Minecraftia', sans-serif; }
        
        /* Capa de Entrada */
        #tela-inicial {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.7)), 
                        url('https://images.alphacoders.com/133/1331001.png');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: 0.8s;
        }

        .logo { font-size: clamp(40px, 8vw, 100px); color: #fff; text-shadow: 8px 8px 0px #373737; margin-bottom: 40px; animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .btn-minecraft {
            width: 350px; padding: 15px; margin: 8px;
            background: #4e4e4e; border: 4px solid #000;
            color: white; font-size: 20px; cursor: pointer;
            box-shadow: inset -4px -4px #222, inset 4px 4px #aaa;
        }
        .btn-minecraft:hover { background: #5fa03d; border-color: #fff; }

        /* Interface do Jogo */
        #crosshair {
            position: fixed; top: 50%; left: 50%; color: white;
            font-size: 24px; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10; display: none; mix-blend-mode: difference;
        }
        #ui-topo {
            position: fixed; top: 20px; left: 20px; color: white;
            text-shadow: 2px 2px #000; z-index: 5; display: none;
        }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <div class="logo">BLOCKS 3D</div>
        <button class="btn-minecraft" onclick="comecarJogo()">JOGAR MUNDO</button>
        <button class="btn-minecraft">OPÇÕES</button>
    </div>

    <div id="ui-topo">♪ Tocando: C418 - Aria Math</div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let hand; // A "mão" do jogador

        function comecarJogo() {
            document.getElementById('tela-inicial').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('tela-inicial').style.display = 'none';
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('ui-topo').style.display = 'block';
                init();
                animate();
            }, 800);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); 
            scene.fog = new THREE.Fog(0x87CEEB, 10, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 0.7);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Criar o Chão (Mundo de blocos)
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const loader = new THREE.TextureLoader();
            
            // Usando cores sólidas para garantir que carregue rápido, mas simulando Minecraft
            const matGrama = new THREE.MeshLambertMaterial({ color: 0x559944 });
            const matTerra = new THREE.MeshLambertMaterial({ color: 0x8b4513 });

            for (let x = -15; x < 15; x++) {
                for (let z = -15; z < 15; z++) {
                    const block = new THREE.Mesh(boxGeo, matGrama);
                    block.position.set(x, 0, z);
                    scene.add(block);
                    objects.push(block);
                }
            }

            // Criar a "Mão" ou Item segurado
            const handGeo = new THREE.BoxGeometry(0.3, 0.3, 0.6);
            const handMat = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
            hand = new THREE.Mesh(handGeo, handMat);
            scene.add(hand);

            // Controles
            setupControls();
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code == 'KeyW') moveF = true; if(e.code == 'KeyS') moveB = true;
                if(e.code == 'KeyA') moveL = true; if(e.code == 'KeyD') moveR = true;
                if(e.code == 'Space' && canJump) { velocity.y += 0.2; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code == 'KeyW') moveF = false; if(e.code == 'KeyS') moveB = false;
                if(e.code == 'KeyA') moveL = false; if(e.code == 'KeyD') moveR = false;
            });
            
            document.addEventListener('click', () => { document.body.requestPointerLock(); });
            
            document.addEventListener('mousemove', e => {
                if (document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Física e Movimento
            velocity.x -= velocity.x * 10 * 0.01;
            velocity.z -= velocity.z * 10 * 0.01;
            velocity.y -= 0.01; // Gravidade

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 0.15;
            if (moveL || moveR) velocity.x -= direction.x * 0.15;

            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);
            camera.position.y += velocity.y;

            // Colisão com o chão
            if (camera.position.y < 1.6) {
                velocity.y = 0;
                camera.position.y = 1.6;
                canJump = true;
            }

            // Posicionar a "mão" na frente da câmera
            if(hand) {
                hand.position.copy(camera.position);
                hand.rotation.copy(camera.rotation);
                hand.updateMatrix();
                hand.translateZ(-0.8);
                hand.translateX(0.5);
                hand.translateY(-0.4);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
