<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Fixed - Controles e Colisão</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        canvas { display: block; }
        #menu {
            position: fixed; width: 100%; height: 100%; z-index: 100;
            background: rgba(0,0,0,0.7); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; font-family: sans-serif;
        }
        .btn { padding: 15px 50px; font-size: 20px; background: #4a7023; color: white; border: 3px solid #000; cursor: pointer; font-weight: bold; }
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.8); transform: translate(-50%, -50%);
            pointer-events: none; z-index: 50; mix-blend-mode: difference;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="font-size: 40px; text-shadow: 3px 3px #000;">CONTROLES <span style="color:#7cfc00">OK</span></h1>
        <button class="btn" onclick="start()">JOGAR AGORA</button>
    </div>

    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls, hand;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(), prevTime = performance.now();
        let objects = [];
        let isPunching = false, punchTimer = 0;

        const blockSize = 16;
        const playerRadius = 5; 

        function createTex(base, noise, points = 50) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = base; ctx.fillRect(0, 0, 64, 64);
            for(let i=0; i<points; i++) {
                ctx.fillStyle = noise[Math.floor(Math.random() * noise.length)];
                ctx.fillRect(Math.random()*64, Math.random()*64, Math.random()*10+2, Math.random()*10+2);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; return tex;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
            controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(500, 1000, 500);
            scene.add(sun);

            const tGrassTop = createTex('#567d46', ['#4d703e', '#5e8a4d'], 120);
            const tGrassSide = createTex('#8B4513', ['#7a3e11', '#567d46'], 80);
            const tDirt = createTex('#8B4513', ['#7a3e11', '#5d2f0d'], 50);
            const tStone = createTex('#808080', ['#707070', '#8c8c8c'], 60);
            const tSkin = createTex('#ffdbac', ['#f1c27d'], 20);

            const grassMats = [
                new THREE.MeshLambertMaterial({ map: tGrassSide }), new THREE.MeshLambertMaterial({ map: tGrassSide }),
                new THREE.MeshLambertMaterial({ map: tGrassTop }), new THREE.MeshLambertMaterial({ map: tDirt }),
                new THREE.MeshLambertMaterial({ map: tGrassSide }), new THREE.MeshLambertMaterial({ map: tGrassSide })
            ];
            const stoneMat = new THREE.MeshLambertMaterial({ map: tStone });

            const handGeo = new THREE.BoxGeometry(0.5, 0.5, 1.5);
            const handMat = new THREE.MeshLambertMaterial({ map: tSkin });
            hand = new THREE.Mesh(handGeo, handMat);
            hand.position.set(0.8, -0.8, -1.2); 
            camera.add(hand);

            const geo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
            
            for (let x = -35; x < 35; x++) {
                for (let z = -35; z < 35; z++) {
                    let h = Math.round((Math.sin(x/8) * Math.cos(z/8) * 4) + (Math.sin(x/15) * 6));
                    const blockMat = h > 5 ? stoneMat : grassMats;
                    const block = new THREE.Mesh(geo, blockMat);
                    block.position.set(x * blockSize, h * blockSize, z * blockSize);
                    scene.add(block);
                    objects.push(block);
                }
            }

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            document.body.addEventListener('mousedown', breakBlock);
        }

        function checkCollision(pos) {
            for (let i = 0; i < objects.length; i++) {
                const b = objects[i].position;
                if (pos.x + playerRadius > b.x - 8 && pos.x - playerRadius < b.x + 8 &&
                    pos.z + playerRadius > b.z - 8 && pos.z - playerRadius < b.z + 8 &&
                    pos.y - 14 < b.y + 8 && pos.y + 2 > b.y - 8) {
                    return true;
                }
            }
            return false;
        }

        function breakBlock() {
            if (!controls.isLocked) return;
            isPunching = true; punchTimer = 0;
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = ray.intersectObjects(objects);
            if (hits.length > 0 && hits[0].distance < 64) {
                scene.remove(hits[0].object);
                objects = objects.filter(obj => obj !== hits[0].object);
            }
        }

        function start() { document.getElementById('menu').style.display = 'none'; controls.lock(); }

        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if(canJump) { velocity.y += 220; canJump = false; } break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 70.0 * delta; 

                const player = controls.getObject();

                // CORREÇÃO DOS EIXOS DE MOVIMENTO
                if (moveForward) velocity.z -= 400.0 * delta;
                if (moveBackward) velocity.z += 400.0 * delta;
                if (moveLeft) velocity.x -= 400.0 * delta;
                if (moveRight) velocity.x += 400.0 * delta;

                // Teste de Colisão Horizontal (X)
                const oldX = player.position.x;
                controls.moveRight(velocity.x * delta);
                if(checkCollision(player.position)) player.position.x = oldX;

                // Teste de Colisão Horizontal (Z)
                const oldZ = player.position.z;
                controls.moveForward(-velocity.z * delta);
                if(checkCollision(player.position)) player.position.z = oldZ;

                // Teste de Colisão Vertical (Y)
                player.position.y += (velocity.y * delta);
                if(checkCollision(player.position)) {
                    if (velocity.y < 0) {
                        canJump = true;
                        player.position.y -= (velocity.y * delta);
                        velocity.y = 0;
                    } else {
                        velocity.y = 0;
                    }
                }

                // Animação da mão
                if (isPunching) {
                    punchTimer += delta * 15;
                    hand.position.z = -1.2 - Math.sin(punchTimer) * 0.5;
                    if (punchTimer > Math.PI) isPunching = false;
                }

                if (player.position.y < -500) player.position.set(0, 100, 0);
                prevTime = time;
            }
            renderer.render(scene, camera);
        }
        init(); animate();
    </script>
</body>
</html>
