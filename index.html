<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Nature X Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; background: #000; }
        #menu { position: absolute; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a1a; }
        .title { font-size: 3.5rem; color: #8dc63f; text-shadow: 3px 3px #000; margin-bottom: 2rem; }
        .btn { padding: 15px 45px; background: #444; border: 4px solid #fff; color: white; cursor: pointer; font-size: 1.2rem; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #8dc63f; transform: scale(1.1); }
        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 8px; padding: 10px; background: rgba(0,0,0,0.7); border: 2px solid #fff; }
        .slot { width: 45px; height: 45px; border: 2px solid #555; display: flex; align-items: center; justify-content: center; position: relative; }
        .slot.selected { border-color: #fff; background: rgba(255,255,255,0.2); }
        .count { position: absolute; bottom: 1px; right: 4px; color: #fff; font-size: 14px; text-shadow: 1px 1px #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 class="title">MINECRAFT: NATURE X</h1>
        <button class="btn" onclick="startWorld()">NEW GAME</button>
    </div>

    <div id="hotbar">
        <div class="slot selected"><div style="width:25px; height:25px; background: #5d4037; border: 1px solid #000;"></div><div id="inv-val" class="count">0</div></div>
        <div class="slot"></div><div class="slot"></div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();
        let blocks = [], leavesParticles = []; 
        let inventory = 0;

        // Texturas Simuladas (Pixel Art Style)
        const loader = new THREE.TextureLoader();
        const woodTex = loader.load('https://threejs.org/examples/textures/crate.gif');

        function startWorld() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hotbar').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'block';
            init();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee);
            scene.fog = new THREE.Fog(0x7ec0ee, 5, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(5, 15, 5);
            scene.add(sun);

            // GERAÇÃO DO CHÃO VOXEL (BLOCO A BLOCO)
            const grassMat = new THREE.MeshLambertMaterial({color: 0x487e25}); // Verde Nature X
            const dirtMat = new THREE.MeshLambertMaterial({color: 0x5d4037});

            for(let x = -12; x <= 12; x++) {
                for(let z = -12; z <= 12; z++) {
                    createBlock(x, 0, z, grassMat, "grass");
                    if(Math.random() > 0.93) spawnTree(x, 0, z); // Muitas árvores
                }
            }

            // Mão
            hand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.7), new THREE.MeshLambertMaterial({color: 0xdbac82}));
            scene.add(hand);

            raycaster = new THREE.Raycaster();
            setupControls();
            animate();
        }

        function createBlock(x, y, z, mat, type) {
            const block = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
            block.position.set(x, y, z);
            block.userData = { type: type };
            scene.add(block);
            blocks.push(block);
        }

        function spawnTree(x, y, z) {
            // Tronco
            const logMat = new THREE.MeshLambertMaterial({map: woodTex});
            for(let h = 1; h <= 4; h++) createBlock(x, y + h, z, logMat, "wood");

            // FolhasNature X
            const leafMat = new THREE.MeshLambertMaterial({color: 0x2d5a27, transparent: true, opacity: 0.9});
            for(let ly = 3; ly <= 5; ly++) {
                for(let lx = -1; lx <= 1; lx++) {
                    for(let lz = -1; lz <= 1; lz++) {
                        if(ly === 5 && (lx !== 0 || lz !== 0)) continue;
                        createBlock(x + lx, y + ly + 1, z + lz, leafMat, "leaf");
                        
                        // Criar partícula de folha caindo
                        if(Math.random() > 0.8) {
                            const p = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.1), leafMat);
                            p.position.set(x + lx, y + ly, z + lz);
                            scene.add(p);
                            leavesParticles.push(p);
                        }
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
                else {
                    raycaster.setFromCamera(new THREE.Vector2(), camera);
                    const hits = raycaster.intersectObjects(blocks);
                    if (hits.length > 0 && hits[0].distance < 5) {
                        const target = hits[0].object;
                        if (e.button === 0) { // QUEBRAR
                            scene.remove(target);
                            blocks = blocks.filter(b => b !== target);
                            inventory++;
                            document.getElementById('inv-val').innerText = inventory;
                        } else if (e.button === 2 && inventory > 0) { // CONSTRUIR
                            const pos = target.position.clone().add(hits[0].face.normal);
                            createBlock(pos.x, pos.y, pos.z, new THREE.MeshLambertMaterial({color: 0x5d4037}), "dirt");
                            inventory--;
                            document.getElementById('inv-val').innerText = inventory;
                        }
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveF = true; if(e.code === 'KeyS') moveB = true;
                if(e.code === 'KeyA') moveL = true; if(e.code === 'KeyD') moveR = true;
                if(e.code === 'Space' && canJump) { velocity.y += 4; canJump = false; }
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveF = false; if(e.code === 'KeyS') moveB = false;
                if(e.code === 'KeyA') moveL = false; if(e.code === 'KeyD') moveR = false;
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 50.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 50.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            // Colisão com o chão voxel
            if (camera.position.y < 2.2) { velocity.y = 0; camera.position.y = 2.2; canJump = true; }

            // Animação de folhas caindo
            leavesParticles.forEach((p, i) => {
                p.position.y -= 0.02;
                p.rotation.x += 0.02;
                if(p.position.y < 0.5) p.position.y = 5 + Math.random()*2;
            });

            // Mão
            hand.position.copy(camera.position);
            hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.5); hand.translateY(-0.4 + Math.sin(time*0.004)*0.02); hand.translateZ(-0.8);

            camera.rotation.order = 'YXZ';
            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
