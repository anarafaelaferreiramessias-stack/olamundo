<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo - Super Mario Kart Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 35%, #228B22 35%, #556B2F 45%, #8B4513 100%);
            font-family: 'Press Start 2P', cursive;
            color: #fff;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Pista com movimento mais intenso (estilo Super Mario Kart) */
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70%;
            background: repeating-linear-gradient(
                0deg,
                #808080 0px,
                #808080 40px,
                #C0C0C0 40px,
                #C0C0C0 80px
            );
            animation: scrollRoad 0.8s linear infinite;
            border-top: 12px solid #FFD700;
            border-bottom: 12px solid #FFD700;
        }

        .road-lines {
            position: absolute;
            top: 0;
            left: 50%;
            width: 60px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                #FF0000 0px,
                #FF0000 30px,
                transparent 30px,
                transparent 60px
            );
            transform: translateX(-50%);
            animation: scrollLines 0.8s linear infinite;
        }

        @keyframes scrollRoad {
            0% { background-position: 0 0; }
            100% { background-position: 0 -160px; }
        }

        @keyframes scrollLines {
            0% { background-position: 0 0; }
            100% { background-position: 0 -120px; }
        }

        /* Kart mais parecido com Super Mario Kart (perspectiva simples) */
        .kart-container {
            position: relative;
            width: 300px;
            height: 200px;
            perspective: 800px;
            z-index: 10;
            animation: kartBounce 1.6s ease-in-out infinite;
        }

        .kart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(15deg);
            width: 240px;
            height: 120px;
        }

        .kart-body {
            width: 100%;
            height: 70%;
            background: #FF0000; /* Vermelho Mario */
            border: 10px solid #000;
            border-radius: 30px 80px 30px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            position: relative;
        }

        .kart-front {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 50px;
            background: #000;
            border: 10px solid #FF0000;
            border-radius: 50% 50% 10px 10px;
        }

        .mario-head {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: #FFB6C1;
            border: 8px solid #000;
            border-radius: 50%;
        }

        .mario-hat {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 40px;
            background: #FF0000;
            border: 8px solid #000;
            border-radius: 50% 50% 0 0;
        }

        .wheel {
            position: absolute;
            background: #111;
            border: 12px solid #FFD700;
            border-radius: 50%;
            box-shadow: inset 0 0 20px #000;
        }

        .front-wheel { width: 70px; height: 70px; bottom: -25px; }
        .back-wheel { width: 80px; height: 80px; bottom: -35px; }
        .left { left: 10px; }
        .right { right: 10px; }

        @keyframes kartBounce {
            0%, 100% { transform: translate(-50%, -50%) rotateX(15deg) translateY(0); }
            50% { transform: translate(-50%, -50%) rotateX(15deg) translateY(-40px); }
        }

        /* Texto Olá Mundo como título de corrida */
        .title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.8em;
            color: #FFD700;
            text-shadow: 8px 8px 0 #000, 12px 12px 0 #FF0000;
            letter-spacing: 10px;
            text-align: center;
            z-index: 15;
            white-space: nowrap;
        }

        .subtitle {
            font-size: 1.6em;
            color: #FFFFFF;
            text-shadow: 5px 5px 0 #000;
            margin-top: 20px;
        }

        .info-card {
            position: absolute;
            bottom: 15%;
            background: rgba(0, 0, 0, 0.75);
            padding: 30px 60px;
            border: 10px solid #FFD700;
            border-radius: 25px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .info-card p {
            font-size: 1.2em;
            color: #FFD700;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <!-- Pista em movimento -->
    <div class="road">
        <div class="road-lines"></div>
    </div>

    <!-- Kart com Mario -->
    <div class="kart-container">
        <div class="kart">
            <div class="kart-body">
                <div class="kart-front">
                    <div class="mario-head">
                        <div class="mario-hat"></div>
                    </div>
                </div>
            </div>
            <div class="wheel front-wheel left"></div>
            <div class="wheel front-wheel right"></div>
            <div class="wheel back-wheel left"></div>
            <div class="wheel back-wheel right"></div>
        </div>
    </div>

    <!-- Título -->
    <div class="title">
        Olá Mundo!
        <div class="subtitle">Super Mario Kart</div>
    </div>

    <!-- Card inferior -->
    <div class="info-card">
        <p>Ready... 3... 2... 1...</p>
        <p>Clique para GO! → Nintendo</p>
    </div>

    <!-- Música: Super Mario Kart - Title Screen -->
    <audio id="bgm" loop preload="auto" volume="0.4">
        <source src="https://vgmsite.com/soundtracks/super-mario-kart-gamerip/1-02.%20Title%20Screen.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <!-- Som de start race aproximado (coin/start genérico Mario) -->
    <audio id="startSound" preload="auto">
        <source src="https://www.orangefreesounds.com/wp-content/uploads/2014/08/Mario-coin-sound.mp3" type="audio/mpeg">
    </audio>

    <script>
        const bgm = document.getElementById('bgm');
        const startSound = document.getElementById('startSound');

        // Tenta autoplay da música
        bgm.play().catch(() => {
            document.body.addEventListener('click', () => bgm.play(), { once: true });
        });

        // Clique: som de start + delay + redireciona
        document.body.addEventListener('click', () => {
            startSound.currentTime = 0;
            startSound.play().catch(() => {});
            setTimeout(() => {
                window.location.href = "https://www.nintendo.com/pt-br/";
            }, 1800); // Dá tempo pra sentir a "largada"
        });
    </script>

</body>
</html>
