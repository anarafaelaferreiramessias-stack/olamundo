<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Edição Estável</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #tela-inicial {
            position: absolute; width: 100%; height: 100%;
            background: #4a4a4a; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 100;
        }
        .btn { padding: 15px 30px; background: #5fa03d; color: white; border: 4px solid #000; cursor: pointer; font-weight: bold; }
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 24px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <h1 style="color:white; text-shadow: 4px 4px #000;">BLOCKS 3D</h1>
        <button class="btn" onclick="iniciar()">JOGAR MUNDO</button>
    </div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();

        // FUNÇÃO PARA GERAR TEXTURA PIXELADA VIA CÓDIGO
        function criarTexturaPixel(corBase, corDetalhe) {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const context = canvas.getContext('2d');
            
            context.fillStyle = corBase;
            context.fillRect(0, 0, size, size);
            
            for (let i = 0; i < 32; i++) {
                context.fillStyle = corDetalhe;
                context.fillRect(Math.floor(Math.random()*size), Math.floor(Math.random()*size), 1, 1);
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        function iniciar() {
            document.getElementById('tela-inicial').style.display = 'none';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            // Criando as texturas sem usar links externos
            const texGramaTopo = criarTexturaPixel('#55aa44', '#3d7a31');
            const texTerra = criarTexturaPixel('#8b4513', '#5d2e0d');
            const texFolha = criarTexturaPixel('#228b22', '#1a661a');

            const matGrama = [
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texGramaTopo }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra })
            ];

            const geo = new THREE.BoxGeometry(1, 1, 1);
            for (let x = -15; x < 15; x++) {
                for (let z = -15; z < 15; z++) {
                    const bloco = new THREE.Mesh(geo, matGrama);
                    bloco.position.set(x, 0, z);
                    scene.add(bloco);
                    objects.push(bloco);

                    if(Math.random() > 0.97) criarArvore(x, 1, z, texTerra, texFolha);
                }
            }

            setupControls();
        }

        function criarArvore(x, y, z, texM, texF) {
            const geo = new THREE.BoxGeometry(1,1,1);
            const matM = new THREE.MeshLambertMaterial({ map: texM });
            const matF = new THREE.MeshLambertMaterial({ map: texF });
            for(let i=0; i<3; i++) {
                const t = new THREE.Mesh(geo, matM);
                t.position.set(x, y+i, z);
                scene.add(t);
                objects.push(t);
            }
            for(let fx=-1; fx<=1; fx++) {
                for(let fy=3; fy<=4; fy++) {
                    for(let fz=-1; fz<=1; fz++) {
                        const f = new THREE.Mesh(geo, matF);
                        f.position.set(x+fx, y+fy, z+fz);
                        scene.add(f);
                        objects.push(f);
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.2; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            document.addEventListener('mousedown', () => document.body.requestPointerLock());
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            velocity.x -= velocity.x * 0.1;
            velocity.z -= velocity.z * 0.1;
            velocity.y -= 0.01;
            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();
            if (moveF || moveB) velocity.z -= direction.z * 0.1;
            if (moveL || moveR) velocity.x -= direction.x * 0.1;
            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);
            camera.position.y += velocity.y;
            if (camera.position.y < 1.6) {
                velocity.y = 0; camera.position.y = 1.6; canJump = true;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
