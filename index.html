<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Mountain Update</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; padding: 5px; background: rgba(0,0,0,0.7); border: 2px solid #fff;
        }
        .slot { width: 44px; height: 44px; border: 2px solid #555; display: flex; align-items: center; justify-content: center; position: relative; }
        .slot.selected { border: 2px solid #fff; background: rgba(255,255,255,0.2); }
        .count { position: absolute; bottom: 2px; right: 2px; color: #fff; font-size: 14px; text-shadow: 1px 1px #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 15px; height: 15px; border: 1px solid white; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; mix-blend-mode: difference; }
        #mining-ui { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 4px; background: #000; border: 1px solid #fff; display: none; }
        #mining-bar { width: 0%; height: 100%; background: #ffff00; }
    </style>
</head>
<body>

    <div id="mining-ui"><div id="mining-bar"></div></div>
    <div id="hotbar">
        <div class="slot selected" id="s0">
            <div style="width:20px; height:20px; background: #5d4037;"></div>
            <div id="inv-wood" class="count">0</div>
        </div>
        <div class="slot" id="s1"></div><div class="slot" id="s2"></div><div class="slot" id="s3"></div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand, handItem;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let targetRotation = new THREE.Euler(0, 0, 0, 'YXZ');
        let prevTime = performance.now();
        let blocks = [], drops = [], clouds = []; 
        let inventoryWood = 0, selectedSlot = 0;
        let isMining = false, miningTime = 0, currentTarget = null;

        const loader = new THREE.TextureLoader();
        // Texturas simulando Minecraft
        const woodTex = loader.load('https://threejs.org/examples/textures/crate.gif');
        const grassTex = loader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        const leafTex = loader.load('https://threejs.org/examples/textures/lava/lavatile.jpg'); // Usando como base para cor verde

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // Terreno com Montanhas (Voxel-ish)
            grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
            grassTex.repeat.set(100, 100);
            const groundGeo = new THREE.PlaneGeometry(200, 200, 40, 40);
            const vertices = groundGeo.attributes.position.array;
            
            for (let i = 0; i < vertices.length; i += 3) {
                let x = vertices[i];
                let y = vertices[i+1];
                // Gera montanhas usando seno/cosseno
                vertices[i+2] = Math.sin(x * 0.1) * Math.cos(y * 0.1) * 4;
            }
            groundGeo.computeVertexNormals();
            
            const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({map: grassTex}));
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            // Nuvens Animadas
            for(let i=0; i<15; i++) {
                const cloud = new THREE.Mesh(new THREE.BoxGeometry(10, 1, 6), new THREE.MeshLambertMaterial({color: 0xffffff, transparent: true, opacity: 0.7}));
                cloud.position.set(Math.random()*200-100, 30 + Math.random()*5, Math.random()*200-100);
                scene.add(cloud);
                clouds.push(cloud);
            }

            hand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.7), new THREE.MeshLambertMaterial({color: 0xdbac82}));
            scene.add(hand);
            handItem = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshLambertMaterial({map: woodTex}));
            handItem.visible = false;
            scene.add(handItem);

            // Árvores em posições aleatórias (ajustadas à altura do terreno)
            for(let i=0; i<30; i++) {
                let rx = Math.random()*100-50;
                let rz = Math.random()*100-50;
                let ry = Math.sin(rx * 0.1) * Math.cos(rz * 0.1) * 4;
                spawnTree(rx, ry, rz);
            }

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            raycaster = new THREE.Raycaster();

            // Eventos
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
                else { if (e.button === 0) startMining(); if (e.button === 2) placeBlock(); }
            });
            document.addEventListener('mouseup', () => stopMining());
            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveF = true; if(e.code === 'KeyS') moveB = true;
                if(e.code === 'KeyA') moveL = true; if(e.code === 'KeyD') moveR = true;
                if(e.code === 'Space' && canJump) { velocity.y += 5; canJump = false; }
                if(e.key >= 1 && e.key <= 4) updateSlot(parseInt(e.key)-1);
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveF = false; if(e.code === 'KeyS') moveB = false;
                if(e.code === 'KeyA') moveL = false; if(e.code === 'KeyD') moveR = false;
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    targetRotation.y -= e.movementX * 0.002;
                    targetRotation.x -= e.movementY * 0.002;
                    targetRotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotation.x));
                }
            });
            animate();
        }

        function spawnTree(x, y, z) {
            for(let h=0; h<4; h++) {
                const log = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                log.position.set(x, y + h + 0.5, z);
                log.userData = { type: 'wood', t: 1.5 };
                scene.add(log); blocks.push(log);
            }
            for(let hy=3; hy<6; hy++) {
                for(let hx=-1; hx<=1; hx++) {
                    for(let hz=-1; hz<=1; hz++) {
                        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({color: 0x2e7d32, transparent: true, opacity: 0.9}));
                        leaf.position.set(x+hx, y+hy+0.5, z+hz);
                        leaf.userData = { type: 'leaf', t: 0.4 };
                        scene.add(leaf); blocks.push(leaf);
                    }
                }
            }
        }

        function updateSlot(idx) {
            document.getElementById('s'+selectedSlot).classList.remove('selected');
            selectedSlot = idx;
            document.getElementById('s'+selectedSlot).classList.add('selected');
            handItem.visible = (selectedSlot === 0 && inventoryWood > 0);
        }

        function startMining() {
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);
            if (hits.length > 0 && hits[0].distance < 4) {
                isMining = true; currentTarget = hits[0].object; miningTime = 0;
                document.getElementById('mining-ui').style.display = 'block';
            }
        }

        function stopMining() { isMining = false; document.getElementById('mining-ui').style.display = 'none'; }

        function placeBlock() {
            if (selectedSlot !== 0 || inventoryWood <= 0) return;
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects([scene.children[2], ...blocks]);
            if (hits.length > 0 && hits[0].distance < 5) {
                const pos = hits[0].object.position.clone().add(hits[0].face.normal);
                const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                b.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                scene.add(b); blocks.push(b); inventoryWood--;
                document.getElementById('inv-wood').innerText = inventoryWood;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            camera.rotation.x += (targetRotation.x - camera.rotation.x) * 0.15;
            camera.rotation.y += (targetRotation.y - camera.rotation.y) * 0.15;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 40.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 40.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;
            
            // Colisão simples com altura do terreno
            let terrainH = Math.sin(camera.position.x * 0.1) * Math.cos(camera.position.z * 0.1) * 4 + 1.7;
            if (camera.position.y < terrainH) { velocity.y = 0; camera.position.y = terrainH; canJump = true; }

            // Nuvens se movendo
            clouds.forEach(c => { c.position.x += 0.01; if(c.position.x > 100) c.position.x = -100; });

            if (isMining && currentTarget) {
                miningTime += delta;
                document.getElementById('mining-bar').style.width = (miningTime/currentTarget.userData.t)*100 + '%';
                hand.position.z += Math.sin(time*0.02)*0.03;
                if (miningTime >= currentTarget.userData.t) {
                    const d = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshLambertMaterial({map: woodTex}));
                    d.position.copy(currentTarget.position);
                    scene.add(d); drops.push(d);
                    scene.remove(currentTarget);
                    blocks = blocks.filter(b => b !== currentTarget);
                    stopMining();
                }
            }

            drops.forEach((d, i) => {
                d.rotation.y += 0.05;
                if (camera.position.distanceTo(d.position) < 1.5) {
                    inventoryWood++; document.getElementById('inv-wood').innerText = inventoryWood;
                    scene.remove(d); drops.splice(i, 1);
                }
            });

            hand.position.copy(camera.position); hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.5); hand.translateY(-0.4); hand.translateZ(-0.7);
            handItem.position.copy(hand.position); handItem.quaternion.copy(hand.quaternion);
            handItem.translateZ(-0.4);

            prevTime = time;
            renderer.render(scene, camera);
        }
        init();
    </script>
</body>
</html>
