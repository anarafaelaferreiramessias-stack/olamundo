<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON 618 - O Maior Buraco Negro Conhecido</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; overflow:hidden; }
        body {
            height:100vh;
            background:#000;
            perspective:2200px;
            cursor:grab;
            font-family:Arial,sans-serif;
        }

        .scene {
            position:absolute;
            inset:0;
            transform-style:preserve-3d;
            transform:rotateX(12deg);
            animation:sceneRotate 480s linear infinite;
        }

        @keyframes sceneRotate {
            to { transform:rotateX(12deg) rotateY(360deg); }
        }

        /* Fundo cósmico profundo */
        .cosmos {
            position:absolute;
            inset:0;
            background:radial-gradient(circle at 50% 50%, #0a0015 0%, #000 80%);
            pointer-events:none;
        }

        .stars {
            position:absolute;
            inset:0;
            background:
                radial-gradient(white 1px,transparent 1px) 0 0/100px 100px,
                radial-gradient(white 0.8px,transparent 0.8px) 50px 50px/80px 80px;
            opacity:0.7;
            animation:drift 300s linear infinite;
        }

        @keyframes drift { to { transform:translateZ(-4000px); } }

        /* Nebulosa ao redor */
        .nebula {
            position:absolute;
            inset:0;
            background:
                radial-gradient(circle at 40% 60%, rgba(180,60,255,0.22) 0%,transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(0,180,255,0.18) 0%,transparent 55%);
            filter:blur(60px);
            animation:pulse 45s ease-in-out infinite alternate;
        }

        @keyframes pulse { 0%{opacity:0.6;transform:scale(0.98);} 100%{opacity:1;transform:scale(1.06);} }

        /* TON 618 - Disco de acreção + event horizon */
        .ton618 {
            position:absolute;
            top:50%;
            left:50%;
            width:900px;
            height:900px;
            transform:translate(-50%,-50%) rotateX(15deg);
            transform-style:preserve-3d;
            z-index:10;
        }

        .event-horizon {
            position:absolute;
            inset:0;
            background:#000;
            border-radius:50%;
            box-shadow:0 0 180px #000, inset 0 0 120px #000;
            transform:rotateX(0deg);
        }

        .accretion-disk {
            position:absolute;
            inset:-20%;
            background:conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                #ff6600 30deg,
                #ffaa00 90deg,
                #ffff00 150deg,
                #ffaa00 210deg,
                #ff6600 270deg,
                transparent 360deg
            );
            border-radius:50%;
            filter:blur(18px);
            opacity:0.92;
            animation:spinDisk 18s linear infinite;
            box-shadow:0 0 280px #ff8800, 0 0 520px #ff4400;
        }

        @keyframes spinDisk {
            to { transform:rotate(360deg); }
        }

        .disk-glow {
            position:absolute;
            inset:-40%;
            background:radial-gradient(circle,#ffaa00 10%,transparent 60%);
            border-radius:50%;
            filter:blur(120px);
            animation:glowPulse 6s ease-in-out infinite alternate;
            opacity:0.8;
        }

        @keyframes glowPulse {
            0%{opacity:0.7;transform:scale(1);}
            100%{opacity:1.1;transform:scale(1.15);}
        }

        /* Jets polares (quasar) */
        .jet {
            position:absolute;
            top:50%;
            left:50%;
            width:80px;
            height:1800px;
            background:linear-gradient(to top, transparent, #a0f0ff, #ffffff, #a0f0ff, transparent);
            filter:blur(40px);
            transform:translate(-50%,-50%);
            opacity:0.45;
            animation:jetPulse 12s ease-in-out infinite alternate;
        }

        .jet-upper { transform:translate(-50%,-50%) rotate(180deg); }
        .jet-lower { transform:translate(-50%,-50%) rotate(0deg); }

        @keyframes jetPulse {
            0%{opacity:0.4;height:1600px;}
            100%{opacity:0.75;height:2200px;}
        }

        /* Partículas caindo no disco */
        .particle {
            position:absolute;
            background:#ffcc88;
            border-radius:50%;
            box-shadow:0 0 20px #ff8800;
            animation:fallIn 8s linear infinite;
            opacity:0;
        }

        @keyframes fallIn {
            0%  {transform:translate(0,-800px) scale(0.2);opacity:0;}
            20% {opacity:1;}
            100%{transform:translate(0,0) scale(0);opacity:0;}
        }

        /* Info HUD */
        .hud {
            position:absolute;
            bottom:30px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.7);
            padding:15px 40px;
            border-radius:12px;
            color:#a0ffff;
            font-size:1.3rem;
            text-shadow:0 0 12px #00ffff;
            border:2px solid #00ffff;
            pointer-events:none;
            z-index:20;
        }
    </style>
</head>
<body>

    <div class="cosmos">
        <div class="stars"></div>
        <div class="nebula"></div>
    </div>

    <div class="ton618">
        <div class="event-horizon"></div>
        <div class="accretion-disk"></div>
        <div class="disk-glow"></div>

        <div class="jet jet-upper"></div>
        <div class="jet jet-lower"></div>
    </div>

    <div class="hud">
        TON 618 • ~66 bilhões de massas solares • Quasar mais massivo conhecido • 10+ bilhões de anos-luz
    </div>

    <!-- Som ambiente cósmico (opcional) -->
    <audio id="bgm" loop preload="auto" volume="0.3">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8d9f8e6d8e.mp3?filename=cosmos-galaxy-stars-universe-milky-way-planet-ambient-music-208619.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Inicia som com clique (navegadores bloqueiam autoplay)
        const audio = document.getElementById('bgm');
        document.body.addEventListener('click', () => audio.play(), {once:true});

        // Partículas caindo no disco (efeito foda)
        const ton = document.querySelector('.ton618');
        function createParticle() {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = `${Math.random()*6 + 3}px`;
            p.style.height = p.style.width;
            p.style.left = `${50 + (Math.random()-0.5)*180}%`;
            p.style.top = `${Math.random()*-100 - 200}%`;
            p.style.animationDelay = `${Math.random()*4}s`;
            p.style.animationDuration = `${5 + Math.random()*6}s`;
            ton.appendChild(p);
            setTimeout(() => p.remove(), 15000);
        }
        setInterval(createParticle, 180);

        // Primeiras partículas
        for(let i=0; i<25; i++) setTimeout(createParticle, i*300);
    </script>

</body>
</html>
