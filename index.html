<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros. - It's-a me!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #5c94fc 40%, #a0c8f8 40%, #60a060 100%);
            font-family: 'Comic Sans MS', 'Arial', sans-serif; /* Fonte mais "jogo antigo" */
            cursor: pointer;
            overflow: hidden;
        }

        .mushroom {
            position: relative;
            width: 240px;
            height: 240px;
            background: #ffffff;
            border: 14px solid #000000;
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            overflow: hidden;
            box-shadow: inset -15px 15px 20px rgba(0,0,0,0.2), 0 15px 30px rgba(0,0,0,0.4);
            animation: bounce 1.8s ease-in-out infinite;
        }

        .mushroom::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 58%;
            background: #e60012; /* Vermelho clássico Mario */
            border-bottom: 14px solid #000000;
            border-radius: 50% 50% 0 0;
        }

        .mushroom::after {
            content: "";
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: #ffffff;
            border: 14px solid #000000;
            border-radius: 50%;
            box-shadow: 0 0 0 10px #e60012;
            z-index: 5;
        }

        /* Pontos brancos no chapéu (como no jogo) */
        .mushroom span {
            position: absolute;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            z-index: 3;
        }

        .mushroom .spot1 { top: 20%; left: 25%; }
        .mushroom .spot2 { top: 15%; left: 65%; }
        .mushroom .spot3 { top: 40%; left: 40%; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-40px) scale(1.05); }
        }

        .mario-card {
            position: absolute;
            bottom: 70px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 40px;
            border-radius: 25px;
            border: 6px solid #e60012;
            border-bottom: 12px solid #000000;
            text-align: center;
            min-width: 320px;
            pointer-events: none;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        h1 {
            color: #e60012;
            margin: 0;
            font-size: 2.8em;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            text-shadow: 3px 3px 0 #000000;
        }

        .power-tag {
            display: inline-block;
            background: #000000;
            color: #ffffff;
            padding: 10px 25px;
            border-radius: 30px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.3em;
            border: 4px solid #e60012;
        }
    </style>
</head>
<body>

    <div class="mushroom">
        <span class="spot1"></span>
        <span class="spot2"></span>
        <span class="spot3"></span>
    </div>

    <div class="mario-card">
        <h1>It's-a me, Mario!</h1>
        <div class="power-tag">Mamma mia!</div>
    </div>

    <!-- Super Mario Bros. - Ground Theme (Overworld principal) -->
    <audio id="marioSound" preload="auto" loop volume="0.32">
        <source src="https://vgmsite.com/soundtracks/super-mario-bros.-gamerip-1985/01.%20Ground%20Theme.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        const audio = document.getElementById('marioSound');

        function tryPlayAudio() {
            audio.play().then(() => {
                console.log("Super Mario Bros. tocando!");
            }).catch(() => {
                console.log("Autoplay bloqueado — inicia no clique");
                document.body.addEventListener('click', function playOnClick() {
                    audio.play();
                    document.body.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        }

        tryPlayAudio();

        document.body.addEventListener('click', function() {
            setTimeout(() => {
                window.location.href = "https://www.nintendo.com/pt-br/";
            }, 2000); // Delay maior pra aproveitar o tema clássico
        });
    </script>

</body>
</html>
