<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Minecraft Clone</title>
    <style>
        /* Estilização da Tela Inicial */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            background-color: #333;
        }

        #tela-inicial {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://minecraft.net/static/theme/img/background/panorama_0.jpg');
            background-size: cover;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            position: absolute;
        }

        h1 {
            color: #fff;
            font-size: 5rem;
            text-shadow: 4px 4px #3f3f3f;
            margin-bottom: 50px;
        }

        .btn-minecraft {
            width: 400px;
            padding: 15px;
            margin: 10px;
            background-color: #AAAAAA;
            border: 4px solid #000;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            text-shadow: 2px 2px #3f3f3f;
            transition: background 0.2s;
        }

        .btn-minecraft:hover {
            background-color: #55aa55;
            border-color: #fff;
        }

        /* Tela do Jogo */
        #mundo {
            display: none; /* Escondido até clicar em jogar */
            width: 100vw;
            height: 100vh;
            background-color: #87CEEB; /* Céu */
            position: relative;
        }

        #jogador {
            width: 50px;
            height: 50px;
            background-color: #2ecc71; /* Representando o Steve */
            position: absolute;
            bottom: 50px;
            left: 50px;
            border: 2px solid #27ae60;
        }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <h1>MINECRAFT</h1>
        <button class="btn-minecraft" onclick="iniciarJogo()">JOGAR</button>
        <button class="btn-minecraft">OPÇÕES</button>
        <button class="btn-minecraft">SAIR</button>
    </div>

    <div id="mundo">
        <div id="jogador"></div>
        <p style="padding: 20px; font-weight: bold;">Use WASD para mover o Steve!</p>
    </div>

    <script>
        const telaInicial = document.getElementById('tela-inicial');
        const mundo = document.getElementById('mundo');
        const jogador = document.getElementById('jogador');

        // Posição inicial
        let posX = 50;
        let posY = 50;
        const velocidade = 15;

        function iniciarJogo() {
            telaInicial.style.display = 'none';
            mundo.style.display = 'block';
            document.addEventListener('keydown', controles);
        }

        function controles(event) {
            const tecla = event.key.toLowerCase();

            if (tecla === 'w') posY += velocidade;
            if (tecla === 's') posY -= velocidade;
            if (tecla === 'a') posX -= velocidade;
            if (tecla === 'd') posX += velocidade;

            // Atualiza a posição no CSS (lembrando que bottom e left)
            jogador.style.bottom = posY + 'px';
            jogador.style.left = posX + 'px';
        }
    </script>
</body>
</html>
