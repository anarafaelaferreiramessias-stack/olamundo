<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minecraft • Cherry Grove • Pôr do Sol</title>
  <style>
    :root {
      --block-size: 64px;
      --sunset-orange: #ff7f4d;
      --sunset-pink: #ff99cc;
      --sky-purple: #a78bdb;
      --sky-blue: #4da6ff;
      --grass-green: #7fb87f;
      --cherry-leaves: #ffb6c1;
      --cherry-trunk: #a0522d;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height: 100vh;
      overflow: hidden;
      background: #000;
      image-rendering: pixelated;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Céu com gradiente fiel ao Minecraft sunset */
    .sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        #1e3a8a 0%,     /* céu escuro superior */
        #3b82f6 20%,     /* azul claro */
        #60a5fa 35%,     /* transição */
        #f472b6 50%,     /* rosa forte do entardecer */
        #fb923c 70%,     /* laranja intenso */
        #f97316 85%,     /* laranja queimado */
        #c2410c 100%     /* vermelho alaranjado na linha do horizonte */
      );
      animation: skyBreath 240s ease-in-out infinite alternate;
    }

    @keyframes skyBreath {
      0%,100% { opacity: 0.98; }
      50%     { opacity: 1; }
    }

    /* Sol quadrado Minecraft se pondo */
    .sun {
      position: absolute;
      width: 220px;
      height: 220px;
      background: #ffdd44;
      box-shadow:
        0 0 140px #ffdd44,
        0 0 280px #ffaa33,
        0 0 480px #ff7733,
        0 0 680px #ff4422;
      border-radius: 0;
      top: 18%;
      left: 65%;
      transform: translate(-50%, -50%);
      animation: sunPath 360s linear infinite;
    }

    @keyframes sunPath {
      0%   { top: 18%; left: 65%; opacity: 1; }
      40%  { top: 35%; left: 50%; opacity: 0.95; }
      80%  { top: 65%; left: 35%; opacity: 0.75; }
      100% { top: 85%; left: 20%; opacity: 0.4; }
    }

    /* Chão / grama do bioma */
    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 38%;
      background: var(--grass-green);
      box-shadow: inset 0 40px 80px rgba(0,0,0,0.5);
    }

    /* Árvores de cerejeira Minecraft */
    .tree {
      position: absolute;
      bottom: 38%;
      width: 180px;
      left: 50%;
      transform: translateX(-50%);
      transform-style: preserve-3d;
      animation: treeSway 18s ease-in-out infinite;
    }

    .log {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 48px;
      height: 240px;
      background: var(--cherry-trunk);
      transform: translateX(-50%);
      box-shadow:
        inset -12px 0 #8b4513,
        inset 12px 0 #8b4513;
    }

    .foliage {
      position: absolute;
      bottom: 200px;
      left: 50%;
      width: 240px;
      height: 240px;
      background: var(--cherry-leaves);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 60px rgba(255,182,193,0.7);
      animation: foliageBob 9s ease-in-out infinite alternate;
    }

    .foliage::before,
    .foliage::after {
      content: '';
      position: absolute;
      background: var(--cherry-leaves);
      border-radius: 50%;
    }

    .foliage::before { width: 180px; height: 180px; top: -70px; left: -40px; }
    .foliage::after  { width: 160px; height: 160px; top: -50px; right: -40px; }

    @keyframes treeSway {
      0%,100% { transform: translateX(-50%) rotate(-1.8deg); }
      50%     { transform: translateX(-50%) rotate(1.8deg); }
    }

    @keyframes foliageBob {
      0%   { transform: translateX(-50%) translateY(0) rotate(-2deg); }
      100% { transform: translateX(-50%) translateY(-12px) rotate(2deg); }
    }

    /* Pétalas caindo – partículas reais do bioma Cherry Grove */
    .petal {
      position: absolute;
      width: 14px;
      height: 20px;
      background: var(--cherry-leaves);
      border-radius: 30% 70% 40% 60%;
      box-shadow: 0 0 12px rgba(255,105,180,0.7);
      opacity: 0.85;
      pointer-events: none;
      animation: petalFall linear infinite;
    }

    @keyframes petalFall {
      0%   { transform: translateY(-120vh) rotate(0deg) translateX(0); opacity: 0.9; }
      100% { transform: translateY(120vh) rotate(1440deg) translateX(80vw); opacity: 0; }
    }

    /* HUD minimalista estilo Minecraft */
    .hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: white;
      font-size: 1.3rem;
      padding: 10px 28px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      text-shadow: 1px 1px 3px black;
    }

    /* Música */
    audio { display: none; }
  </style>
</head>
<body>

  <div class="sky"></div>
  <div class="sun"></div>

  <div class="ground"></div>

  <!-- Árvores posicionadas no horizonte -->
  <div class="tree" style="left:18%; animation-delay:0s;"><div class="log"></div><div class="foliage"></div></div>
  <div class="tree" style="left:38%; animation-delay:4s;"><div class="log"></div><div class="foliage"></div></div>
  <div class="tree" style="left:62%; animation-delay:7s;"><div class="log"></div><div class="foliage"></div></div>
  <div class="tree" style="left:82%; animation-delay:11s;"><div class="log"></div><div class="foliage"></div></div>

  <!-- Container para as pétalas -->
  <div id="petalContainer"></div>

  <!-- Moog City 2 – link direto confiável -->
  <audio id="bgm" loop preload="auto" volume="0.32">
    <source src="https://vgmsite.com/soundtracks/minecraft-volume-beta-gamerip/06.%20Moog%20City%202.mp3" type="audio/mpeg">
  </audio>

  <div class="hud">
    Cherry Grove Biome • Sunset • Moog City 2
  </div>

  <script>
    // Toca música (fallback para clique se autoplay bloqueado)
    const bgm = document.getElementById('bgm');
    bgm.play().catch(() => {
      document.body.addEventListener('click', () => bgm.play(), {once: true});
    });

    // Gera pétalas caindo
    const container = document.getElementById('petalContainer');
    function spawnPetal() {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = (12 + Math.random() * 18) + 's';
      petal.style.animationDelay = Math.random() * 6 + 's';
      petal.style.opacity = 0.7 + Math.random() * 0.25;
      container.appendChild(petal);
      setTimeout(() => petal.remove(), 45000);
    }

    setInterval(spawnPetal, 350);
    // Primeiras pétalas para preencher a tela logo no início
    for (let i = 0; i < 50; i++) {
      setTimeout(spawnPetal, i * 250);
    }
  </script>

</body>
</html>
