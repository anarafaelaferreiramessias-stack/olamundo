<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Voxel Engine Prototype v3.0 - Advanced Computer Graphics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Consolas', monospace; }
        #boot-screen {
            position: absolute; width: 100%; height: 100%; z-index: 1000;
            background: #000; color: #0f0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: left;
        }
        .loading-text { font-size: 14px; line-height: 1.5; width: 600px; }
        #cursor { width: 10px; height: 20px; background: #0f0; display: inline-block; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 16px; height: 16px;
            margin: -8px 0 0 -8px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%;
            mix-blend-mode: difference;
        }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; background: rgba(0,0,0,0.6); padding: 4px; border: 2px solid #333;
        }
        .slot {
            width: 48px; height: 48px; border: 2px solid #555; display: flex;
            align-items: center; justify-content: center; font-size: 12px; color: #fff;
        }
        .active-slot { border-color: #fff; background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="boot-screen">
        <div class="loading-text" id="log"></div>
        <div id="cursor"></div>
        <button id="start-btn" style="display:none; margin-top:20px; padding:10px 30px; background:#0f0; border:none; cursor:pointer; font-weight:bold;">INITIALIZE ENGINE</button>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="hotbar">
            <div class="slot active-slot" id="s1">GRASS</div>
            <div class="slot" id="s2">DIRT</div>
            <div class="slot" id="s3">WOOD</div>
            <div class="slot" id="s4">LEAF</div>
        </div>
    </div>

    <script>
        /**
         * MINECRAFT VOXEL ENGINE - ACADEMIC VERSION
         * DESENVOLVIDO PARA SIMULAÇÃO DE AMBIENTES 3D PROCEDURAIS
         */

        const logElement = document.getElementById('log');
        const logs = [
            "> Initializing Voxel Engine 3.0...",
            "> Loading WebGL 2.0 Context...",
            "> Generating Procedural Noise Maps...",
            "> Allocating Vertex Buffer Objects...",
            "> Building Octree for Collision Detection...",
            "> Ready for simulation."
        ];

        let i = 0;
        const interval = setInterval(() => {
            logElement.innerHTML += logs[i] + "<br>";
            i++;
            if (i >= logs.length) {
                clearInterval(interval);
                document.getElementById('start-btn').style.display = "block";
            }
        }, 400);

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('boot-screen').style.display = "none";
            document.getElementById('hud').style.display = "block";
            startSim();
        };

        // --- CORE ENGINE ---
        let scene, camera, renderer, raycaster, hand;
        let blocks = [], keys = {}, velocity = new THREE.Vector3();
        let currentMaterial = 0;

        const MATERIALS = [
            createTex('#5a8d3c', '#4a7532'), // Grass
            createTex('#79553a', '#60432e'), // Dirt
            createTex('#6a4e32', '#4d3926'), // Wood
            createTex('#3a5e24', '#2d4a1c'), // Leaf
        ];

        function createTex(c1, c2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = c1; ctx.fillRect(0,0,16,16);
            for(let i=0; i<64; i++){
                ctx.fillStyle = Math.random() > 0.5 ? c1 : c2;
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
            const t = new THREE.CanvasTexture(canvas);
            t.magFilter = THREE.NearestFilter;
            return new THREE.MeshLambertMaterial({ map: t });
        }

        function startSim() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            // Lighting
            const amb = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(amb);
            const sun = new THREE.DirectionalLight(0xffffff, 0.4);
            sun.position.set(100, 100, 50);
            scene.add(sun);

            // Create Hand/Arm
            const handGeo = new THREE.BoxGeometry(0.3, 0.3, 0.8);
            const handMat = new THREE.MeshLambertMaterial({ color: 0xdbac82 });
            hand = new THREE.Mesh(handGeo, handMat);
            scene.add(hand);

            // Generate Terrain
            for(let x=-15; x<15; x++) {
                for(let z=-15; z<15; z++) {
                    addBlock(x, 0, z, MATERIALS[0]);
                    if(Math.random() > 0.98) createTree(x, 1, z);
                }
            }

            // Listeners
            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if(e.key >= 1 && e.key <= 4) switchSlot(e.key - 1);
            });
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });
            window.addEventListener('mousedown', onAction);
            
            renderer.domElement.onclick = () => renderer.domElement.requestPointerLock();

            loop();
        }

        function addBlock(x, y, z, mat) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            blocks.push(mesh);
        }

        function createTree(x, y, z) {
            for(let i=0; i<4; i++) addBlock(x, y+i, z, MATERIALS[2]); // Trunk
            for(let ix=-1; ix<=1; ix++) {
                for(let iz=-1; iz<=1; iz++) {
                    addBlock(x+ix, y+4, z+iz, MATERIALS[3]); // Leaves
                }
            }
        }

        function switchSlot(idx) {
            currentMaterial = idx;
            document.querySelectorAll('.slot').forEach((s, i) => {
                s.className = i === idx ? 'slot active-slot' : 'slot';
            });
        }

        function onAction(e) {
            if(!document.pointerLockElement) return;
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);

            if(hits.length > 0 && hits[0].distance < 6) {
                if(e.button === 0) { // Break
                    scene.remove(hits[0].object);
                    blocks = blocks.filter(b => b !== hits[0].object);
                } else { // Place
                    const pos = hits[0].object.position.clone().add(hits[0].face.normal);
                    addBlock(pos.x, pos.y, pos.z, MATERIALS[currentMaterial]);
                }
            }
        }

        function loop() {
            requestAnimationFrame(loop);
            
            // Player Physics
            const speed = 0.15;
            if(keys['KeyW']) camera.translateZ(-speed);
            if(keys['KeyS']) camera.translateZ(speed);
            if(keys['KeyA']) camera.translateX(-speed);
            if(keys['KeyD']) camera.translateX(speed);

            velocity.y -= 0.01; // Gravity
            camera.position.y += velocity.y;
            if(camera.position.y < 2) {
                camera.position.y = 2;
                velocity.y = 0;
                if(keys['Space']) velocity.y = 0.2;
            }

            // Hand Animation
            hand.position.copy(camera.position);
            hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.5);
            hand.translateY(-0.4 + Math.sin(Date.now()*0.005)*0.02);
            hand.translateZ(-0.8);

            renderer.render(scene, camera);
        }

        window.oncontextmenu = () => false;
    </script>
</body>
</html>
