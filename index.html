<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Super Mario Customizada</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #e60012 50%, #0066cc 50%);
            font-family: 'Arial', sans-serif;
            cursor: pointer;
        }

        .mushroom {
            position: relative;
            width: 220px;
            height: 220px;
            background: #fff;
            border: 12px solid #000;
            border-radius: 50% 50% 40% 40%;
            overflow: hidden;
            box-shadow: inset -12px 12px 0 12px rgba(0,0,0,0.15), 0 0 25px rgba(0,0,0,0.3);
            animation: bounce 1.5s ease-in-out infinite;
        }

        .mushroom::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            background: #e60012;
            width: 100%;
            height: 55%;
            border-bottom: 12px solid #000;
            border-radius: 50% 50% 0 0;
        }

        .mushroom::after {
            content: "";
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #fff;
            border: 12px solid #000;
            border-radius: 50%;
            box-shadow: 0 0 0 8px #e60012;
            z-index: 10;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        .mario-card {
            position: absolute;
            bottom: 60px;
            background: rgba(255, 255, 255, 0.92);
            padding: 25px;
            border-radius: 20px;
            border-bottom: 8px solid #e60012;
            text-align: center;
            min-width: 300px;
            pointer-events: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        h1 {
            color: #e60012;
            margin: 0;
            font-size: 2.2em;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .power-tag {
            display: inline-block;
            background: #0066cc;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            margin-top: 12px;
            font-weight: bold;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="mushroom"></div>

    <div class="mario-card">
        <h1>It's-a me, Mario!</h1>
        <div class="power-tag">Plumber Power!</div>
    </div>

    <!-- Tema principal Super Mario Bros. (Ground Theme) - loop -->
    <audio id="marioSound" preload="auto" loop volume="0.3">
        <source src="https://vgmsite.com/soundtracks/super-mario-bros.-gamerip-1985/01.%20Ground%20Theme.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        const audio = document.getElementById('marioSound');

        function tryPlayAudio() {
            audio.play().then(() => {
                console.log("Tema do Super Mario tocando!");
            }).catch(() => {
                console.log("Autoplay bloqueado — toca no clique");
                document.body.addEventListener('click', function playOnClick() {
                    audio.play();
                    document.body.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        }

        tryPlayAudio();

        document.body.addEventListener('click', function() {
            setTimeout(() => {
                window.location.href = "https://www.nintendo.com/pt-br/";
            }, 1500); // Delay pra curtir o som um pouquinho
        });
    </script>

</body>
</html>
