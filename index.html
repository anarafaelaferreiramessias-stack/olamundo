<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Smooth Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }
        #menu {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.imgur.com/u7q13eH.jpg') center/cover;
            transition: 0.8s;
        }
        .btn { padding: 15px 60px; background: #3c3c3c; border: 4px solid #000; color: #fff; cursor: pointer; font-size: 20px; font-weight: bold; }
        .btn:hover { background: #8dc63f; outline: 2px solid #fff; }

        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 364px; height: 44px; background: rgba(0,0,0,0.6); border: 2px solid #fff;
            display: none; align-items: center; justify-content: center;
        }
        .slot { width: 40px; height: 40px; border: 2px solid #888; display: flex; align-items: center; justify-content: center; position: relative; }
        .count { position: absolute; bottom: 2px; right: 2px; color: #fff; font-size: 14px; text-shadow: 1px 1px #000; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; opacity: 0.7; }
        
        #mining-progress {
            position: absolute; top: 53%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 4px; background: rgba(0,0,0,0.8); display: none;
        }
        #mining-bar { width: 0%; height: 100%; background: #00ff00; transition: width 0.1s; }
    </style>
</head>
<body>

    <div id="menu">
        <img src="https://minecraft.wiki/images/Minecraft_Logo.png" style="width: 450px; margin-bottom: 30px;">
        <button class="btn" onclick="start()">START WORLD</button>
    </div>

    <div id="mining-progress"><div id="mining-bar"></div></div>
    <div id="hotbar"><div class="slot"><div id="inv-wood" class="count">0</div></div></div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();
        let blocks = [], drops = []; 
        let inventoryWood = 0;

        let isMining = false, miningTime = 0, currentTarget = null;

        const loader = new THREE.TextureLoader();
        const woodTex = loader.load('https://threejs.org/examples/textures/crate.gif');

        function start() {
            document.getElementById('menu').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('hotbar').style.display = 'flex';
                document.getElementById('crosshair').style.display = 'block';
                init();
            }, 800);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x74b9ff);
            scene.fog = new THREE.Fog(0x74b9ff, 15, 90);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(5, 10, 7.5);
            scene.add(sun);

            const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshLambertMaterial({color: 0x2d4c1e}));
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            hand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.8), new THREE.MeshLambertMaterial({color: 0xdbac82}));
            scene.add(hand);

            // Gerar Árvores com Folhas
            for(let i=0; i<50; i++) spawnFullTree(Math.random()*140-70, Math.random()*140-70);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) {
                    renderer.domElement.requestPointerLock();
                } else {
                    if (e.button === 0) startMining();
                    if (e.button === 2) placeBlock();
                }
            });
            document.addEventListener('mouseup', () => stopMining());
            document.addEventListener('keydown', (e) => handleKeys(e.code, true));
            document.addEventListener('keyup', (e) => handleKeys(e.code, false));
            
            // Mouse com sensibilidade ajustada
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    camera.rotation.y -= e.movementX * 0.0015;
                    camera.rotation.x -= e.movementY * 0.0015;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            animate();
        }

        function spawnFullTree(x, z) {
            // Tronco (3 blocos)
            for(let h=0; h<3; h++) {
                const log = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                log.position.set(x, h + 0.5, z);
                log.userData = { type: 'wood', time: 1.5 };
                scene.add(log);
                blocks.push(log);
            }
            // Folhas (Copa quadrada 3x3x2)
            for(let ly=3; ly<5; ly++) {
                for(let lx=-1; lx<=1; lx++) {
                    for(let lz=-1; lz<=1; lz++) {
                        if(lx==0 && lz==0 && ly==3) continue; // Pula onde está o tronco
                        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({color: 0x3a5f0b, transparent: true, opacity: 0.9}));
                        leaf.position.set(x + lx, ly + 0.5, z + lz);
                        leaf.userData = { type: 'leaf', time: 0.4 };
                        scene.add(leaf);
                        blocks.push(leaf);
                    }
                }
            }
        }

        function startMining() {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(blocks);
            if (intersects.length > 0 && intersects[0].distance < 4) {
                isMining = true;
                currentTarget = intersects[0].object;
                miningTime = 0;
                document.getElementById('mining-progress').style.display = 'block';
            }
        }

        function stopMining() {
            isMining = false;
            miningTime = 0;
            document.getElementById('mining-progress').style.display = 'none';
        }

        function handleKeys(c, v) {
            if(c==='KeyW') moveF=v; if(c==='KeyS') moveB=v; if(c==='KeyA') moveL=v; if(c==='KeyD') moveR=v;
            if(c==='Space' && v && canJump) { velocity.y += 4.2; canJump = false; }
        }

        function placeBlock() {
            if (inventoryWood <= 0) return;
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects([scene.children[2], ...blocks]); // Chão + Blocos
            if (intersects.length > 0) {
                const p = intersects[0].point.add(intersects[0].face.normal.multiplyScalar(0.5));
                const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                b.position.set(Math.round(p.x), Math.round(p.y), Math.round(p.z));
                scene.add(b);
                blocks.push(b);
                inventoryWood--;
                document.getElementById('inv-wood').innerText = inventoryWood;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // Movimento suave
            velocity.x -= velocity.x * 8.0 * delta;
            velocity.z -= velocity.z * 8.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 60.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 60.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 1.7) { velocity.y = 0; camera.position.y = 1.7; canJump = true; }

            // Mineração
            if (isMining && currentTarget) {
                miningTime += delta;
                let needed = currentTarget.userData.time;
                document.getElementById('mining-bar').style.width = (miningTime/needed)*100 + '%';
                hand.position.z += Math.sin(time*0.02)*0.03; // Swing
                
                if (miningTime >= needed) {
                    const drop = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), new THREE.MeshLambertMaterial({color: currentTarget.userData.type==='wood'?0x8b4513:0x3a5f0b}));
                    drop.position.copy(currentTarget.position);
                    scene.add(drop);
                    drops.push(drop);
                    scene.remove(currentTarget);
                    blocks = blocks.filter(b => b !== currentTarget);
                    stopMining();
                }
            }

            // Coleta
            drops.forEach((d, i) => {
                d.rotation.y += 0.05;
                if (camera.position.distanceTo(d.position) < 1.5) {
                    inventoryWood++;
                    document.getElementById('inv-wood').innerText = inventoryWood;
                    scene.remove(d);
                    drops.splice(i, 1);
                }
            });

            // Head Bobbing & Hand position
            const bob = Math.sin(time * 0.006) * ( (moveF||moveB||moveL||moveR) ? 0.04 : 0.01);
            hand.position.copy(camera.position);
            hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.5); hand.translateY(-0.4 + bob); hand.translateZ(-0.8);
            
            camera.rotation.order = "YXZ";
            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
