<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Survival - Build & Break</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #menu {
            position: fixed; width: 100%; height: 100%; z-index: 100;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
        }
        .btn { padding: 15px 50px; font-size: 20px; background: #4a7023; color: white; border: 3px solid #000; cursor: pointer; }
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 16px; height: 16px;
            border: 2px solid white; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 50; mix-blend-mode: difference;
        }
        #inventory-status {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.5); color: white; padding: 10px; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>SURVIVAL MODE</h1>
        <button class="btn" onclick="start()">INICIAR MUNDO</button>
        <p>Botão Esquerdo: Quebrar | Botão Direito: Construir</p>
    </div>

    <div id="crosshair"></div>
    <div id="inventory-status">Blocos na mão: <span id="block-count">0</span></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls, hand;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(), prevTime = performance.now();
        let objects = [];
        let inventory = 0;
        
        const BLOCK_SIZE = 16;
        const P_RADIUS = 5;

        // Texturas simples e rápidas
        function createTex(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color; ctx.fillRect(0,0,16,16);
            ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.strokeRect(0,0,16,16);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; return tex;
        }

        const mGrass = new THREE.MeshLambertMaterial({ map: createTex('#567d46') });
        const mWood = new THREE.MeshLambertMaterial({ map: createTex('#4d3319') });
        const mLeaves = new THREE.MeshLambertMaterial({ map: createTex('#3a5e2c') });
        const mStone = new THREE.MeshLambertMaterial({ map: createTex('#808080') });

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 100, 1000);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
            controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.PointLight(0xffffff, 0.8);
            sun.position.set(100, 500, 100);
            scene.add(sun);

            // Mão
            hand = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 6), new THREE.MeshLambertMaterial({color: 0xffdbac}));
            hand.position.set(4, -4, -6);
            camera.add(hand);

            // Gerar Mundo
            const geo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            for (let x = -25; x < 25; x++) {
                for (let z = -25; z < 25; z++) {
                    let h = Math.round(Math.sin(x/5) * Math.cos(z/5) * 2);
                    
                    const block = new THREE.Mesh(geo, h > 1 ? mStone : mGrass);
                    block.position.set(x * BLOCK_SIZE, h * BLOCK_SIZE, z * BLOCK_SIZE);
                    scene.add(block);
                    objects.push(block);

                    // Árvores
                    if (h === 0 && Math.random() > 0.98) {
                        spawnTree(x * BLOCK_SIZE, z * BLOCK_SIZE);
                    }
                }
            }

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            window.addEventListener('mousedown', (e) => {
                if (e.button === 0) breakBlock();
                if (e.button === 2) placeBlock();
            });
            window.addEventListener('contextmenu', e => e.preventDefault());
        }

        function spawnTree(x, z) {
            const geo = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            for(let i=1; i<=3; i++) {
                const trunk = new THREE.Mesh(geo, mWood);
                trunk.position.set(x, i*BLOCK_SIZE, z);
                scene.add(trunk); objects.push(trunk);
            }
            for(let ox=-1; ox<=1; ox++) {
                for(let oz=-1; oz<=1; oz++) {
                    const leaf = new THREE.Mesh(geo, mLeaves);
                    leaf.position.set(x+(ox*BLOCK_SIZE), 4*BLOCK_SIZE, z+(oz*BLOCK_SIZE));
                    scene.add(leaf); objects.push(leaf);
                }
            }
        }

        function breakBlock() {
            if(!controls.isLocked) return;
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObjects(objects);
            if(hits.length > 0 && hits[0].distance < 80) {
                scene.remove(hits[0].object);
                objects = objects.filter(o => o !== hits[0].object);
                inventory++;
                document.getElementById('block-count').innerText = inventory;
            }
        }

        function placeBlock() {
            if(!controls.isLocked || inventory <= 0) return;
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = ray.intersectObjects(objects);
            if(hits.length > 0 && hits[0].distance < 80) {
                const pos = hits[0].object.position.clone();
                const normal = hits[0].face.normal;
                pos.add(normal.multiplyScalar(BLOCK_SIZE));
                
                const block = new THREE.Mesh(new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE), mGrass);
                block.position.copy(pos);
                scene.add(block);
                objects.push(block);
                inventory--;
                document.getElementById('block-count').innerText = inventory;
            }
        }

        function checkCollision(pos) {
            for (let obj of objects) {
                let b = obj.position;
                if (pos.x + P_RADIUS > b.x - 8 && pos.x - P_RADIUS < b.x + 8 &&
                    pos.z + P_RADIUS > b.z - 8 && pos.z - P_RADIUS < b.z + 8 &&
                    pos.y - 12 < b.y + 8 && pos.y + 2 > b.y - 8) return true;
            }
            return false;
        }

        function start() { document.getElementById('menu').style.display = 'none'; controls.lock(); }

        document.addEventListener('keydown', (e) => {
            if(e.code==='KeyW') moveForward=true; if(e.code==='KeyS') moveBackward=true;
            if(e.code==='KeyA') moveLeft=true; if(e.code==='KeyD') moveRight=true;
            if(e.code==='Space' && canJump) { velocity.y += 200; canJump=false; }
        });
        document.addEventListener('keyup', (e) => {
            if(e.code==='KeyW') moveForward=false; if(e.code==='KeyS') moveBackward=false;
            if(e.code==='KeyA') moveLeft=false; if(e.code==='KeyD') moveRight=false;
        });

        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;
                velocity.x -= velocity.x * 10 * delta; velocity.z -= velocity.z * 10 * delta;
                velocity.y -= 9.8 * 60 * delta;
                
                const player = controls.getObject();
                if (moveForward) velocity.z -= 400 * delta; if (moveBackward) velocity.z += 400 * delta;
                if (moveLeft) velocity.x -= 400 * delta; if (moveRight) velocity.x += 400 * delta;

                const oldX = player.position.x; player.translateX(velocity.x * delta);
                if(checkCollision(player.position)) player.position.x = oldX;

                const oldZ = player.position.z; player.translateZ(velocity.z * delta);
                if(checkCollision(player.position)) player.position.z = oldZ;

                player.position.y += (velocity.y * delta);
                if(checkCollision(player.position)) {
                    if(velocity.y < 0) canJump = true;
                    player.position.y -= (velocity.y * delta);
                    velocity.y = 0;
                }
                prevTime = time;
            }
            renderer.render(scene, camera);
        }
        init(); animate();
    </script>
</body>
</html>
