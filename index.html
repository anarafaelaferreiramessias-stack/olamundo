<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Sakura Sunset • Moog City 2</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            height:100vh;
            overflow:hidden;
            background:#000;
            font-family:Arial,sans-serif;
            cursor:default;
        }

        /* Céu de pôr do sol quadrado Minecraft-style */
        .sky {
            position:absolute;
            inset:0;
            background:linear-gradient(to bottom,
                #ff9966 0%,   /* laranja superior */
                #ffcc99 20%,
                #ff99cc 40%,
                #cc99ff 60%,
                #6699ff 80%,
                #3366cc 100%  /* azul escuro inferior */
            );
            animation:skyFade 120s ease-in-out infinite alternate;
        }

        @keyframes skyFade {
            0%   { background-position:0 0; }
            100% { background-position:0 200%; }
        }

        .sun {
            position:absolute;
            top:15%;
            left:70%;
            width:180px;
            height:180px;
            background:#ffcc00;
            border-radius:0; /* quadrado Minecraft */
            box-shadow:0 0 120px #ff9900, 0 0 240px #ff6600, 0 0 400px #ff3300;
            transform:translate(-50%,-50%);
            animation:sunsetMove 180s linear infinite;
        }

        @keyframes sunsetMove {
            0%   { top:15%; left:70%; opacity:1; }
            50%  { top:40%; left:50%; opacity:0.9; }
            100% { top:70%; left:30%; opacity:0.6; }
        }

        .ground {
            position:absolute;
            bottom:0;
            width:100%;
            height:35%;
            background:linear-gradient(to bottom, #8bc34a 0%, #689f38 100%);
            box-shadow:inset 0 20px 60px rgba(0,0,0,0.4);
        }

        /* Árvores de sakura balançando */
        .tree {
            position:absolute;
            bottom:35%;
            width:120px;
            transform:translateX(-50%);
            transform-style:preserve-3d;
            animation:sway 14s ease-in-out infinite;
        }

        .trunk {
            position:absolute;
            bottom:0;
            left:50%;
            width:40px;
            height:180px;
            background:#a0522d; /* madeira cherry */
            transform:translateX(-50%);
            box-shadow:inset -10px 0 #8b4513;
        }

        .leaves {
            position:absolute;
            bottom:160px;
            left:50%;
            width:180px;
            height:180px;
            background:#ff99cc;
            border-radius:50%;
            transform:translateX(-50%);
            box-shadow:0 0 40px #ff69b4;
            animation:leafSway 8s ease-in-out infinite alternate;
        }

        .leaves::before,
        .leaves::after {
            content:'';
            position:absolute;
            width:140px;
            height:140px;
            background:#ff99cc;
            border-radius:50%;
        }

        .leaves::before { top:-60px; left:-30px; }
        .leaves::after  { top:-40px; right:-30px; }

        @keyframes sway {
            0%,100% { transform:translateX(-50%) rotate(-2deg); }
            50%     { transform:translateX(-50%) rotate(2deg); }
        }

        @keyframes leafSway {
            0%   { transform:translateX(-50%) rotate(-3deg); }
            100% { transform:translateX(-50%) rotate(3deg); }
        }

        /* Pétalas caindo (folhas de sakura) */
        .petal {
            position:absolute;
            width:12px;
            height:18px;
            background:#ff99cc;
            border-radius:40% 60% 50% 50%;
            box-shadow:0 0 10px #ff69b4;
            opacity:0.9;
            pointer-events:none;
            animation:fall linear infinite;
        }

        @keyframes fall {
            0%   { transform:translateY(-100vh) rotate(0deg) scale(0.7); opacity:0.8; }
            100% { transform:translateY(120vh) rotate(1080deg) scale(1); opacity:0; }
        }

        /* Música & HUD */
        audio { display:none; }

        .hud {
            position:absolute;
            bottom:20px;
            left:50%;
            transform:translateX(-50%);
            color:#fff;
            font-size:1.4rem;
            text-shadow:2px 2px 6px #000;
            background:rgba(0,0,0,0.5);
            padding:12px 30px;
            border-radius:12px;
            pointer-events:none;
        }
    </style>
</head>
<body>

    <div class="sky"></div>

    <!-- Sol quadrado se pondo -->
    <div class="sun"></div>

    <!-- Chão gramado Minecraft -->
    <div class="ground"></div>

    <!-- Árvores de sakura -->
    <div class="tree" style="left:20%;"><div class="trunk"></div><div class="leaves"></div></div>
    <div class="tree" style="left:45%; animation-delay:3s;"><div class="trunk"></div><div class="leaves"></div></div>
    <div class="tree" style="left:70%; animation-delay:6s;"><div class="trunk"></div><div class="leaves"></div></div>
    <div class="tree" style="left:85%; animation-delay:9s;"><div class="trunk"></div><div class="leaves"></div></div>

    <!-- Container de pétalas caindo -->
    <div id="petals"></div>

    <!-- Música Moog City 2 (link direto khinsider) -->
    <audio id="music" loop preload="auto" volume="0.35">
        <source src="https://downloads.khinsider.com/game-soundtracks/album/minecraft-volume-beta-2020/06.%20Moog%20City%202.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <div class="hud">
        Minecraft • Cherry Blossom Biome • Pôr do Sol • Moog City 2 tocando...
    </div>

    <script>
        // Toca música (com fallback pro clique)
        const music = document.getElementById('music');
        music.play().catch(() => {
            document.body.addEventListener('click', () => music.play(), {once:true});
        });

        // Gera pétalas caindo aleatórias
        const petals = document.getElementById('petals');
        function createPetal() {
            const p = document.createElement('div');
            p.className = 'petal';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (10 + Math.random() * 15) + 's';
            p.style.animationDelay = Math.random() * 8 + 's';
            petals.appendChild(p);
            setTimeout(() => p.remove(), 40000);
        }

        setInterval(createPetal, 300);
        for(let i=0; i<40; i++) setTimeout(createPetal, i*400);
    </script>

</body>
</html>
