<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Ultra Shader Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #4a90e2; font-family: 'Courier New', Courier, monospace; }
        #tela-inicial {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), url('https://images.alphacoders.com/133/1331001.png');
            background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .btn { padding: 20px 60px; background: #4e7a31; color: white; border: 4px solid #1a2b11; cursor: pointer; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; box-shadow: 0 6px #1a2b11; }
        .btn:hover { background: #5fa03d; }
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 26px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <h1 style="color: white; font-size: 80px; text-shadow: 6px 6px #000; margin-bottom: 30px;">BLOCKS 3D</h1>
        <button class="btn" onclick="iniciar()">ENTRAR NO MUNDO</button>
    </div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let hand;

        // --- GERADOR DE TEXTURAS ULTRA PIXEL ---
        function criarTexturaShader(corBase, corEscura, corClara) {
            const size = 32; // Maior resolução para mais detalhes
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Fundo
            ctx.fillStyle = corBase;
            ctx.fillRect(0, 0, size, size);
            
            // Pixels de ruído (Sheders simulados na textura)
            for (let i = 0; i < 200; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? corClara : corEscura;
                ctx.fillRect(Math.floor(Math.random()*size), Math.floor(Math.random()*size), 1, 1);
                // Pequenos grupos de pixels para dar textura
                if(Math.random() > 0.8) {
                    ctx.fillRect(Math.floor(Math.random()*size), Math.floor(Math.random()*size), 2, 2);
                }
            }
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function iniciar() {
            document.getElementById('tela-inicial').style.display = 'none';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x72a0ff);
            scene.fog = new THREE.FogExp2(0x72a0ff, 0.015); // Neblina volumétrica

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // Habilita sombras
            document.body.appendChild(renderer.domElement);

            // ILUMINAÇÃO "SHADER"
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(20, 50, 10);
            sun.castShadow = true;
            scene.add(sun);

            // Cores das texturas
            const texGrama = criarTexturaShader('#559432', '#457a28', '#66aa3d');
            const texTerra = criarTexturaShader('#79553a', '#5d3f2a', '#8d654a');
            const texFolha = criarTexturaShader('#2d4c1e', '#1a3314', '#3b6327');
            const texPele = criarTexturaShader('#e5c29f', '#d1ac86', '#f2d4b5');

            const matGrama = [
                new THREE.MeshStandardMaterial({ map: texTerra }),
                new THREE.MeshStandardMaterial({ map: texTerra }),
                new THREE.MeshStandardMaterial({ map: texGrama }),
                new THREE.MeshStandardMaterial({ map: texTerra }),
                new THREE.MeshStandardMaterial({ map: texTerra }),
                new THREE.MeshStandardMaterial({ map: texTerra })
            ];

            const geo = new THREE.BoxGeometry(1, 1, 1);
            
            // GERAR MUNDO GRANDE (120x120)
            for (let x = -60; x < 60; x++) {
                for (let z = -60; z < 60; z++) {
                    let h = Math.floor(Math.sin(x/10) * Math.cos(z/10) * 3);
                    const bloco = new THREE.Mesh(geo, matGrama);
                    bloco.position.set(x, h, z);
                    bloco.receiveShadow = true;
                    scene.add(bloco);
                    objects.push(bloco);

                    if(Math.random() > 0.992 && (Math.abs(x) > 5 || Math.abs(z) > 5)) {
                        criarArvore(x, h+1, z, texTerra, texFolha);
                    }
                }
            }

            // MÃO COM SHADER E BLOCO
            hand = new THREE.Group();
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 1), new THREE.MeshStandardMaterial({ map: texPele }));
            arm.position.set(0.6, -0.5, -0.6);
            hand.add(arm);

            const item = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), matGrama);
            item.position.set(0.6, -0.3, -1.1);
            hand.add(item);
            scene.add(hand);

            setupControls();
        }

        function criarArvore(x, y, z, texM, texF) {
            const matM = new THREE.MeshStandardMaterial({ map: texM });
            const matF = new THREE.MeshStandardMaterial({ map: texF });
            const geo = new THREE.BoxGeometry(1,1,1);
            for(let i=0; i<5; i++) {
                const t = new THREE.Mesh(geo, matM);
                t.position.set(x, y+i, z);
                scene.add(t);
                objects.push(t);
            }
            for(let fx=-2; fx<=2; fx++) {
                for(let fy=4; fy<=7; fy++) {
                    for(let fz=-2; fz<=2; fz++) {
                        if(Math.abs(fx)+Math.abs(fz) > 3) continue;
                        const f = new THREE.Mesh(geo, matF);
                        f.position.set(x+fx, y+fy, z+fz);
                        scene.add(f);
                        objects.push(f);
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.22; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            document.addEventListener('mousedown', () => document.body.requestPointerLock());
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            velocity.x -= velocity.x * 0.1;
            velocity.z -= velocity.z * 0.1;
            velocity.y -= 0.01;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            const speed = 0.07;
            if (moveF || moveB) velocity.z -= direction.z * speed;
            if (moveL || moveR) velocity.x -= direction.x * speed;

            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);
            camera.position.y += velocity.y;

            let gridX = Math.round(camera.position.x);
            let gridZ = Math.round(camera.position.z);
            let groundY = Math.sin(gridX/10) * Math.cos(gridZ/10) * 3;

            if (camera.position.y < groundY + 1.7) {
                velocity.y = 0;
                camera.position.y = groundY + 1.7;
                canJump = true;
            }

            if(hand) {
                hand.position.copy(camera.position);
                hand.rotation.copy(camera.rotation);
                let bob = (moveF || moveB || moveL || moveR) ? Math.sin(Date.now() * 0.01) * 0.04 : 0;
                hand.position.y += bob;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
