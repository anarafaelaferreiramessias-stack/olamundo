<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Clone Pro - Trabalho Escolar</title>
    <style>
        /* CSS - DESIGN E INTERFACE */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* Menu Principal Estilizado */
        #menu {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://minecraft.net/static/theme/img/background/minecraft_bg.jpg');
            background-size: cover; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }

        #menu img { width: 500px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); margin-bottom: 30px; }

        .mc-button {
            width: 300px; padding: 15px; font-size: 20px; color: #FFF;
            background: #5A5A5A; border: 4px solid #000;
            box-shadow: inset -4px -4px #222, inset 4px 4px #888;
            cursor: pointer; text-align: center; font-weight: bold;
            text-transform: uppercase; letter-spacing: 2px;
        }

        .mc-button:hover { background-color: #618c32; border-color: #FFF; }

        /* HUD - Interface do Jogo */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; margin: -10px;
            display: none; pointer-events: none; z-index: 50;
            color: white; font-size: 24px; text-align: center; font-weight: 100;
        }

        /* Mão do Steve com Textura */
        #hand {
            position: absolute; bottom: -40px; right: 15%;
            width: 180px; height: 280px;
            background: #aa7d55; /* Cor da pele */
            border-left: 10px solid #8d6545;
            border-top: 10px solid #8d6545;
            display: none; z-index: 60;
            transform: rotate(-10deg);
            transition: transform 0.05s;
        }

        /* Animação de Soco (Trigger via JS) */
        .punching { animation: punchAnim 0.2s ease-in-out; }
        @keyframes punchAnim {
            0% { transform: rotate(-10deg) translateY(0); }
            50% { transform: rotate(-30deg) translateY(-60px) translateX(-30px); }
            100% { transform: rotate(-10deg) translateY(0); }
        }
    </style>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="hand"></div>

    <div id="menu">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_logo.svg" alt="Logo">
        <div class="mc-button" onclick="iniciarJogo()">Jogar Mundo</div>
    </div>

    <!-- Engine 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let camera, scene, renderer, objects = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        // 1. Texturas Pixeladas (Gera o visual clássico)
        function createTexture(c1, c2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            for(let x=0; x<16; x++) {
                for(let y=0; y<16; y++) {
                    ctx.fillStyle = Math.random() > 0.5 ? c1 : c2;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        function iniciarJogo() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hand').style.display = 'block';

            // Setup da Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 0); // Começa no alto para testar gravidade

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            
            const matGrama = new THREE.MeshLambertMaterial({ map: createTexture('#55902e', '#4a7d28') });
            const matTerra = new THREE.MeshLambertMaterial({ map: createTexture('#8B4513', '#5D2906') });

            // Gerar mundo básico
            const geo = new THREE.BoxGeometry(1, 1, 1);
            for(let x=-15; x<15; x++) {
                for(let z=-15; z<15; z++) {
                    let h = Math.floor(Math.sin(x*0.2)*2); 
                    const b = new THREE.Mesh(geo, matGrama);
                    b.position.set(x, h, z);
                    scene.add(b);
                    objects.push(b);
                }
            }

            // --- FÍSICA DE QUEBRAR COM PARTÍCULAS ---
            function blast(pos, color) {
                for(let i=0; i<6; i++) {
                    const p = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2), new THREE.MeshLambertMaterial({color: color}));
                    p.position.copy(pos);
                    scene.add(p);
                    const v = new THREE.Vector3((Math.random()-0.5)*0.1, 0.1, (Math.random()-0.5)*0.1);
                    const step = () => {
                        p.position.add(v); v.y -= 0.005;
                        if(p.position.y > -5) requestAnimationFrame(step); else scene.remove(p);
                    };
                    step();
                }
            }

            // Clique e Animação
            const hand = document.getElementById('hand');
            window.addEventListener('mousedown', (e) => {
                if(document.pointerLockElement !== document.body) return;
                
                // Anima soco
                hand.classList.remove('punching');
                void hand.offsetWidth;
                hand.classList.add('punching');

                // Quebra bloco
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(0,0), camera);
                const hits = ray.intersectObjects(objects);
                if(hits.length > 0 && e.button === 0) {
                    const obj = hits[0].object;
                    blast(obj.position, 0x55902e);
                    scene.remove(obj);
                    objects.splice(objects.indexOf(obj), 1);
                }
            });

            // Controles
            document.body.addEventListener('click', () => document.body.requestPointerLock());
            const onKey = (e, v) => {
                if(e.code === 'KeyW') moveForward = v;
                if(e.code === 'KeyS') moveBackward = v;
                if(e.code === 'KeyA') moveLeft = v;
                if(e.code === 'KeyD') moveRight = v;
                if(e.code === 'Space' && v && canJump) { velocity.y += 10; canJump = false; }
            };
            document.addEventListener('keydown', (e)=>onKey(e,true));
            document.addEventListener('keyup', (e)=>onKey(e,false));

            document.addEventListener('mousemove', (e) => {
                if(document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.y -= 25 * delta; // Gravidade
                velocity.x -= velocity.x * 10 * delta;
                velocity.z -= velocity.z * 10 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir); camDir.y = 0;
                const camSide = new THREE.Vector3().crossVectors(camera.up, camDir).normalize();

                if(moveForward || moveBackward) velocity.addScaledVector(camDir, 50 * delta * direction.z);
                if(moveLeft || moveRight) velocity.addScaledVector(camSide, 50 * delta * direction.x);

                camera.position.addScaledVector(velocity, delta);

                // Colisão Simples com Chão
                if(camera.position.y < 2.5) {
                    velocity.y = 0;
                    camera.position.y = 2.5;
                    canJump = true;
                }

                renderer.render(scene, camera);
                prevTime = time;
            }
            animate();
        }
    </script>
</body>
</html>
