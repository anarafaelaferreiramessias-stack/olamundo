<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Ultimate Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        #tela-inicial {
            position: absolute;
            width: 100%; height: 100%;
            /* Fundo com imagem épica e degradê suave */
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%), 
                        url('https://minecraft.net/static/theme/img/background/panorama_0.jpg');
            background-size: cover;
            background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: 1s ease-in-out;
        }

        .logo {
            font-family: 'Courier New', Courier, monospace;
            font-size: clamp(40px, 8vw, 100px);
            color: #fff;
            text-shadow: 5px 5px 0px #373737, 10px 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 50px;
            animation: flutuar 3s infinite ease-in-out;
        }

        @keyframes flutuar {
            0%, 100% { transform: scale(1) rotate(-1deg); }
            50% { transform: scale(1.05) rotate(1deg); }
        }

        .btn-minecraft {
            width: 380px; padding: 15px; margin: 10px;
            background: #6c6c6c; border: 4px solid #000;
            color: white; font-size: 20px; font-weight: bold;
            cursor: pointer; text-shadow: 2px 2px #000;
            box-shadow: inset -4px -4px #222, inset 4px 4px #aaa;
            transition: 0.2s;
        }

        .btn-minecraft:hover { background: #5fa03d; border-color: #fff; transform: translateY(-3px); }

        #crosshair {
            position: fixed; top: 50%; left: 50%; color: white;
            font-size: 24px; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10; display: none;
        }
    </style>
</head>
<body>

    <audio id="musica" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="tela-inicial">
        <div class="logo">BLOCKS 3D</div>
        <button class="btn-minecraft" onclick="iniciarTudo()">JOGAR MUNDO</button>
        <button class="btn-minecraft">OPÇÕES</button>
    </div>

    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="logicajogo.js"></script>

    <script>
        function iniciarTudo() {
            // Toca a música
            const musica = document.getElementById('musica');
            musica.volume = 0.3;
            musica.play();

            // Esconde o menu
            document.getElementById('tela-inicial').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('tela-inicial').style.display = 'none';
                document.getElementById('crosshair').style.display = 'block';
                if(typeof inicializar3D === "function") inicializar3D();
            }, 1000);
        }
    </script>
</body>
</html>
