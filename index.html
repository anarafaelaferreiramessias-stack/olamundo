<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Menu Clone</title>
    <style>
        /* Reset básico e fontes */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; }

        /* Fundo Panorâmico (Simulação do movimento) */
        .panorama {
            position: fixed;
            width: 300%;
            height: 100%;
            background: url('https://minecraft.wiki/images/thumb/7/77/Panorama_Update_Aquatic.png/1200px-Panorama_Update_Aquatic.png');
            background-size: cover;
            filter: blur(4px) brightness(0.7);
            animation: movePanorama 60s linear infinite;
        }

        @keyframes movePanorama {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Overlay principal */
        .menu-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        /* Logo com efeito Splash */
        .logo-wrapper {
            margin-bottom: 50px;
            position: relative;
        }

        .logo {
            width: 500px;
            max-width: 90vw;
            filter: drop-shadow(4px 4px 0px rgba(0,0,0,0.5));
        }

        .splash-text {
            position: absolute;
            right: -20px;
            bottom: -10px;
            color: #FFFF00;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 2px 2px 0px #3f3f00;
            transform: rotate(-20deg);
            animation: splashPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes splashPulse {
            from { transform: rotate(-20deg) scale(1); }
            to { transform: rotate(-20deg) scale(1.1); }
        }

        /* Botões Estilo Minecraft */
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 400px;
        }

        .mc-button {
            background: #4e4e4e;
            border: 2px solid #000;
            border-top-color: #8b8b8b;
            border-left-color: #8b8b8b;
            color: #E0E0E0;
            padding: 10px;
            text-decoration: none;
            font-size: 18px;
            cursor: pointer;
            position: relative;
            box-shadow: inset -4px -4px 0px #222;
        }

        .mc-button:hover {
            background: #7ca335; /* Verde quando hover */
            border-top-color: #a5d151;
            border-left-color: #a5d151;
            color: white;
        }

        .small-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Rodapé */
        .footer-info {
            position: absolute;
            bottom: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 1px #000;
        }
    </style>
</head>
<body>

    <div class="panorama"></div>

    <div class="menu-container">
        <div class="logo-wrapper">
            <img class="logo" src="https://minecraft.wiki/images/Minecraft_Logo.png" alt="Minecraft Logo">
            <div class="splash-text">HTML & CSS Edition!</div>
        </div>

        <div class="button-list">
            <button class="mc-button">Singleplayer</button>
            <button class="mc-button">Multiplayer</button>
            <button class="mc-button" style="color: #aaa;">Minecraft Realms</button>
            
            <div class="small-buttons">
                <button class="mc-button">Options...</button>
                <button class="mc-button">Quit Game</button>
            </div>
        </div>
    </div>

    <div class="footer-info">
        <span>Minecraft 1.20.1</span>
        <span>Copyright Mojang AB. Do not distribute!</span>
    </div>

</body>
</html>
