<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Nature Update</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        /* MENU INICIAL */
        #menu-container {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://i.imgur.com/u7q13eH.jpg') center/cover;
        }
        .mc-title { font-size: 5rem; color: white; text-shadow: 5px 5px #222; margin-bottom: 2rem; font-weight: 900; }
        .play-button { 
            padding: 20px 60px; background: #555; border: 4px solid #000; color: #fff; 
            font-size: 24px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 0 #222;
        }
        .play-button:hover { background: #8dc63f; transform: translateY(-2px); box-shadow: 0 7px 0 #111; }

        /* HUD */
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; gap: 8px; padding: 8px; background: rgba(0,0,0,0.8); border: 3px solid #666;
        }
        .slot { width: 50px; height: 50px; border: 2px solid #444; display: flex; align-items: center; justify-content: center; position: relative; }
        .slot.selected { border-color: #fff; background: rgba(255,255,255,0.2); }
        .count { position: absolute; bottom: 2px; right: 5px; color: #fff; font-size: 16px; text-shadow: 2px 2px #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="menu-container">
        <div class="mc-title">MINECRAFT 2026</div>
        <button class="play-button" onclick="initGame()">NEW GAME</button>
    </div>

    <div id="hotbar">
        <div class="slot selected" id="s0">
            <div style="width:25px; height:25px; background: #6d4c41;"></div>
            <div id="inv-wood" class="count">0</div>
        </div>
        <div class="slot" id="s1"></div><div class="slot" id="s2"></div><div class="slot" id="s3"></div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand, handItem;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let targetRotation = new THREE.Euler(0, 0, 0, 'YXZ');
        let prevTime = performance.now();
        let blocks = [], drops = []; 
        let inventoryWood = 0, selectedSlot = 0;

        const loader = new THREE.TextureLoader();
        const woodTex = loader.load('https://threejs.org/examples/textures/crate.gif');
        const grassTex = loader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');

        function initGame() {
            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('hotbar').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'block';
            
            scene = new THREE.Scene();
            // Skybox simples (Céu com degradê)
            scene.background = new THREE.Color(0x6eb1ff);
            scene.fog = new THREE.Fog(0x6eb1ff, 10, 70);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Chão com Relevo
            const groundGeo = new THREE.PlaneGeometry(200, 200, 40, 40);
            const pos = groundGeo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                let x = pos.getX(i), y = pos.getY(i);
                pos.setZ(i, Math.sin(x*0.1) * Math.cos(y*0.1) * 3);
            }
            groundGeo.computeVertexNormals();
            const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({map: grassTex}));
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            // ADICIONANDO GRAMAS (Vegetação)
            const grassBlockGeo = new THREE.PlaneGeometry(0.5, 0.5);
            const grassMat = new THREE.MeshLambertMaterial({color: 0x4caf50, side: THREE.DoubleSide, transparent: true, opacity: 0.8});
            for(let i=0; i<600; i++) {
                const gx = Math.random()*100-50;
                const gz = Math.random()*100-50;
                const gy = Math.sin(gx*0.1) * Math.cos(gz*0.1) * 3;
                
                const g = new THREE.Mesh(grassBlockGeo, grassMat);
                g.position.set(gx, gy + 0.25, gz);
                g.rotation.y = Math.random() * Math.PI;
                scene.add(g);
            }

            // Mão
            hand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.6), new THREE.MeshLambertMaterial({color: 0xdbac82}));
            scene.add(hand);

            // Árvores
            for(let i=0; i<20; i++) {
                let tx = Math.random()*80-40;
                let tz = Math.random()*80-40;
                let ty = Math.sin(tx*0.1) * Math.cos(tz*0.1) * 3;
                spawnTree(tx, ty, tz);
            }

            raycaster = new THREE.Raycaster();
            setupControls();
            animate();
        }

        function spawnTree(x, y, z) {
            // Tronco
            for(let h=0; h<4; h++) {
                const log = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                log.position.set(x, y + h + 0.5, z);
                log.userData = { type: 'wood', t: 1.2 };
                scene.add(log); blocks.push(log);
            }
            // Folhas (Texturizadas por cor e transparência)
            for(let ly=3; ly<6; ly++) {
                for(let lx=-1; lx<=1; lx++) {
                    for(let lz=-1; lz<=1; lz++) {
                        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color: 0x1b5e20, transparent: true, opacity: 0.9}));
                        leaf.position.set(x+lx, y+ly+0.5, z+lz);
                        leaf.userData = { type: 'leaf', t: 0.3 };
                        scene.add(leaf); blocks.push(leaf);
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
                else {
                    if (e.button === 0) { // Quebrar
                        raycaster.setFromCamera(new THREE.Vector2(), camera);
                        const hits = raycaster.intersectObjects(blocks);
                        if(hits[0] && hits[0].distance < 4) {
                            const obj = hits[0].object;
                            scene.remove(obj);
                            blocks = blocks.filter(b => b !== obj);
                            inventoryWood++;
                            document.getElementById('inv-wood').innerText = inventoryWood;
                        }
                    }
                    if (e.button === 2) { // Construir
                        if(inventoryWood > 0 && selectedSlot === 0) {
                            raycaster.setFromCamera(new THREE.Vector2(), camera);
                            const hits = raycaster.intersectObjects([scene.children[2], ...blocks]);
                            if(hits[0]) {
                                const pos = hits[0].object.position.clone().add(hits[0].face.normal);
                                const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                                b.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                                scene.add(b); blocks.push(b);
                                inventoryWood--;
                                document.getElementById('inv-wood').innerText = inventoryWood;
                            }
                        }
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveF = true; if(e.code === 'KeyS') moveB = true;
                if(e.code === 'KeyA') moveL = true; if(e.code === 'KeyD') moveR = true;
                if(e.code === 'Space' && canJump) { velocity.y += 4; canJump = false; }
            });
            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveF = false; if(e.code === 'KeyS') moveB = false;
                if(e.code === 'KeyA') moveL = false; if(e.code === 'KeyD') moveR = false;
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    targetRotation.y -= e.movementX * 0.002;
                    targetRotation.x -= e.movementY * 0.002;
                    targetRotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            camera.rotation.x += (targetRotation.x - camera.rotation.x) * 0.2;
            camera.rotation.y += (targetRotation.y - camera.rotation.y) * 0.2;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 50.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 50.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            let groundH = Math.sin(camera.position.x*0.1) * Math.cos(camera.position.z*0.1) * 3 + 1.8;
            if (camera.position.y < groundH) { velocity.y = 0; camera.position.y = groundH; canJump = true; }

            // Movimento da mão
            hand.position.copy(camera.position); hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.5); hand.translateY(-0.4 + Math.sin(time*0.005)*0.02); hand.translateZ(-0.7);

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
