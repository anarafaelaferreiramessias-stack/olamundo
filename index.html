<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Ultra 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background: #000; }
        #menu {
            position: absolute; width: 100%; height: 100%; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://i.imgur.com/u7q13eH.jpg') center/cover;
        }
        h1 { color: white; font-size: 70px; text-shadow: 4px 4px #000; letter-spacing: 5px; }
        .btn { padding: 15px 50px; background: #5a5a5a; border: 3px solid #000; color: white; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #3c8527; transform: scale(1.05); border-color: #fff; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; mix-blend-mode: difference; }
        #crosshair::before { top: 8px; left: 0; width: 18px; height: 2px; }
        #crosshair::after { top: 0; left: 8px; width: 2px; height: 18px; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>MINECRAFT JS</h1>
        <button class="btn" onclick="initGame()">NEW GAME</button>
    </div>
    <div id="crosshair" style="display:none;"></div>

    <script>
        let scene, camera, renderer, raycaster, hand, handGroup;
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let blocks = [], prevTime = performance.now();
        let isPunching = false, punchTimer = 0;

        // --- GERADOR DE TEXTURA PIXELADA DETALHADA ---
        function createMinecraftTexture(baseColor, noiseColor, size = 16) {
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, size, size);

            for(let x=0; x<size; x++) {
                for(let y=0; y<size; y++) {
                    if(Math.random() > 0.7) {
                        ctx.fillStyle = noiseColor;
                        ctx.fillRect(x, y, 1, 1);
                    }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; // Mantém os pixels nítidos
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const texGrassTop = createMinecraftTexture('#59903c', '#4a7a32');
        const texGrassSide = createMinecraftTexture('#79553a', '#59903c'); // Lado com grama e terra
        const texWood = createMinecraftTexture('#6a4e32', '#4d3926');
        const texLeaf = createMinecraftTexture('#3a5e24', '#2d4a1c');
        const texSkin = createMinecraftTexture('#dbac82', '#c69970'); // Cor da pele
        const texShirt = createMinecraftTexture('#00acc1', '#00838f'); // Azul da camisa

        function initGame() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 5, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // --- CRIAÇÃO DA MÃO (BRAÇO) ---
            handGroup = new THREE.Group();
            
            // Parte da Manga
            const sleeveGeo = new THREE.BoxGeometry(0.2, 0.2, 0.5);
            const sleeveMat = new THREE.MeshLambertMaterial({ map: texShirt });
            const sleeve = new THREE.Mesh(sleeveGeo, sleeveMat);
            
            // Parte da Pele (Mão)
            const skinGeo = new THREE.BoxGeometry(0.18, 0.18, 0.2);
            const skinMat = new THREE.MeshLambertMaterial({ map: texSkin });
            const skin = new THREE.Mesh(skinGeo, skinMat);
            skin.position.z = -0.3;

            handGroup.add(sleeve);
            handGroup.add(skin);
            scene.add(handGroup);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Chão infinito (visual)
            const floorGeo = new THREE.PlaneGeometry(200, 200);
            const floorMat = new THREE.MeshLambertMaterial({ map: texGrassTop });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            // Floresta de Árvores
            for (let i = 0; i < 50; i++) {
                spawnTree(Math.floor(Math.random()*100-50), 0, Math.floor(Math.random()*100-50));
            }

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            raycaster = new THREE.Raycaster();

            // Bloqueio de Mouse e Eventos
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) {
                    renderer.domElement.requestPointerLock();
                } else {
                    isPunching = true;
                    punchTimer = 0;
                    if (e.button === 0) breakBlock();
                    if (e.button === 2) placeBlock();
                }
            });

            window.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveF = true; if(e.code === 'KeyS') moveB = true;
                if(e.code === 'KeyA') moveL = true; if(e.code === 'KeyD') moveR = true;
                if(e.code === 'Space' && camera.position.y <= 1.7) velocity.y = 5;
            });
            window.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveF = false; if(e.code === 'KeyS') moveB = false;
                if(e.code === 'KeyA') moveL = false; if(e.code === 'KeyD') moveR = false;
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            animate();
        }

        function spawnTree(x, y, z) {
            for (let h = 0; h < 5; h++) {
                const log = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({map: texWood}));
                log.position.set(x, y + h + 0.5, z);
                scene.add(log); blocks.push(log);
            }
            for (let lx = -2; lx <= 2; lx++) {
                for (let ly = 4; ly <= 6; ly++) {
                    for (let lz = -2; lz <= 2; lz++) {
                        if (Math.abs(lx) + Math.abs(lz) > 3) continue;
                        const leaf = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({map: texLeaf, transparent: true, opacity: 0.9}));
                        leaf.position.set(x + lx, y + ly + 0.5, z + lz);
                        scene.add(leaf); blocks.push(leaf);
                    }
                }
            }
        }

        function breakBlock() {
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);
            if (hits.length > 0 && hits[0].distance < 4) {
                scene.remove(hits[0].object);
                blocks = blocks.filter(b => b !== hits[0].object);
            }
        }

        function placeBlock() {
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);
            if (hits.length > 0 && hits[0].distance < 4) {
                const pos = hits[0].object.position.clone().add(hits[0].face.normal);
                const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({map: texWood}));
                b.position.copy(pos);
                scene.add(b); blocks.push(b);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // Física e Movimento
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 15.0 * delta;
            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();
            if (moveF || moveB) velocity.z -= direction.z * 60.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 60.0 * delta;
            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;
            if (camera.position.y < 1.6) { velocity.y = 0; camera.position.y = 1.6; }

            // --- ANIMAÇÃO DA MÃO ---
            handGroup.position.copy(camera.position);
            handGroup.quaternion.copy(camera.quaternion);

            // Movimento de balanço ao andar
            let bobbing = Math.sin(time * 0.01) * 0.02;
            if (moveF || moveB || moveL || moveR) {
                bobbing = Math.sin(time * 0.015) * 0.05;
            }

            handGroup.translateX(0.4); // Posiciona à direita
            handGroup.translateY(-0.3 + bobbing);
            handGroup.translateZ(-0.5);

            // Animação de Soco (Clique)
            if (isPunching) {
                punchTimer += delta * 15;
                handGroup.translateZ(-Math.sin(punchTimer) * 0.3);
                handGroup.rotateX(Math.sin(punchTimer) * 0.2);
                if (punchTimer > Math.PI) { isPunching = false; punchTimer = 0; }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
