<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Shader Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #4a90e2; font-family: sans-serif; }
        #tela-inicial {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.alphacoders.com/133/1331001.png');
            background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .btn { padding: 15px 50px; background: #5fa03d; color: white; border: 4px solid #1a2b11; cursor: pointer; font-size: 22px; font-weight: bold; text-transform: uppercase; }
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 24px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <h1 style="color: white; font-size: 60px; text-shadow: 4px 4px #000;">BLOCKS 3D</h1>
        <button class="btn" onclick="iniciar()">JOGAR AGORA</button>
    </div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let hand;

        // --- GERADOR DE TEXTURAS DE ALTA QUALIDADE ---
        function criarTextura(corBase, corRuidosa, densidade = 120) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64; // Aumentei a resolução do pixel
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = corBase;
            ctx.fillRect(0, 0, 64, 64);
            
            for (let i = 0; i < densidade; i++) {
                ctx.fillStyle = corRuidosa;
                let size = Math.random() * 4 + 2;
                ctx.fillRect(Math.floor(Math.random()*64), Math.floor(Math.random()*64), size, size);
            }
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function iniciar() {
            document.getElementById('tela-inicial').style.display = 'none';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.01); // Neblina que dá profundidade

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // ILUMINAÇÃO DE "SHADER"
            const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(luzAmbiente);

            const sol = new THREE.DirectionalLight(0xffffff, 1.0);
            sol.position.set(50, 100, 50);
            sol.castShadow = true;
            scene.add(sol);

            // Cores mais bonitas (Padrão Minecraft Moderno)
            const texGrama = criarTextura('#598a32', '#4a752a');
            const texTerra = criarTextura('#79553a', '#5d3f2a');
            const texMadeira = criarTextura('#5d3f2a', '#3d291b');
            const texFolha = criarTextura('#2d4c1e', '#1e3314');
            const texCamisa = criarTextura('#008b8b', '#007070'); // Manga ciano
            const texPele = criarTextura('#d8bb9d', '#c2a385');

            const matGrama = [
                new THREE.MeshStandardMaterial({ map: texTerra }),
                new THREE.MeshStandardMaterial({ map: texTerra }),
                new THREE.MeshStandardMaterial({ map: texGrama }),
                new THREE.MeshStandardMaterial({ map: texTerra }),
                new THREE.MeshStandardMaterial({ map: texTerra }),
                new THREE.MeshStandardMaterial({ map: texTerra })
            ];

            // Gerar chão vasto (100x100) com relevo suave
            const geo = new THREE.BoxGeometry(1, 1, 1);
            for (let x = -50; x < 50; x++) {
                for (let z = -50; z < 50; z++) {
                    let h = Math.floor(Math.sin(x/10) * Math.cos(z/10) * 2.5);
                    const bloco = new THREE.Mesh(geo, matGrama);
                    bloco.position.set(x, h, z);
                    bloco.receiveShadow = true;
                    scene.add(bloco);
                    objects.push(bloco);

                    if(Math.random() > 0.99) criarArvore(x, h+1, z, texMadeira, texFolha);
                }
            }

            // --- MÃO DETALHADA ---
            hand = new THREE.Group();
            // Manga da camisa
            const manga = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.6), new THREE.MeshStandardMaterial({ map: texCamisa }));
            manga.position.set(0.6, -0.5, -0.4);
            hand.add(manga);
            // Braço (Pele)
            const braco = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.4), new THREE.MeshStandardMaterial({ map: texPele }));
            braco.position.set(0.6, -0.5, -0.8);
            hand.add(braco);
            // Bloco segurado
            const item = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), matGrama);
            item.position.set(0.6, -0.3, -1.1);
            hand.add(item);
            
            scene.add(hand);

            setupControls();
        }

        function criarArvore(x, y, z, texM, texF) {
            const matM = new THREE.MeshStandardMaterial({ map: texM });
            const matF = new THREE.MeshStandardMaterial({ map: texF });
            const geo = new THREE.BoxGeometry(1,1,1);
            for(let i=0; i<4; i++) {
                const t = new THREE.Mesh(geo, matM);
                t.position.set(x, y+i, z);
                scene.add(t);
                objects.push(t);
            }
            for(let fx=-2; fx<=2; fx++) {
                for(let fy=3; fy<=5; fy++) {
                    for(let fz=-2; fz<=2; fz++) {
                        if(Math.abs(fx)+Math.abs(fz) > 3) continue;
                        const f = new THREE.Mesh(geo, matF);
                        f.position.set(x+fx, y+fy, z+fz);
                        scene.add(f);
                        objects.push(f);
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.2; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            document.addEventListener('mousedown', () => document.body.requestPointerLock());
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            velocity.x -= velocity.x * 0.1;
            velocity.z -= velocity.z * 0.1;
            velocity.y -= 0.008;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 0.07;
            if (moveL || moveR) velocity.x -= direction.x * 0.07;

            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);
            camera.position.y += velocity.y;

            let gridX = Math.round(camera.position.x);
            let gridZ = Math.round(camera.position.z);
            let groundY = Math.sin(gridX/10) * Math.cos(gridZ/10) * 2.5;

            if (camera.position.y < groundY + 1.8) {
                velocity.y = 0; camera.position.y = groundY + 1.8; canJump = true;
            }

            if(hand) {
                hand.position.copy(camera.position);
                hand.rotation.copy(camera.rotation);
                let bob = (moveF || moveB || moveL || moveR) ? Math.sin(Date.now() * 0.008) * 0.04 : 0;
                hand.position.y += bob;
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
