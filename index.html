<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 2026 - Build Update</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <div class="title-mc">MINECRAFT 2026</div>
        <button class="btn-menu" onclick="startGame()">START GAME</button>
    </div>

    <div id="instructions">
        WASD: Movimento | ESPAÇO: Pular<br>
        CLICK ESQUERDO: Minerar | CLICK DIREITO: Colocar Bloco<br>
        1-4: Slots do Inventário
    </div>

    <div id="mining-progress">
        <div id="mining-bar"></div>
    </div>
    
    <div id="hotbar">
        <div class="slot selected" id="s0">
            <div class="item-icon wood-block"></div>
            <div id="inv-wood" class="count">0</div>
        </div>
        <div class="slot" id="s1"></div>
        <div class="slot" id="s2"></div>
        <div class="slot" id="s3"></div>
    </div>

    <div id="crosshair"></div>

    <script src="script.js"></script>
</body>
</html>
