<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Jogo de Ritmo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="opponent" class="character">🤖</div>
        <div id="player" class="character">🎤</div>

        <div class="strum-line">
            <div class="receptor" id="key-0" data-key="ArrowLeft">⬅️</div>
            <div class="receptor" id="key-1" data-key="ArrowDown">⬇️</div>
            <div class="receptor" id="key-2" data-key="ArrowUp">⬆️</div>
            <div class="receptor" id="key-3" data-key="ArrowRight">➡️</div>
        </div>

        <div id="score">Pontos: 0</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
