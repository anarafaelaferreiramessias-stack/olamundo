<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Security Monitor - Night 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="static-overlay"></div>

    <div id="game-viewport">
        <div id="office" class="room-view">
            <div class="fan"></div> <div id="ui-overlay">
                <div class="stats">
                    <h2 id="clock">12 AM</h2>
                    <p>Power Left: <span id="power-val">100</span>%</p>
                    <p>Usage: <span id="usage-bars">■□□</span></p>
                </div>
            </div>
            
            <div class="door-controls left">
                <button class="btn-light" onmousedown="toggleLight('left')" onmouseup="toggleLight(null)">LIGHT</button>
                <button class="btn-door" onclick="toggleDoor('left')">DOOR</button>
            </div>
        </div>

        <div id="monitor" class="hidden">
            <div class="cam-screen">
                <div id="cam-label">CAM 1A - SHOW STAGE</div>
                <div class="scanline"></div>
            </div>
            
            <div class="map-container">
                <button class="cam-btn" data-cam="1A" onclick="switchCam('1A')">1A</button>
                <button class="cam-btn" data-cam="1B" onclick="switchCam('1B')">1B</button>
                <button class="cam-btn" data-cam="2A" onclick="switchCam('2A')">2A</button>
                <button class="cam-btn" data-cam="4A" onclick="switchCam('4A')">4A</button>
            </div>
        </div>

        <div id="monitor-trigger" onmouseenter="toggleMonitor()"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
