<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Ultra Pixel Edition</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/minecraftia');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Minecraftia', sans-serif; }
        #tela-inicial {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), 
                        url('https://www.minecraft.net/content/dam/games/minecraft/key-art/Games_Subnav_Minecraft-Wild-Update_600x338.jpg');
            background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .logo { font-size: 70px; color: #fff; text-shadow: 6px 6px 0px #373737; margin-bottom: 30px; }
        .btn { width: 300px; padding: 15px; margin: 10px; background: #4e4e4e; border: 3px solid #000; color: white; cursor: pointer; box-shadow: inset -4px -4px #222, inset 4px 4px #aaa; }
        .btn:hover { background: #5fa03d; }
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 24px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; display: none; }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <div class="logo">BLOCKS 3D</div>
        <button class="btn" onclick="iniciar()">JOGAR NOVO MUNDO</button>
    </div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let hand;

        function iniciar() {
            document.getElementById('tela-inicial').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x72a0ff); // Azul mais vivo
            scene.fog = new THREE.FogExp2(0x72a0ff, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false }); // Antialias false ajuda no look pixelado
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Iluminação dinâmica
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // Carregador de Texturas
            const loader = new THREE.TextureLoader();
            
            // Função para aplicar filtro de pixel (Nearest)
            const pixelTex = (url) => {
                const t = loader.load(url);
                t.magFilter = THREE.NearestFilter; // ESSENCIAL PARA PIXEL ART
                t.minFilter = THREE.NearestFilter;
                return t;
            };

            const texGrama = pixelTex('https://i.imgur.com/v678atR.png'); // Topo Grama
            const texTerra = pixelTex('https://i.imgur.com/6S7X71p.png'); // Lado Grama/Terra
            const texMadeira = pixelTex('https://i.imgur.com/K676S28.png'); // Tronco
            const texFolha = pixelTex('https://i.imgur.com/O7777z5.png'); // Folhas

            // Materiais
            const matGrama = [
                new THREE.MeshLambertMaterial({ map: texTerra }), // lados
                new THREE.MeshLambertMaterial({ map: texTerra }), 
                new THREE.MeshLambertMaterial({ map: texGrama }), // topo
                new THREE.MeshLambertMaterial({ map: texTerra }), 
                new THREE.MeshLambertMaterial({ map: texTerra }), 
                new THREE.MeshLambertMaterial({ map: texTerra })
            ];

            // Gerar o chão (20x20)
            const geo = new THREE.BoxGeometry(1,1,1);
            for(let x = -10; x < 10; x++) {
                for(let z = -10; z < 10; z++) {
                    const bloco = new THREE.Mesh(geo, matGrama);
                    bloco.position.set(x, 0, z);
                    scene.add(bloco);
                    objects.push(bloco);

                    // Chance de nascer uma árvore
                    if(Math.random() > 0.96 && (x > 2 || x < -2)) {
                        criarArvore(x, 1, z, texMadeira, texFolha);
                    }
                }
            }

            // Criar a mão
            hand = new THREE.Mesh(geo, matGrama);
            hand.scale.set(0.4, 0.4, 0.8);
            scene.add(hand);

            setupControls();
        }

        function criarArvore(x, y, z, texM, texF) {
            const geo = new THREE.BoxGeometry(1,1,1);
            const matM = new THREE.MeshLambertMaterial({ map: texM });
            const matF = new THREE.MeshLambertMaterial({ map: texF, transparent: true });

            // Tronco (3 blocos)
            for(let i=0; i<3; i++) {
                const t = new THREE.Mesh(geo, matM);
                t.position.set(x, y+i, z);
                scene.add(t);
                objects.push(t);
            }

            // Folhas (Copa)
            for(let fx=-1; fx<=1; fx++) {
                for(let fy=0; fy<=1; fy++) {
                    for(let fz=-1; fz<=1; fz++) {
                        const folha = new THREE.Mesh(geo, matF);
                        folha.position.set(x+fx, y+3+fy, z+fz);
                        scene.add(folha);
                        objects.push(folha);
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.22; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            document.addEventListener('mousedown', () => document.body.requestPointerLock());
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
            camera.rotation.order = 'YXZ';
        }

        function animate() {
            requestAnimationFrame(animate);

            velocity.x -= velocity.x * 0.1;
            velocity.z -= velocity.z * 0.1;
            velocity.y -= 0.01; // Gravidade

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 0.1;
            if (moveL || moveR) velocity.x -= direction.x * 0.1;

            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);
            camera.position.y += velocity.y;

            if (camera.position.y < 1.8) {
                velocity.y = 0;
                camera.position.y = 1.8;
                canJump = true;
            }

            // Animar mão
            if(hand) {
                hand.position.copy(camera.position);
                hand.rotation.copy(camera.rotation);
                hand.translateZ(-1);
                hand.translateX(0.6);
                hand.translateY(-0.5 + Math.sin(Date.now() * 0.005) * 0.02); // Balanço leve
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
