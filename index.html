<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Build Update</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        /* Menu Inicial */
        #ui-overlay {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #222;
        }
        .title-mc { font-size: 50px; color: #8dc63f; font-weight: bold; margin-bottom: 30px; text-shadow: 3px 3px #000; }
        .btn-menu { 
            padding: 15px 50px; background: #4e4e4e; border: 4px solid #000; color: #fff; 
            cursor: pointer; font-size: 20px; transition: 0.2s;
        }
        .btn-menu:hover { background: #8dc63f; transform: scale(1.05); }

        /* Interface do Jogo */
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; gap: 5px; padding: 5px; background: rgba(0,0,0,0.6); border: 3px solid #333;
        }
        .slot { width: 50px; height: 50px; border: 3px solid #555; display: flex; align-items: center; justify-content: center; position: relative; background: #888; }
        .slot.selected { border: 3px solid #fff; background: #aaa; }
        .count { position: absolute; bottom: 2px; right: 5px; color: #fff; font-weight: bold; text-shadow: 1px 1px #000; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 15px; height: 15px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="title-mc">MINECRAFT JS 2026</div>
        <button class="btn-menu" onclick="startGame()">INICIAR MUNDO</button>
    </div>

    <div id="hotbar">
        <div class="slot selected" id="s0">
            <div style="width:30px; height:30px; background: #5d4037; border: 1px solid #000;"></div>
            <div id="inv-wood" class="count">10</div>
        </div>
        <div class="slot" id="s1"></div>
        <div class="slot" id="s2"></div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, selectionBox;
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let targetRotation = new THREE.Euler(0, 0, 0, 'YXZ');
        let prevTime = performance.now();
        let blocks = [];
        let inventoryWood = 10;

        function startGame() {
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('hotbar').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'block';
            init();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x74b9ff);
            scene.fog = new THREE.Fog(0x74b9ff, 10, 50);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2; // Altura dos olhos

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // Chao Base
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x2d5a27 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Cubo de Seleção (A borda preta que indica onde você está olhando)
            const selGeo = new THREE.BoxGeometry(1.02, 1.02, 1.02);
            const selMat = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true });
            selectionBox = new THREE.Mesh(selGeo, selMat);
            scene.add(selectionBox);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            raycaster = new THREE.Raycaster();

            // Controles
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) {
                    renderer.domElement.requestPointerLock();
                } else {
                    if (e.button === 0) breakBlock(); // Clique Esquerdo
                    if (e.button === 2) placeBlock(); // Clique Direito
                }
            });

            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveF = true;
                if(e.code === 'KeyS') moveB = true;
                if(e.code === 'KeyA') moveL = true;
                if(e.code === 'KeyD') moveR = true;
                if(e.code === 'Space' && camera.position.y <= 2.1) velocity.y = 5;
            });

            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveF = false;
                if(e.code === 'KeyS') moveB = false;
                if(e.code === 'KeyA') moveL = false;
                if(e.code === 'KeyD') moveR = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    targetRotation.y -= e.movementX * 0.002;
                    targetRotation.x -= e.movementY * 0.002;
                    targetRotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotation.x));
                }
            });

            animate();
        }

        function placeBlock() {
            if (inventoryWood <= 0) return;
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);
            
            // Se não houver blocos, permite colocar no chão (y=0)
            if (hits.length === 0) {
                // Lógica simplificada: se olhar pro chão, coloca bloco
                // Para este exemplo, vamos focar em colocar blocos encostados em outros
                return;
            }

            if (hits.length > 0 && hits[0].distance < 5) {
                const hit = hits[0];
                const pos = hit.object.position.clone().add(hit.face.normal);
                
                const b = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 1, 1), 
                    new THREE.MeshLambertMaterial({ color: 0x5d4037 }) // Cor de madeira
                );
                b.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                
                scene.add(b);
                blocks.push(b);
                inventoryWood--;
                document.getElementById('inv-wood').innerText = inventoryWood;
            }
        }

        function breakBlock() {
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);
            if (hits.length > 0 && hits[0].distance < 5) {
                scene.remove(hits[0].object);
                blocks = blocks.filter(b => b !== hits[0].object);
                inventoryWood++;
                document.getElementById('inv-wood').innerText = inventoryWood;
            }
        }

        // Criar alguns blocos iniciais para teste
        function createInitialBlocks() {
            for(let i = 0; i < 5; i++) {
                const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({color: 0x5d4037}));
                b.position.set(i - 2, 0.5, -5);
                scene.add(b);
                blocks.push(b);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // Rotação suave
            camera.rotation.x += (targetRotation.x - camera.rotation.x) * 0.2;
            camera.rotation.y += (targetRotation.y - camera.rotation.y) * 0.2;

            // Movimento
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * delta; // Gravidade

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 50.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 50.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 2) {
                velocity.y = 0;
                camera.position.y = 2;
            }

            // Atualizar caixa de seleção
            raycaster.setFromCamera(new THREE.Vector2(), camera);
            const hits = raycaster.intersectObjects(blocks);
            if(hits.length > 0 && hits[0].distance < 5) {
                selectionBox.visible = true;
                selectionBox.position.copy(hits[0].object.position);
            } else {
                selectionBox.visible = false;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        // Bloquear menu de contexto (botão direito)
        window.addEventListener('contextmenu', e => e.preventDefault());
        
        // Iniciar blocos de teste após carregar
        setTimeout(createInitialBlocks, 500);

    </script>
</body>
</html>
