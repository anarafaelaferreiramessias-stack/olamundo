<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Survivor Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: 'Courier New', monospace; }
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 24px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
        #hotbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; background: rgba(0,0,0,0.7); padding: 10px; border: 4px solid #333; }
        .slot { width: 60px; height: 60px; border: 4px solid #555; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; text-align: center; }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.2); }
        #menu { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        .btn { padding: 15px 40px; background: #5fa03d; color: white; border: 4px solid #1a2b11; cursor: pointer; font-size: 22px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="color: white; font-size: 60px; text-shadow: 4px 4px #000;">BLOCKS 3D</h1>
        <p style="color: #ccc;">Survivor Mode</p>
        <button class="btn" onclick="start()">GERAR MUNDO</button>
    </div>

    <div id="crosshair">+</div>

    <div id="hotbar">
        <div id="s1" class="slot active">GRAMA<br>(1)</div>
        <div id="s2" class="slot">MADEIRA<br>(2)</div>
        <div id="s3" class="slot">FOLHA<br>(3)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [], raycaster;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let selected = 1, handGroup;

        // MATERIAIS COM TEXTURA PIXELADA
        function createPixelTexture(color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color1;
            ctx.fillRect(0,0,16,16);
            for(let i=0; i<40; i++) {
                ctx.fillStyle = color2;
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        const texGrama = createPixelTexture('#5fa03d', '#4a7d31');
        const texTerra = createPixelTexture('#79553a', '#5d3f2a');
        const texMadeira = createPixelTexture('#5d3f2a', '#3d291b');
        const texFolha = createPixelTexture('#3a6324', '#2d4d1c');
        const texCamisa = createPixelTexture('#008b8b', '#007070');
        const texPele = createPixelTexture('#d8bb9d', '#c2a385');

        const matGrama = [
            new THREE.MeshLambertMaterial({map: texTerra}), new THREE.MeshLambertMaterial({map: texTerra}),
            new THREE.MeshLambertMaterial({map: texGrama}), new THREE.MeshLambertMaterial({map: texTerra}),
            new THREE.MeshLambertMaterial({map: texTerra}), new THREE.MeshLambertMaterial({map: texTerra})
        ];
        const matMadeira = new THREE.MeshLambertMaterial({map: texMadeira});
        const matFolha = new THREE.MeshLambertMaterial({map: texFolha});

        function start() {
            document.getElementById('menu').style.display = 'none';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            raycaster = new THREE.Raycaster();

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // GERAÇÃO DO CHÃO E ÁRVORES
            const geo = new THREE.BoxGeometry(1,1,1);
            for(let x=-30; x<30; x++) {
                for(let z=-30; z<30; z++) {
                    const b = new THREE.Mesh(geo, matGrama);
                    b.position.set(x, 0, z);
                    scene.add(b);
                    objects.push(b);
                    if(Math.random() > 0.985 && (x > 3 || x < -3)) spawnTree(x, 1, z);
                }
            }

            // NUVENS DE PIXEL
            for(let i=0; i<15; i++) {
                const cloud = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 3), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.8}));
                cloud.position.set(Math.random()*80-40, 15 + Math.random()*5, Math.random()*80-40);
                scene.add(cloud);
            }

            // BRAÇO DO PERSONAGEM (STEVE)
            handGroup = new THREE.Group();
            const sleeve = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.7), new THREE.MeshLambertMaterial({map: texCamisa}));
            sleeve.position.set(0.6, -0.5, -0.5);
            const arm = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.4), new THREE.MeshLambertMaterial({map: texPele}));
            arm.position.set(0.6, -0.5, -0.9);
            handGroup.add(sleeve);
            handGroup.add(arm);
            scene.add(handGroup);

            controls();
        }

        function spawnTree(x, y, z) {
            const geo = new THREE.BoxGeometry(1,1,1);
            for(let i=0; i<4; i++) {
                const trunk = new THREE.Mesh(geo, matMadeira);
                trunk.position.set(x, y+i, z);
                scene.add(trunk);
                objects.push(trunk);
            }
            for(let ox=-1; ox<=1; ox++) {
                for(let oz=-1; oz<=1; oz++) {
                    for(let oy=3; oy<=5; oy++) {
                        if(ox === 0 && oz === 0 && oy < 5) continue;
                        const leaf = new THREE.Mesh(geo, matFolha);
                        leaf.position.set(x+ox, y+oy, z+oz);
                        scene.add(leaf);
                        objects.push(leaf);
                    }
                }
            }
        }

        function controls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.22; canJump = false; }
                if(e.key=='1') selectSlot(1); if(e.key=='2') selectSlot(2); if(e.key=='3') selectSlot(3);
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            document.addEventListener('mousedown', e => {
                if(!document.pointerLockElement) { document.body.requestPointerLock(); return; }
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const hits = raycaster.intersectObjects(objects);
                if(hits.length > 0 && hits[0].distance < 6) {
                    if(e.button === 0) { // QUEBRAR
                        scene.remove(hits[0].object);
                        objects = objects.filter(o => o !== hits[0].object);
                    } else if(e.button === 2) { // COLOCAR
                        const pos = hits[0].point.add(hits[0].face.normal.clone().multiplyScalar(0.5));
                        const m = selected==1?matGrama:(selected==2?matMadeira:matFolha);
                        const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), m);
                        b.position.set(Math.round(pos.x), Math.round(pos.y), Math.round(pos.z));
                        scene.add(b); objects.push(b);
                    }
                }
            });
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
            window.oncontextmenu = (e) => e.preventDefault();
        }

        function selectSlot(n) {
            selected = n;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            document.getElementById('s'+n).classList.add('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            const prevPos = camera.position.clone();

            velocity.x -= velocity.x * 0.1;
            velocity.z -= velocity.z * 0.1;
            velocity.y -= 0.01;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 0.08;
            if (moveL || moveR) velocity.x -= direction.x * 0.08;

            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);

            // COLISÃO COM BLOCOS
            for(let o of objects) {
                if(camera.position.distanceTo(o.position) < 0.8 && Math.abs(camera.position.y - o.position.y) < 1.2) {
                    camera.position.x = prevPos.x; camera.position.z = prevPos.z;
                }
            }

            camera.position.y += velocity.y;
            if (camera.position.y < 1.6) { velocity.y = 0; camera.position.y = 1.6; canJump = true; }

            if(handGroup) {
                handGroup.position.copy(camera.position);
                handGroup.rotation.copy(camera.rotation);
                handGroup.position.y += Math.sin(Date.now()*0.005)*0.02; // Balanço da mão
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
