<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Java Edition - Engine v2.0</title>
    <style>
        body { margin: 0; overflow: hidden; background: #78A7FF; image-rendering: pixelated; }
        canvas { display: block; }
        #blocker {
            position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
            color: white; font-family: 'Courier New', monospace; z-index: 100; cursor: pointer;
            text-shadow: 2px 2px #000;
        }
        #crosshair { 
            position: fixed; top: 50%; left: 50%; width: 20px; height: 20px; 
            transform: translate(-50%, -50%); pointer-events: none; z-index: 50; 
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; mix-blend-mode: difference; }
        #crosshair::before { top: 0; left: 9px; width: 2px; height: 20px; }
        #crosshair::after { top: 9px; left: 0; width: 20px; height: 2px; }
    </style>
</head>
<body>

    <div id="blocker"><h1>JOGAR MINECRAFT JAVA</h1></div>
    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls, hand, raycaster;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(), prevTime = performance.now();
        let objects = [];

        // GERADOR DE TEXTURAS AVANÇADO
        function createTexture(colors, size = 16) {
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            for(let x=0; x<size; x++) {
                for(let y=0; y<size; y++) {
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78A7FF);
            scene.fog = new THREE.Fog(0x78A7FF, 200, 1500);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 3000);
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            document.getElementById('blocker').addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => document.getElementById('blocker').style.display = 'none');
            controls.addEventListener('unlock', () => document.getElementById('blocker').style.display = 'flex');

            // MATERIAIS MULTI-FACE (Grama com lateral de terra)
            const grassTop = createTexture(['#59a031', '#4e8a2c', '#61ad35']);
            const grassSide = createTexture(['#866043', '#59a031', '#7a553a']); // Terra com topo verde
            const dirt = createTexture(['#866043', '#60412b', '#7a553a']);
            const logSide = createTexture(['#674a32', '#3e2d1c', '#553a26']);

            const grassMaterials = [
                new THREE.MeshLambertMaterial({map: grassSide}), new THREE.MeshLambertMaterial({map: grassSide}),
                new THREE.MeshLambertMaterial({map: grassTop}), new THREE.MeshLambertMaterial({map: dirt}),
                new THREE.MeshLambertMaterial({map: grassSide}), new THREE.MeshLambertMaterial({map: grassSide})
            ];

            // GERAÇÃO DE TERRENO (BIOMAS)
            const geo = new THREE.BoxGeometry(16, 16, 16);
            for(let x = -60; x < 60; x++) {
                for(let z = -60; z < 60; z++) {
                    const h = Math.floor((Math.sin(x*0.08) + Math.cos(z*0.08)) * 3);
                    const y = h * 16;
                    
                    const block = new THREE.Mesh(geo, grassMaterials);
                    block.position.set(x*16, y, z*16);
                    scene.add(block);
                    objects.push(block);

                    // Adicionar árvores em lugares aleatórios
                    if(Math.random() < 0.01 && Math.abs(x) > 5) {
                        spawnTree(x*16, y+16, z*16, logSide);
                    }
                }
            }

            // ILUMINAÇÃO DE CINEMA
            const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
            scene.add(light);
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(100, 200, 100);
            scene.add(sun);

            // BRAÇO DO JOGADOR (Steve)
            const handGeo = new THREE.BoxGeometry(6, 6, 20);
            const handMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            hand = new THREE.Mesh(handGeo, handMat);
            hand.position.set(12, -10, -15);
            camera.add(hand);
            scene.add(controls.getObject());

            raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, -1, 0), 0, 32);

            // MOVIMENTAÇÃO
            const handleKey = (v) => (e) => {
                if(e.code==='KeyW') moveForward=v; if(e.code==='KeyS') moveBackward=v;
                if(e.code==='KeyA') moveLeft=v; if(e.code==='KeyD') moveRight=v;
                if(e.code==='Space' && v && canJump) { velocity.y += 200; canJump = false; }
            };
            document.addEventListener('keydown', handleKey(true));
            document.addEventListener('keyup', handleKey(false));
        }

        function spawnTree(x, y, z, mat) {
            const logGeo = new THREE.BoxGeometry(16, 16, 16);
            const leafGeo = new THREE.BoxGeometry(48, 48, 48);
            const leafMat = new THREE.MeshLambertMaterial({ color: 0x2d4514, transparent: true, opacity: 0.9 });
            
            for(let i=0; i<4; i++) {
                const trunk = new THREE.Mesh(logGeo, new THREE.MeshLambertMaterial({map: mat}));
                trunk.position.set(x, y + (i*16), z);
                scene.add(trunk);
            }
            const leaves = new THREE.Mesh(leafGeo, leafMat);
            leaves.position.set(x, y + 64, z);
            scene.add(leaves);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 60.0 * delta; 

                if(moveForward) velocity.z -= 600 * delta;
                if(moveBackward) velocity.z += 600 * delta;
                if(moveLeft) velocity.x -= 600 * delta;
                if(moveRight) velocity.x += 600 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                controls.getObject().position.y += velocity.y * delta;

                // BOBBING (Passos realistas)
                const speed = 0.008;
                if(moveForward || moveBackward || moveLeft || moveRight) {
                    hand.position.y = -10 + Math.sin(time * speed * 2) * 1.5;
                    hand.position.x = 12 + Math.cos(time * speed) * 1;
                    camera.position.y += Math.sin(time * speed * 2) * 0.1;
                }

                // COLISÃO SIMPLES
                if(controls.getObject().position.y < 50) {
                    velocity.y = 0;
                    controls.getObject().position.y = 50;
                    canJump = true;
                }
            }
            prevTime = time;
            renderer.render(scene, camera);
        }

        init(); animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
