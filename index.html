<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft - Física Sólida</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        canvas { display: block; }
        #menu {
            position: fixed; width: 100%; height: 100%; z-index: 100;
            background: rgba(0,0,0,0.7); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; font-family: sans-serif;
        }
        .btn { padding: 15px 50px; font-size: 20px; background: #4a7023; color: white; border: 3px solid #000; cursor: pointer; font-weight: bold; }
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.8); transform: translate(-50%, -50%);
            pointer-events: none; z-index: 50; mix-blend-mode: difference;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="font-size: 40px; text-shadow: 3px 3px #000;">MODO <span style="color:#7cfc00">SÓLIDO</span></h1>
        <button class="btn" onclick="start()">INICIAR</button>
    </div>

    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls, hand;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(), prevTime = performance.now();
        let objects = [];
        let isPunching = false, punchTimer = 0;

        const blockSize = 16;
        const pSize = 5; // "Grossura" do corpo do jogador

        function createTex(base, noise) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = base; ctx.fillRect(0, 0, 64, 64);
            for(let i=0; i<40; i++) {
                ctx.fillStyle = noise[Math.floor(Math.random() * noise.length)];
                ctx.fillRect(Math.random()*64, Math.random()*64, 8, 8);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter; return tex;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(100, 200, 100);
            scene.add(sun);

            const tGrass = createTex('#567d46', ['#4d703e', '#5e8a4d']);
            const mat = new THREE.MeshLambertMaterial({ map: tGrass });

            // Mão
            hand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 1.5), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
            hand.position.set(0.8, -0.8, -1.2);
            camera.add(hand);

            // Geração de mundo (terreno simples para performance)
            const geo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
            for (let x = -30; x < 30; x++) {
                for (let z = -30; z < 30; z++) {
                    let h = Math.round(Math.sin(x/5) * Math.cos(z/5) * 2);
                    const block = new THREE.Mesh(geo, mat);
                    block.position.set(x * blockSize, h * blockSize, z * blockSize);
                    scene.add(block);
                    objects.push(block);
                }
            }

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            document.body.addEventListener('mousedown', breakBlock);
        }

        // Função crucial de colisão AABB
        function isColliding(pos) {
            for (let i = 0; i < objects.length; i++) {
                const b = objects[i].position;
                if (pos.x + pSize > b.x - 8 && pos.x - pSize < b.x + 8 &&
                    pos.z + pSize > b.z - 8 && pos.z - pSize < b.z + 8 &&
                    pos.y - 12 < b.y + 8 && pos.y + 4 > b.y - 8) {
                    return true;
                }
            }
            return false;
        }

        function breakBlock() {
            if (!controls.isLocked) return;
            isPunching = true; punchTimer = 0;
            const ray = new THREE.Raycaster();
            ray.setFromCamera(new THREE.Vector2(0, 0), camera);
            const hits = ray.intersectObjects(objects);
            if (hits.length > 0 && hits[0].distance < 64) {
                scene.remove(hits[0].object);
                objects = objects.filter(obj => obj !== hits[0].object);
            }
        }

        function start() { document.getElementById('menu').style.display = 'none'; controls.lock(); }

        document.addEventListener('keydown', (e) => {
            if(e.code === 'KeyW') moveForward = true;
            if(e.code === 'KeyS') moveBackward = true;
            if(e.code === 'KeyA') moveLeft = true;
            if(e.code === 'KeyD') moveRight = true;
            if(e.code === 'Space' && canJump) { velocity.y += 200; canJump = false; }
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW') moveForward = false;
            if(e.code === 'KeyS') moveBackward = false;
            if(e.code === 'KeyA') moveLeft = false;
            if(e.code === 'KeyD') moveRight = false;
        });

        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 60.0 * delta; 

                const player = controls.getObject();

                // 1. Calcular movimento pretendido
                let moveX = (Number(moveRight) - Number(moveLeft)) * 400 * delta;
                let moveZ = (Number(moveForward) - Number(moveBackward)) * 400 * delta;

                // 2. Colisão no Eixo X
                const oldX = player.position.x;
                controls.moveRight(moveX * delta); 
                if (isColliding(player.position)) {
                    player.position.x = oldX;
                }

                // 3. Colisão no Eixo Z
                const oldZ = player.position.z;
                controls.moveForward(moveZ * delta);
                if (isColliding(player.position)) {
                    player.position.z = oldZ;
                }

                // 4. Colisão no Eixo Y (Gravidade/Pulo)
                player.position.y += (velocity.y * delta);
                if (isColliding(player.position)) {
                    if (velocity.y < 0) canJump = true;
                    player.position.y -= (velocity.y * delta);
                    velocity.y = 0;
                }

                // Animação da mão
                if (isPunching) {
                    punchTimer += delta * 15;
                    hand.position.z = -1.2 - Math.sin(punchTimer) * 0.5;
                    if (punchTimer > Math.PI) isPunching = false;
                }

                prevTime = time;
            }
            renderer.render(scene, camera);
        }
        init(); animate();
    </script>
</body>
</html>
