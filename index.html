<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planeta Rodando</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at center, #0a001f 0%, #000 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .space {
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: none;
    }

    .stars {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(white 1px, transparent 1px) 0 0 / 80px 80px,
        radial-gradient(white 0.8px, transparent 0.8px) 40px 40px / 60px 60px;
      opacity: 0.7;
      animation: starsDrift 400s linear infinite;
    }

    @keyframes starsDrift {
      to { transform: translateZ(-3000px); }
    }

    .planet-container {
      position: relative;
      width: 420px;
      height: 420px;
      perspective: 1800px;
    }

    .planet {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: 
        radial-gradient(circle at 30% 40%, #4a90e2 0%, #0066cc 40%, #003366 70%, #001122 100%);
      box-shadow: 
        inset 0 0 80px rgba(0,0,0,0.6),
        inset 60px -40px 120px rgba(255,255,255,0.15);
      transform-style: preserve-3d;
      animation: rotatePlanet 60s linear infinite;
    }

    /* Atmosfera glow */
    .atmosphere {
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(100,180,255,0.35) 20%, transparent 70%);
      filter: blur(60px);
      animation: glowPulse 12s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0%   { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 0.95; transform: scale(1.15); }
    }

    @keyframes rotatePlanet {
      from { transform: rotateY(0deg) rotateX(8deg); }
      to   { transform: rotateY(360deg) rotateX(8deg); }
    }

    /* Luz solar vindo de um lado */
    .light {
      position: absolute;
      top: -200px;
      left: 50%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle at 50% 60%, rgba(255,240,180,0.4) 0%, transparent 60%);
      transform: translateX(-50%);
      pointer-events: none;
      filter: blur(120px);
      animation: lightMove 80s ease-in-out infinite alternate;
    }

    @keyframes lightMove {
      0%   { left: 40%; opacity: 0.7; }
      100% { left: 60%; opacity: 1; }
    }

    /* Texto opcional (remova se não quiser) */
    .title {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.8);
      font-family: Arial, sans-serif;
      font-size: 1.6rem;
      text-shadow: 0 0 20px rgba(100,180,255,0.8);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="space">
    <div class="stars"></div>
  </div>

  <div class="planet-container">
    <div class="planet">
      <div class="atmosphere"></div>
    </div>
    <div class="light"></div>
  </div>

  <!-- Texto opcional – pode apagar o div se quiser só o planeta -->
  <div class="title">Um mundo girando no silêncio do espaço...</div>

  <script>
    // Opcional: controle com mouse (vira a câmera)
    document.addEventListener('mousemove', e => {
      const x = (e.clientX / window.innerWidth - 0.5) * 40;
      const y = (e.clientY / window.innerHeight - 0.5) * 30;
      document.querySelector('.planet-container').style.transform = 
        `rotateY(${x}deg) rotateX(${y}deg)`;
    });
  </script>

</body>
</html>
