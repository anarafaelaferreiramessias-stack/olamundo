<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Clone Oficial JS</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; }
        
        /* Menu de Entrada Estilo Minecraft */
        #menu {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://wallpapers.com/images/featured/minecraft-76077zd82l9m47u2.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #logo { width: 500px; max-width: 90%; margin-bottom: 40px; }

        .mc-button {
            width: 300px;
            padding: 15px;
            font-size: 22px;
            color: white;
            background-color: #484848;
            border: 4px solid #000;
            box-shadow: inset -4px -4px 0px #222, inset 4px 4px 0px #888;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            transition: 0.2s;
        }

        .mc-button:hover { background-color: #618c32; }

        #instrucoes {
            margin-top: 20px;
            color: #ddd;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        /* Mira no centro da tela */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            color: white;
            font-size: 24px;
            display: none;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div id="crosshair">+</div>

    <div id="menu">
        <img id="logo" src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_logo.svg" alt="Minecraft">
        <div class="mc-button" onclick="iniciarJogo()">JOGAR</div>
        <div id="instrucoes">
            WASD: Andar | ESPAÇO: Pular | MOUSE: Olhar<br>
            (Clique na tela após jogar para travar o mouse)
        </div>
    </div>

    <!-- Importando a biblioteca 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        function iniciarJogo() {
            // Esconde menu e mostra mira
            document.getElementById('menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';

            // 1. CONFIGURAÇÃO DO MUNDO
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Céu
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.01); // Neblina

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. LUZES
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            // 3. TERRENO (BLOCOS)
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const materialGrama = new THREE.MeshLambertMaterial({ color: 0x55902e });

            for (let x = -15; x < 15; x++) {
                for (let z = -15; z < 15; z++) {
                    const block = new THREE.Mesh(geometry, materialGrama);
                    block.position.set(x, 0, z);
                    
                    // Bordas dos blocos
                    const edges = new THREE.EdgesGeometry(geometry);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.1 }));
                    block.add(line);
                    
                    scene.add(block);
                }
            }

            // 4. CONTROLES E FÍSICA
            let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
            let velocity = new THREE.Vector3();
            let direction = new THREE.Vector3();
            let yaw = 0, pitch = 0;

            // Bloquear Mouse
            document.body.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('keydown', (e) => {
                if(e.code === 'KeyW') moveForward = true;
                if(e.code === 'KeyS') moveBackward = true;
                if(e.code === 'KeyA') moveLeft = true;
                if(e.code === 'KeyD') moveRight = true;
                if(e.code === 'Space' && canJump) { velocity.y += 5; canJump = false; }
            });

            document.addEventListener('keyup', (e) => {
                if(e.code === 'KeyW') moveForward = false;
                if(e.code === 'KeyS') moveBackward = false;
                if(e.code === 'KeyA') moveLeft = false;
                if(e.code === 'KeyD') moveRight = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    camera.rotation.set(pitch, yaw, 0, 'YXZ');
                }
            });

            // 5. LOOP DE RENDERIZAÇÃO
            let prevTime = performance.now();
            function animate() {
                requestAnimationFrame(animate);

                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                // Atrito e Gravidade
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 1.5 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0; camDir.normalize();
                const camSide = new THREE.Vector3().crossVectors(camera.up, camDir).normalize();

                if (moveForward || moveBackward) velocity.addScaledVector(camDir, 40 * delta * direction.z);
                if (moveLeft || moveRight) velocity.addScaledVector(camSide, 40 * delta * direction.x);

                camera.position.x += velocity.x * delta;
                camera.position.y += velocity.y * delta;
                camera.position.z += velocity.z * delta;

                // Chão
                if (camera.position.y < 2) {
                    velocity.y = 0;
                    camera.position.y = 2;
                    canJump = true;
                }

                renderer.render(scene, camera);
                prevTime = time;
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
