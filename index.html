<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Edição Visual Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: 'Courier New', Courier, monospace; }
        #tela-inicial {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.alphacoders.com/133/1331001.png');
            background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .btn { padding: 15px 40px; background: #5fa03d; color: white; border: 4px solid #1e3511; cursor: pointer; font-size: 20px; font-weight: bold; image-rendering: pixelated; }
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 24px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <h1 style="color: white; font-size: 60px; text-shadow: 4px 4px #000;">BLOCKS 3D</h1>
        <button class="btn" onclick="iniciar()">JOGAR MUNDO</button>
    </div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let hand;

        // --- GERADOR DE TEXTURAS MELHORADO ---
        function criarTexturaMinecraft(tipo) {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');

            if (tipo === 'grama_topo') {
                ctx.fillStyle = '#598a32'; // Verde base
                ctx.fillRect(0, 0, size, size);
                for(let i=0; i<60; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#6ba33f' : '#4a752a';
                    ctx.fillRect(Math.floor(Math.random()*size), Math.floor(Math.random()*size), 1, 1);
                }
            } 
            else if (tipo === 'terra') {
                ctx.fillStyle = '#79553a'; // Marrom base
                ctx.fillRect(0, 0, size, size);
                for(let i=0; i<50; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#8d654a' : '#5d3f2a';
                    ctx.fillRect(Math.floor(Math.random()*size), Math.floor(Math.random()*size), 1, 1);
                }
            }
            else if (tipo === 'folhas') {
                ctx.fillStyle = '#2d4c1e'; // Verde escuro
                ctx.fillRect(0, 0, size, size);
                for(let i=0; i<80; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#3b6327' : '#1e3314';
                    ctx.fillRect(Math.floor(Math.random()*size), Math.floor(Math.random()*size), 1, 1);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function iniciar() {
            document.getElementById('tela-inicial').style.display = 'none';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x72a0ff);
            scene.fog = new THREE.Fog(0x72a0ff, 15, 55);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(5, 10, 7.5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040, 1.5));

            // Aplicando as novas texturas
            const texGrama = criarTexturaMinecraft('grama_topo');
            const texTerra = criarTexturaMinecraft('terra');
            const texFolhas = criarTexturaMinecraft('folhas');

            const matGrama = [
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texGrama }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra })
            ];

            const geo = new THREE.BoxGeometry(1, 1, 1);
            // Chão vasto (60x60)
            for (let x = -30; x < 30; x++) {
                for (let z = -30; z < 30; z++) {
                    const bloco = new THREE.Mesh(geo, matGrama);
                    bloco.position.set(x, 0, z);
                    scene.add(bloco);
                    objects.push(bloco);

                    if(Math.random() > 0.98 && (Math.abs(x) > 4 || Math.abs(z) > 4)) {
                        criarArvore(x, 1, z, texTerra, texFolhas);
                    }
                }
            }

            // Mão estilo Steve
            const handGeo = new THREE.BoxGeometry(0.4, 0.4, 1.2);
            hand = new THREE.Mesh(handGeo, new THREE.MeshLambertMaterial({ map: texTerra }));
            scene.add(hand);

            setupControls();
        }

        function criarArvore(x, y, z, texM, texF) {
            const geo = new THREE.BoxGeometry(1,1,1);
            const matM = new THREE.MeshLambertMaterial({ map: texM });
            const matF = new THREE.MeshLambertMaterial({ map: texF });
            // Tronco
            for(let i=0; i<4; i++) {
                const t = new THREE.Mesh(geo, matM);
                t.position.set(x, y+i, z);
                scene.add(t);
                objects.push(t);
            }
            // Copa
            for(let fx=-2; fx<=2; fx++) {
                for(let fy=4; fy<=6; fy++) {
                    for(let fz=-2; fz<=2; fz++) {
                        if(Math.abs(fx) === 2 && Math.abs(fz) === 2) continue; // Arredondar cantos
                        const f = new THREE.Mesh(geo, matF);
                        f.position.set(x+fx, y+fy, z+fz);
                        scene.add(f);
                        objects.push(f);
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.18; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            document.addEventListener('mousedown', () => document.body.requestPointerLock());
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            velocity.x -= velocity.x * 0.1;
            velocity.z -= velocity.z * 0.1;
            velocity.y -= 0.008;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            const speed = 0.05; // Velocidade suave pedida
            if (moveF || moveB) velocity.z -= direction.z * speed;
            if (moveL || moveR) velocity.x -= direction.x * speed;

            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);
            camera.position.y += velocity.y;

            if (camera.position.y < 1.6) {
                velocity.y = 0; camera.position.y = 1.6; canJump = true;
            }

            if(hand) {
                hand.position.copy(camera.position);
                hand.rotation.copy(camera.rotation);
                hand.translateZ(-0.8); hand.translateX(0.6);
                let bob = (moveF || moveB || moveL || moveR) ? Math.sin(Date.now() * 0.008) * 0.04 : 0;
                hand.translateY(-0.5 + bob);
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
