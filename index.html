<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft JS - Física e Mão do Steve</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            font-family: 'Courier New', Courier, monospace; 
        }

        #menu {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://minecraft.net/static/theme/img/background/minecraft_bg.jpg');
            background-size: cover; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }

        .mc-button {
            width: 380px; padding: 18px; font-size: 22px; color: #FFF;
            background-color: #484848; border: 4px solid #000;
            box-shadow: inset -4px -4px #222, inset 4px 4px #888;
            cursor: pointer; text-align: center; font-weight: bold;
            text-shadow: 2px 2px #000;
        }

        .mc-button:hover { background-color: #618c32; border-color: #FFF; }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 24px; height: 24px; margin: -12px 0 0 -12px;
            display: none; pointer-events: none; z-index: 50;
            color: #FFF; font-size: 30px; text-align: center;
        }

        /* --- MÃO DO STEVE --- */
        #hand {
            position: absolute;
            bottom: -20px;
            right: 10%;
            width: 160px;
            height: 200px;
            background: #aa7d55; /* Cor da pele */
            border: 6px solid #8d6545;
            border-bottom: none;
            display: none;
            z-index: 60;
            transform: rotate(-5deg);
            box-shadow: inset -20px 0 rgba(0,0,0,0.1);
        }

        /* Animação de Soco */
        .punching {
            animation: soco 0.2s ease-out;
        }

        @keyframes soco {
            0% { transform: rotate(-5deg) translateY(0); }
            50% { transform: rotate(-20deg) translateY(-40px) translateX(-20px); }
            100% { transform: rotate(-5deg) translateY(0); }
        }
    </style>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="hand"></div>

    <div id="menu">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_logo.svg" style="width: 500px; margin-bottom: 50px;">
        <div class="mc-button" onclick="iniciarJogo()">INICIAR MUNDO</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let camera, scene, renderer, objects = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        function createPixelTexture(color1, color2) {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const context = canvas.getContext('2d');
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    context.fillStyle = Math.random() > 0.5 ? color1 : color2;
                    context.fillRect(x, y, 1, 1);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        function iniciarJogo() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hand').style.display = 'block';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 0); // Começa alto para cair

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 50, 10);
            scene.add(sun);

            const matGrama = new THREE.MeshLambertMaterial({ map: createPixelTexture('#55902e', '#4a7d28') });
            const matTerra = new THREE.MeshLambertMaterial({ map: createPixelTexture('#8B4513', '#5D2906') });
            const geometry = new THREE.BoxGeometry(1, 1, 1);

            // Gerar Terreno
            for (let x = -20; x < 20; x++) {
                for (let z = -20; z < 20; z++) {
                    let h = Math.floor(Math.sin(x * 0.2) * 2 + Math.cos(z * 0.2) * 2);
                    criarBloco(x, h, z, matGrama);
                    criarBloco(x, h - 1, z, matTerra);
                }
            }

            function criarBloco(x, y, z, mat) {
                const b = new THREE.Mesh(geometry, mat);
                b.position.set(x, y, z);
                scene.add(b);
                objects.push(b);
            }

            // --- ANIMAÇÃO DA MÃO AO CLICAR ---
            const hand = document.getElementById('hand');
            window.addEventListener('mousedown', () => {
                if (document.pointerLockElement === document.body) {
                    hand.classList.remove('punching');
                    void hand.offsetWidth; // Truque para reiniciar animação
                    hand.classList.add('punching');
                }
            });

            // Clique para quebrar
            window.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== document.body) return;
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(0,0), camera);
                const intersects = ray.intersectObjects(objects);
                if (intersects.length > 0 && e.button === 0) {
                    scene.remove(intersects[0].object);
                    objects.splice(objects.indexOf(intersects[0].object), 1);
                }
            });

            document.body.addEventListener('click', () => document.body.requestPointerLock());
            
            const onKey = (e, val) => {
                if(e.code === 'KeyW') moveForward = val;
                if(e.code === 'KeyS') moveBackward = val;
                if(e.code === 'KeyA') moveLeft = val;
                if(e.code === 'KeyD') moveRight = val;
                if(e.code === 'Space' && val && canJump) { velocity.y += 12; canJump = false; }
            };
            document.addEventListener('keydown', (e) => onKey(e, true));
            document.addEventListener('keyup', (e) => onKey(e, false));

            let yaw = 0, pitch = 0;
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    camera.rotation.set(pitch, yaw, 0, 'YXZ');
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                // --- FÍSICA E GRAVIDADE ---
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta; // Gravidade forte

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
                const camSide = new THREE.Vector3().crossVectors(camera.up, camDir).normalize();

                if (moveForward || moveBackward) velocity.addScaledVector(camDir, 60 * delta * direction.z);
                if (moveLeft || moveRight) velocity.addScaledVector(camSide, 60 * delta * direction.x);

                camera.position.addScaledVector(velocity, delta);

                // --- COLISÃO COM O TOPO DO BLOCO (PARAR DE VOAR) ---
                let playerFeetY = camera.position.y - 1.6; // 1.6 é a altura dos olhos
                let headRay = new THREE.Raycaster(camera.position, new THREE.Vector3(0, -1, 0), 0, 1.7);
                let footHits = headRay.intersectObjects(objects);

                if (footHits.length > 0) {
                    let groundY = footHits[0].object.position.y + 0.5 + 1.6;
                    if (camera.position.y <= groundY) {
                        velocity.y = Math.max(0, velocity.y);
                        camera.position.y = groundY;
                        canJump = true;
                    }
                }

                // Balanço da mão ao andar (View Bobbing)
                if (moveForward || moveBackward || moveLeft || moveRight) {
                    let bob = Math.sin(time * 0.01) * 5;
                    hand.style.transform = `rotate(-5deg) translateY(${bob}px)`;
                }

                renderer.render(scene, camera);
                prevTime = time;
            }
            animate();
        }
    </script>
</body>
</html>
