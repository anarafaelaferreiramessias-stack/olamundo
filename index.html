<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Ultimate Fix</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: 'Courier New', monospace; }
        
        /* Interface de Inventário */
        #ui-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px; border: 4px solid #333; z-index: 100; }
        .slot { width: 50px; height: 50px; border: 4px solid #555; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px; }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.2); }
        
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 24px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
        
        #menu { position: fixed; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        .btn { padding: 15px 40px; background: #5fa03d; color: white; border: 4px solid #000; cursor: pointer; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="color: white; font-size: 50px; margin-bottom: 20px;">BLOCKS 3D</h1>
        <button class="btn" onclick="start()">INICIAR MUNDO</button>
    </div>

    <div id="crosshair">+</div>

    <div id="ui-container">
        <div id="s1" class="slot active">GRAMA</div>
        <div id="s2" class="slot">TRONCO</div>
        <div id="s3" class="slot">FOLHA</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [], raycaster;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let selected = 1, hand;

        // Materiais
        let matGrama, matTerra, matMadeira, matFolha, matNuvem;

        function texGen(c1, c2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = c1; ctx.fillRect(0,0,16,16);
            for(let i=0; i<30; i++) { ctx.fillStyle = c2; ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1); }
            const t = new THREE.CanvasTexture(canvas);
            t.magFilter = THREE.NearestFilter;
            return t;
        }

        function start() {
            document.getElementById('menu').style.display = 'none';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            raycaster = new THREE.Raycaster();

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));

            // Texturas Reais
            const tG = texGen('#598a32', '#4a752a');
            const tT = texGen('#79553a', '#5d3f2a');
            const tM = texGen('#5d3f2a', '#3d291b');
            const tF = texGen('#2d4c1e', '#1e3314');

            matGrama = [new THREE.MeshLambertMaterial({map:tT}), new THREE.MeshLambertMaterial({map:tT}), new THREE.MeshLambertMaterial({map:tG}), new THREE.MeshLambertMaterial({map:tT}), new THREE.MeshLambertMaterial({map:tT}), new THREE.MeshLambertMaterial({map:tT})];
            matMadeira = new THREE.MeshLambertMaterial({map:tM});
            matFolha = new THREE.MeshLambertMaterial({map:tF});
            matNuvem = new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.8});

            const geo = new THREE.BoxGeometry(1,1,1);

            // Gerar Chão (50x50) - Chega de limbo!
            for(let x=-25; x<25; x++) {
                for(let z=-25; z<25; z++) {
                    const b = new THREE.Mesh(geo, matGrama);
                    b.position.set(x, 0, z);
                    scene.add(b);
                    objects.push(b);
                    if(Math.random() > 0.98 && (x > 3 || x < -3)) criarArvore(x, 1, z);
                }
            }

            // Nuvens
            for(let i=0; i<20; i++) {
                const n = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 8), matNuvem);
                n.position.set(Math.random()*100-50, 20, Math.random()*100-50);
                scene.add(n);
            }

            hand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.6), matMadeira);
            scene.add(hand);

            setupControls();
        }

        function criarArvore(x, y, z) {
            const geo = new THREE.BoxGeometry(1,1,1);
            for(let i=0; i<4; i++) {
                const t = new THREE.Mesh(geo, matMadeira);
                t.position.set(x, y+i, z);
                scene.add(t);
                objects.push(t);
            }
            // Folhas
            for(let fx=-1; fx<=1; fx++) {
                for(let fz=-1; fz<=1; fz++) {
                    const f = new THREE.Mesh(geo, matFolha);
                    f.position.set(x+fx, y+4, z+fz);
                    scene.add(f);
                    objects.push(f);
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.2; canJump = false; }
                if(e.key=='1') sel(1); if(e.key=='2') sel(2); if(e.key=='3') sel(3);
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            document.addEventListener('mousedown', e => {
                if(!document.pointerLockElement) { document.body.requestPointerLock(); return; }
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                const hits = raycaster.intersectObjects(objects);
                if(hits.length > 0 && hits[0].distance < 6) {
                    if(e.button === 0) { // Quebrar
                        scene.remove(hits[0].object);
                        objects = objects.filter(o => o !== hits[0].object);
                    } else { // Colocar
                        const p = hits[0].point.add(hits[0].face.normal.clone().multiplyScalar(0.5));
                        const m = selected==1?matGrama:(selected==2?matMadeira:matFolha);
                        const b = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), m);
                        b.position.set(Math.round(p.x), Math.round(p.y), Math.round(p.z));
                        scene.add(b); objects.push(b);
                    }
                }
            });
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
            window.oncontextmenu = () => false;
        }

        function sel(n) {
            selected = n;
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
            document.getElementById('s'+n).classList.add('active');
        }

        function animate() {
            requestAnimationFrame(animate);
            const op = camera.position.clone();
            velocity.x -= velocity.x * 0.1; velocity.z -= velocity.z * 0.1; velocity.y -= 0.01;
            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();
            if(moveF || moveB) velocity.z -= direction.z * 0.08;
            if(moveL || moveR) velocity.x -= direction.x * 0.08;
            camera.translateX(-velocity.x); camera.translateZ(velocity.z);

            // COLISÃO REAL
            for(let o of objects) {
                if(camera.position.distanceTo(o.position) < 0.8 && Math.abs(camera.position.y - o.position.y) < 1.2) {
                    camera.position.x = op.x; camera.position.z = op.z;
                }
            }
            camera.position.y += velocity.y;
            if(camera.position.y < 1.6) { velocity.y = 0; camera.position.y = 1.6; canJump = true; }

            if(hand) {
                hand.position.copy(camera.position); hand.rotation.copy(camera.rotation);
                hand.translateZ(-0.6); hand.translateX(0.5); hand.translateY(-0.4);
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
