<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>JS Minecraft Clone</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        /* Menu de Entrada */
        #menu {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('https://minecraft.net/static/theme/img/background/minecraft_bg.jpg');
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #logo { width: 600px; margin-bottom: 50px; image-rendering: pixelated; }

        button {
            padding: 15px 50px;
            font-size: 24px;
            background-color: #484848;
            color: white;
            border: 3px solid #000;
            cursor: pointer;
            box-shadow: inset -4px -4px 0px #222;
        }

        button:hover { background-color: #618c32; }
        
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="menu">
        <img id="logo" src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_logo.svg" alt="Minecraft Logo">
        <button onclick="startGame()">JOGAR</button>
    </div>

    <!-- Onde o jogo vai rodar -->
    <div id="game-container"></div>

    <!-- Bibliotecas Necessárias -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // O código JavaScript (Motor do Jogo) virá aqui
    </script>
</body>
</html>
