<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Terra - Vista Realista do Espaço</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at center, #0b001f 0%, #000 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .space {
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: none;
    }

    .stars {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(white 1px, transparent 1px) 0 0 / 100px 100px,
        radial-gradient(white 0.8px, transparent 0.8px) 50px 50px / 80px 80px,
        radial-gradient(white 0.6px, transparent 0.6px) 20px 20px / 60px 60px;
      opacity: 0.75;
      animation: starsDrift 600s linear infinite;
    }

    @keyframes starsDrift {
      to { transform: translateZ(-5000px); }
    }

    .planet-container {
      position: relative;
      width: 520px;
      height: 520px;
      perspective: 2200px;
    }

    .planet {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: 
        /* Oceanos profundos */
        radial-gradient(circle at 30% 40%, #0a3d62 0%, #001f3f 40%, #000d1a 70%, #000 100%),
        /* Continentes sutis */
        radial-gradient(circle at 70% 60%, #3a5f2d 20%, #2e4a1f 40%, transparent 60%);
      box-shadow: 
        inset 0 0 120px rgba(0,0,0,0.7),
        inset 80px -60px 180px rgba(255,255,255,0.12),
        inset -100px 80px 220px rgba(0,80,180,0.25);
      transform-style: preserve-3d;
      animation: rotateEarth 120s linear infinite;
    }

    /* Nuvens em movimento (leve deriva) */
    .clouds {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: 
        radial-gradient(circle at 45% 55%, rgba(255,255,255,0.45) 0%, transparent 40%),
        radial-gradient(circle at 65% 35%, rgba(255,255,255,0.38) 0%, transparent 50%),
        radial-gradient(circle at 20% 70%, rgba(255,255,255,0.32) 0%, transparent 45%);
      filter: blur(40px);
      opacity: 0.85;
      animation: cloudsDrift 180s linear infinite;
    }

    @keyframes cloudsDrift {
      to { transform: rotate(360deg); }
    }

    /* Atmosfera realista (azul brilhante + glow) */
    .atmosphere {
      position: absolute;
      inset: -60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(100,180,255,0.45) 15%, rgba(50,120,255,0.25) 40%, transparent 70%);
      filter: blur(90px);
      animation: atmospherePulse 20s ease-in-out infinite alternate;
    }

    @keyframes atmospherePulse {
      0%   { opacity: 0.65; transform: scale(1.02); }
      100% { opacity: 0.95; transform: scale(1.12); }
    }

    /* Luz solar com efeito dia/noite */
    .sunlight {
      position: absolute;
      top: -300px;
      left: 50%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle at 50% 40%, rgba(255,240,180,0.55) 0%, transparent 60%);
      transform: translateX(-50%);
      pointer-events: none;
      filter: blur(180px);
      animation: sunlightMove 200s ease-in-out infinite alternate;
    }

    @keyframes sunlightMove {
      0%   { left: 30%; opacity: 0.8; }
      100% { left: 70%; opacity: 1; }
    }

    @keyframes rotateEarth {
      from { transform: rotateY(0deg) rotateX(10deg); }
      to   { transform: rotateY(360deg) rotateX(10deg); }
    }

    /* Texto delicado (opcional – pode remover) */
    .caption {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 1.8rem;
      text-shadow: 0 0 25px rgba(100,180,255,0.9);
      pointer-events: none;
      z-index: 10;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="space">
    <div class="stars"></div>
  </div>

  <div class="planet-container">
    <div class="planet">
      <div class="clouds"></div>
      <div class="atmosphere"></div>
    </div>
    <div class="sunlight"></div>
  </div>

  <!-- Legenda romântica ou poética (pode mudar ou remover) -->
  <div class="caption">Nosso lar... girando em silêncio no infinito ♡</div>

  <script>
    // Controle suave com mouse (opcional – vira a câmera)
    document.addEventListener('mousemove', e => {
      const x = (e.clientX / window.innerWidth - 0.5) * 50;
      const y = (e.clientY / window.innerHeight - 0.5) * 35;
      document.querySelector('.planet-container').style.transform = 
        `rotateY(${x}deg) rotateX(${y}deg)`;
    });
  </script>

</body>
</html>
