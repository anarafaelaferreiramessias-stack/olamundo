<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Realistic Nature</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #87ceeb; }
        #menu {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%), url('https://i.imgur.com/u7q13eH.jpg') center/cover;
            transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn { padding: 18px 80px; background: #222; border: 2px solid #8dc63f; color: #8dc63f; cursor: pointer; font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; transition: 0.3s; }
        .btn:hover { background: #8dc63f; color: #fff; box-shadow: 0 0 20px #8dc63f; }

        #hotbar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 6px; padding: 6px; background: rgba(0,0,0,0.7); border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }
        .slot { width: 48px; height: 48px; background: rgba(255,255,255,0.05); border: 2px solid #444; display: flex; align-items: center; justify-content: center; position: relative; }
        .slot.selected { border-color: #fff; background: rgba(255,255,255,0.2); transform: scale(1.1); }
        .count { position: absolute; bottom: 2px; right: 4px; color: #fff; font-size: 14px; font-weight: bold; text-shadow: 2px 2px #000; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="color: white; font-size: 3rem; margin-bottom: 40px; text-shadow: 0 5px 15px rgba(0,0,0,0.5);">NATURE UPDATE</h1>
        <button class="btn" onclick="start()">ENTRAR NO MUNDO</button>
    </div>

    <div id="hotbar">
        <div class="slot selected" id="s0"><div id="inv-wood" class="count">0</div></div>
        <div class="slot" id="s1"></div><div class="slot" id="s2"></div><div class="slot" id="s3"></div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand, handItem, clouds = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let mouse = new THREE.Vector2(), targetRotation = new THREE.Euler(0, 0, 0, "YXZ");
        let prevTime = performance.now();
        let blocks = [], drops = [], grassBlades = []; 
        let inventoryWood = 0, selectedSlot = 0;

        const loader = new THREE.TextureLoader();
        const woodTex = loader.load('https://threejs.org/examples/textures/crate.gif');

        function start() {
            document.getElementById('menu').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('menu').style.display = 'none';
                document.getElementById('hotbar').style.display = 'flex';
                document.getElementById('crosshair').style.display = 'block';
                init();
            }, 800);
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // CHÃO E GRAMA
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshLambertMaterial({color: 0x3d611c}));
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            for(let i=0; i<300; i++) spawnGrass(Math.random()*100-50, Math.random()*100-50);

            // NUVENS
            for(let i=0; i<15; i++) spawnCloud();

            // ÁRVORES
            for(let i=0; i<30; i++) spawnTree(Math.random()*120-60, Math.random()*120-60);

            // BRAÇO
            hand = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.7), new THREE.MeshLambertMaterial({color: 0xdbac82}));
            scene.add(hand);
            handItem = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), new THREE.MeshLambertMaterial({map: woodTex}));
            handItem.visible = false;
            scene.add(handItem);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            raycaster = new THREE.Raycaster();

            // CONTROLES
            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
                else if (e.button === 0) breakBlock(); else if (e.button === 2) placeBlock();
            });
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    targetRotation.y -= e.movementX * 0.0012;
                    targetRotation.x -= e.movementY * 0.0012;
                    targetRotation.x = Math.max(-Math.PI/2, Math.PI/2, targetRotation.x);
                }
            });
            document.addEventListener('keydown', (e) => {
                if(e.code==='KeyW') moveF=true; if(e.code==='KeyS') moveB=true;
                if(e.code==='KeyA') moveL=true; if(c==='KeyD') moveR=true;
                if(e.code==='Space' && canJump) { velocity.y += 4.5; canJump = false; }
                if (e.key >= 1 && e.key <= 4) updateSlot(parseInt(e.key) - 1);
            });
            document.addEventListener('keyup', (e) => {
                if(e.code==='KeyW') moveF=false; if(e.code==='KeyS') moveB=false;
                if(e.code==='KeyA') moveL=false; if(e.code==='KeyD') moveR=false;
            });

            animate();
        }

        function spawnGrass(x, z) {
            const g = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshLambertMaterial({color: 0x4d8a2a, side: THREE.DoubleSide, transparent: true, alphaTest: 0.5}));
            g.position.set(x, 0.25, z);
            g.rotation.y = Math.random() * Math.PI;
            scene.add(g);
            grassBlades.push(g);
        }

        function spawnCloud() {
            const cloud = new THREE.Mesh(new THREE.BoxGeometry(10+Math.random()*10, 2, 5+Math.random()*5), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.8}));
            cloud.position.set(Math.random()*200-100, 25+Math.random()*10, Math.random()*200-100);
            scene.add(cloud);
            clouds.push(cloud);
        }

        function spawnTree(x, z) {
            for(let h=0; h<4; h++) {
                const log = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                log.position.set(x, h + 0.5, z);
                scene.add(log);
                blocks.push(log);
            }
            // Folhas mais realistas (vários blocos menores)
            for(let i=0; i<15; i++) {
                const leaf = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshLambertMaterial({color: 0x2d4c1e, transparent: true, opacity: 0.9}));
                leaf.position.set(x + (Math.random()-0.5)*3, 4 + Math.random()*2.5, z + (Math.random()-0.5)*3);
                scene.add(leaf);
                blocks.push(leaf);
            }
        }

        function updateSlot(idx) {
            document.getElementById('s'+selectedSlot).classList.remove('selected');
            selectedSlot = idx;
            document.getElementById('s'+selectedSlot).classList.add('selected');
            handItem.visible = (selectedSlot === 0 && inventoryWood > 0);
        }

        function breakBlock() {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(blocks);
            if (hits.length > 0 && hits[0].distance < 4) {
                const target = hits[0].object;
                const d = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3), target.material);
                d.position.copy(target.position);
                scene.add(d); drops.push(d);
                scene.remove(target);
                blocks = blocks.filter(b => b !== target);
            }
        }

        function placeBlock() {
            if (selectedSlot !== 0 || inventoryWood <= 0) return;
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects([scene.children[0], ...blocks]);
            if (hits.length > 0) {
                const p = hits[0].object === scene.children[0] ? hits[0].point.add(new THREE.Vector3(0,0.5,0)) : hits[0].point.add(hits[0].face.normal.multiplyScalar(0.5));
                const b = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({map: woodTex}));
                b.position.set(Math.round(p.x), Math.round(p.y), Math.round(p.z));
                scene.add(b); blocks.push(b);
                inventoryWood--; document.getElementById('inv-wood').innerText = inventoryWood;
                handItem.visible = inventoryWood > 0;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // Camera Suave (Lerp)
            camera.rotation.x += (targetRotation.x - camera.rotation.x) * 0.15;
            camera.rotation.y += (targetRotation.y - camera.rotation.y) * 0.15;

            velocity.x -= velocity.x * 8.0 * delta;
            velocity.z -= velocity.z * 8.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 50.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 50.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;
            if (camera.position.y < 1.7) { velocity.y = 0; camera.position.y = 1.7; canJump = true; }

            // Nuvens se movendo
            clouds.forEach(c => { c.position.x += 0.01; if(c.position.x > 100) c.position.x = -100; });

            // Balanço da Grama
            grassBlades.forEach((g, i) => { g.rotation.z = Math.sin(time*0.002 + i) * 0.1; });

            // Coleta
            drops.forEach((d, i) => {
                d.rotation.y += 0.05;
                if (camera.position.distanceTo(d.position) < 1.5) {
                    inventoryWood++; document.getElementById('inv-wood').innerText = inventoryWood;
                    if(selectedSlot===0) handItem.visible = true;
                    scene.remove(d); drops.splice(i, 1);
                }
            });

            // Braço e Head Bobbing
            const bob = Math.sin(time * 0.006) * ( (moveF||moveB) ? 0.04 : 0.01);
