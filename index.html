<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 2026 - Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Reset básico e fontes */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; font-family: 'Montserrat', sans-serif; }

        /* Fundo Panorâmico com Shaders */
        .panorama {
            position: fixed;
            width: 100%;
            height: 100%;
            /* Substitua por uma URL de imagem de Minecraft com shaders realistas */
            background: url('https://i.imgur.com/your-realistic-minecraft-shader-image.jpg') no-repeat center center / cover; /* Substitua esta URL */
            /* Exemplo de uma imagem de fundo com shaders (você pode substituir por outra melhor): */
            /* background: url('https://wallpapercave.com/wp/wp6884878.jpg') no-repeat center center / cover; */
            filter: brightness(0.7); /* Suaviza a imagem para a UI se destacar */
            animation: fadeInBackground 2s ease-out forwards;
        }

        @keyframes fadeInBackground {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Overlay principal */
        .menu-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: rgba(0, 0, 0, 0.2); /* Um leve escurecimento para contraste */
        }

        /* Logo modernizado */
        .logo-wrapper {
            margin-bottom: 60px;
            position: relative;
            animation: bounceIn 1s ease-out;
        }

        .logo {
            width: 600px;
            max-width: 90vw;
            filter: drop-shadow(0px 8px 15px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .splash-text {
            position: absolute;
            right: -30px;
            bottom: -20px;
            color: #FFECB3; /* Amarelo mais suave */
            font-weight: 700;
            font-size: 24px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            transform: rotate(-15deg);
            animation: splashPulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes splashPulse {
            from { transform: rotate(-15deg) scale(1); opacity: 0.8; }
            to { transform: rotate(-15deg) scale(1.05); opacity: 1; }
        }

        /* Botões Estilo 2026 */
        .button-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 450px;
            max-width: 80vw;
        }

        .mc-button {
            background: linear-gradient(145deg, #3a3a3a, #5a5a5a);
            border: none;
            border-radius: 8px; /* Bordas arredondadas */
            color: #E0E0E0;
            padding: 15px 20px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .mc-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: all 0.5s ease;
        }

        .mc-button:hover {
            background: linear-gradient(145deg, #6aa32a, #8dc63f); /* Verde mais vibrante */
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            transform: translateY(-2px);
            color: white;
        }

        .mc-button:hover::before {
            left: 100%;
        }

        .small-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Rodapé com ano 2026 */
        .footer-info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            color: #F0F0F0;
            font-size: 16px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            animation: fadeInUp 1s ease-out forwards;
            animation-delay: 0.5s;
        }

        /* Animações de entrada */
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="panorama"></div>

    <div class="menu-container">
        <div class="logo-wrapper">
            <img class="logo" src="https://minecraft.wiki/images/Minecraft_Logo.png" alt="Minecraft Logo">
            <div class="splash-text">Enhanced Edition!</div>
        </div>

        <div class="button-list">
            <button class="mc-button">New Game</button>
            <button class="mc-button">Load World</button>
            <button class="mc-button" style="color: #BBBBBB;">Realms & Multiplayer</button>
            
            <div class="small-buttons">
                <button class="mc-button">Settings</button>
                <button class="mc-button">Exit</button>
            </div>
        </div>
    </div>

    <div class="footer-info">
        <span>Minecraft 2026</span>
        <span>Redefined Experience.</span>
    </div>

</body>
</html>
