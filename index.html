<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Pokémon Customizada</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff1c1c 50%, #f0f0f0 50%);
            font-family: 'Arial', sans-serif;
            cursor: pointer;
        }

        .pokeball {
            position: relative;
            width: 200px;
            height: 200px;
            background: #fff;
            border: 10px solid #333;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: inset -10px 10px 0 10px rgba(0,0,0,0.1), 0 0 20px rgba(0,0,0,0.2);
            animation: shake 1.25s cubic-bezier(.36,.07,.19,.97) infinite;
        }

        .pokeball::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            background: #ff1c1c;
            width: 100%;
            height: 50%;
            border-bottom: 10px solid #333;
        }

        .pokeball::after {
            content: "";
            position: absolute;
            top: calc(50% - 30px);
            left: calc(50% - 30px);
            width: 40px;
            height: 40px;
            background: #fff;
            border: 10px solid #333;
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 0 5px #fff;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0); }
            20% { transform: translate(-10px, 0) rotate(-20deg); }
            30% { transform: translate(10px, 0) rotate(20deg); }
            50% { transform: translate(-10px, 0) rotate(-10deg); }
            60% { transform: translate(10px, 0) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0); }
        }

        .pokedex-card {
            position: absolute;
            bottom: 50px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            border-bottom: 5px solid #333;
            text-align: center;
            min-width: 250px;
            pointer-events: none;
        }

        h1 {
            color: #333;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .type-tag {
            display: inline-block;
            background: #4dad5b;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="pokeball"></div>

    <div class="pokedex-card">
        <h1>Gotta Catch 'Em All!</h1>
        <div class="type-tag">Treinador Pokémon</div>
    </div>

    <!-- Áudio do Pokémon Center (toca automaticamente ao carregar) -->
    <audio id="pokemonSound" preload="auto" autoplay loop volume="0.25">
        <source src="https://downloads.khinsider.com/game-soundtracks/album/pokemon-diamond-and-pearl-super-music-collection/1-16.%20Pok%C3%A9mon%20Center%20%28Day%29.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        // Tenta tocar o som (alguns navegadores bloqueiam autoplay sem interação)
        const audio = document.getElementById('pokemonSound');
        
        // Tenta tocar imediatamente
        audio.play().catch(() => {
            console.log("Autoplay bloqueado — aguardando interação");
            // Se falhar, toca no primeiro clique
            document.body.addEventListener('click', function playOnClick() {
                audio.play();
                document.body.removeEventListener('click', playOnClick);
            }, { once: true });
        });

        // Redireciona ao clicar em qualquer lugar (mantém o comportamento original)
        document.body.addEventListener('click', function() {
            window.location.href = "https://www.pokemon.com/br";
        });
    </script>

</body>
</html>
