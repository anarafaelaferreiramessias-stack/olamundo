<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Blocks 3D - Edição Visual Fix</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #tela-inicial {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #555, #111); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 100; color: white;
        }
        .btn { padding: 15px 40px; background: #5fa03d; color: white; border: 4px solid #000; cursor: pointer; font-size: 20px; font-weight: bold; }
        #crosshair { position: fixed; top: 50%; left: 50%; color: white; font-size: 24px; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; mix-blend-mode: difference; }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <h1 style="text-shadow: 4px 4px #000; font-size: 60px;">BLOCKS 3D</h1>
        <button class="btn" onclick="iniciar()">JOGAR MUNDO</button>
        <p>W, A, S, D para andar | Espaço para pular | Mouse para olhar</p>
    </div>
    <div id="crosshair">+</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, objects = [];
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let hand;

        // --- FUNÇÃO QUE CRIA TEXTURAS SEM USAR IMAGENS EXTERNAS ---
        function criarTexturaPixel(corBase, corDetalhe) {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = corBase;
            ctx.fillRect(0, 0, size, size);
            for (let i = 0; i < 60; i++) {
                ctx.fillStyle = corDetalhe;
                ctx.fillRect(Math.floor(Math.random()*size), Math.floor(Math.random()*size), 1, 1);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        function iniciar() {
            document.getElementById('tela-inicial').style.display = 'none';
            init();
            animate();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Cor do céu
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Neblina

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            // Definindo as cores das texturas geradas por código
            const texGrama = criarTexturaPixel('#55aa44', '#3d7a31');
            const texTerra = criarTexturaPixel('#8b4513', '#5d2e0d');
            const texFolha = criarTexturaPixel('#2d8a2d', '#1e5a1e');

            const matGrama = [
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texGrama }), // Topo
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra }),
                new THREE.MeshLambertMaterial({ map: texTerra })
            ];

            // Gerar chão grande (50x50 blocos)
            const geo = new THREE.BoxGeometry(1, 1, 1);
            for (let x = -25; x < 25; x++) {
                for (let z = -25; z < 25; z++) {
                    const bloco = new THREE.Mesh(geo, matGrama);
                    bloco.position.set(x, 0, z);
                    scene.add(bloco);
                    objects.push(bloco); // Adiciona na lista de colisão

                    // Chance de nascer árvore
                    if(Math.random() > 0.98 && (x > 3 || x < -3)) criarArvore(x, 1, z, texTerra, texFolha);
                }
            }

            // MÃO DO JOGADOR
            const handGeo = new THREE.BoxGeometry(0.4, 0.4, 1.2);
            hand = new THREE.Mesh(handGeo, new THREE.MeshLambertMaterial({ map: texTerra }));
            scene.add(hand);

            setupControls();
        }

        function criarArvore(x, y, z, texM, texF) {
            const geo = new THREE.BoxGeometry(1,1,1);
            const matM = new THREE.MeshLambertMaterial({ map: texM });
            const matF = new THREE.MeshLambertMaterial({ map: texF });
            // Tronco
            for(let i=0; i<4; i++) {
                const t = new THREE.Mesh(geo, matM);
                t.position.set(x, y+i, z);
                scene.add(t);
                objects.push(t);
            }
            // Copa de folhas
            for(let fx=-2; fx<=2; fx++) {
                for(let fy=4; fy<=6; fy++) {
                    for(let fz=-2; fz<=2; fz++) {
                        if(Math.abs(fx) + Math.abs(fz) > 3) continue;
                        const f = new THREE.Mesh(geo, matF);
                        f.position.set(x+fx, y+fy, z+fz);
                        scene.add(f);
                        objects.push(f);
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('keydown', e => {
                if(e.code=='KeyW') moveF=true; if(e.code=='KeyS') moveB=true;
                if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true;
                if(e.code=='Space' && canJump) { velocity.y += 0.2; canJump = false; }
            });
            document.addEventListener('keyup', e => {
                if(e.code=='KeyW') moveF=false; if(e.code=='KeyS') moveB=false;
                if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false;
            });
            // Trava o mouse ao clicar na tela
            document.addEventListener('mousedown', () => document.body.requestPointerLock());
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Física básica e Movimento
            velocity.x -= velocity.x * 10.0 * 0.01;
            velocity.z -= velocity.z * 10.0 * 0.01;
            velocity.y -= 0.01; // Gravidade

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 0.15;
            if (moveL || moveR) velocity.x -= direction.x * 0.15;

            camera.translateX(-velocity.x);
            camera.translateZ(velocity.z);
            camera.position.y += velocity.y;

            // Colisão com o chão
            if (camera.position.y < 1.6) {
                velocity.y = 0;
                camera.position.y = 1.6;
                canJump = true;
            }

            // Posicionar a mão
            if(hand) {
                hand.position.copy(camera.position);
                hand.rotation.copy(camera.rotation);
                hand.translateZ(-1.0);
                hand.translateX(0.6);
                hand.translateY(-0.5 + Math.sin(Date.now() * 0.005) * 0.02); // Balanço leve
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
