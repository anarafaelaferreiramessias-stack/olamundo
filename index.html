<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Ultra JS - Texturas & Pixels</title>
    <style>
        /* CSS - ESTILIZAÇÃO E INTERFACE */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            font-family: 'Courier New', Courier, monospace; 
        }

        #menu {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://minecraft.net/static/theme/img/background/minecraft_bg.jpg');
            background-size: cover; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }

        .mc-button {
            width: 380px; padding: 18px; font-size: 22px; color: #FFF;
            background-color: #484848; border: 4px solid #000;
            box-shadow: inset -4px -4px #222, inset 4px 4px #888;
            cursor: pointer; text-align: center; font-weight: bold;
            text-shadow: 2px 2px #000; transition: transform 0.1s;
        }

        .mc-button:active { transform: scale(0.95); }
        .mc-button:hover { background-color: #618c32; border-color: #FFF; }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 24px; height: 24px; margin: -12px 0 0 -12px;
            display: none; pointer-events: none; z-index: 50;
            color: rgba(255,255,255,0.8); font-size: 30px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="crosshair">+</div>

    <div id="menu">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_logo.svg" style="width: 550px; margin-bottom: 50px;">
        <div class="mc-button" onclick="iniciarJogo()">INICIAR MUNDO</div>
    </div>

    <!-- BIBLIOTECA THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let camera, scene, renderer, objects = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        // --- GERADOR DE TEXTURA PIXELADA ---
        function createPixelTexture(color1, color2) {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    context.fillStyle = Math.random() > 0.5 ? color1 : color2;
                    context.fillRect(x, y, 1, 1);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter; // Mantém os pixels nítidos
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        function iniciarJogo() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 8;

            renderer = new THREE.WebGLRenderer({ antialias: false }); // Desativa antialias para ser mais pixelado
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const sun = new THREE.DirectionalLight(0xffffff, 0.9);
            sun.position.set(20, 50, 10);
            scene.add(sun);

            // Materiais Pixelados
            const texGrama = createPixelTexture('#55902e', '#4a7d28');
            const texTerra = createPixelTexture('#8B4513', '#5D2906');
            const texTronco = createPixelTexture('#614126', '#3d2818');
            const texFolha = createPixelTexture('#2d5a27', '#1e3d1a');
            const texPedra = createPixelTexture('#808080', '#696969');

            const matGrama = new THREE.MeshLambertMaterial({ map: texGrama });
            const matTerra = new THREE.MeshLambertMaterial({ map: texTerra });
            const matTronco = new THREE.MeshLambertMaterial({ map: texTronco });
            const matFolha = new THREE.MeshLambertMaterial({ map: texFolha });
            const matPedra = new THREE.MeshLambertMaterial({ map: texPedra });

            const geometry = new THREE.BoxGeometry(1, 1, 1);

            // Gerar Terreno com Camadas
            for (let x = -20; x < 20; x++) {
                for (let z = -20; z < 20; z++) {
                    let h = Math.floor(Math.sin(x * 0.2) * 2 + Math.cos(z * 0.2) * 2);
                    
                    // Camada de Grama/Superfície
                    criarBloco(x, h, z, matGrama);
                    
                    // Camada de Terra abaixo
                    criarBloco(x, h - 1, z, matTerra);
                    
                    // Pedras profundas
                    if (Math.random() > 0.95) criarBloco(x, h + 1, z, matPedra);

                    // Gerar Árvores
                    if (Math.random() > 0.985 && h >= 0) {
                        for(let t=1; t<=4; t++) criarBloco(x, h+t, z, matTronco); // Tronco mais alto
                        for(let fx=-2; fx<=2; fx++) {
                            for(let fz=-2; fz<=2; fz++) {
                                for(let fy=4; fy<=6; fy++) {
                                    if(Math.abs(fx) + Math.abs(fz) < 3) criarBloco(x+fx, h+fy, z+fz, matFolha);
                                }
                            }
                        }
                    }
                }
            }

            function criarBloco(x, y, z, mat) {
                const b = new THREE.Mesh(geometry, mat);
                b.position.set(x, y, z);
                scene.add(b);
                objects.push(b);
            }

            // Interação
            window.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement !== document.body) return;
                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(0,0), camera);
                const intersects = ray.intersectObjects(objects);

                if (intersects.length > 0) {
                    const intersected = intersects[0];
                    if (e.button === 0) { // Quebrar
                        scene.remove(intersected.object);
                        objects.splice(objects.indexOf(intersected.object), 1);
                    } else if (e.button === 2) { // Colocar Pedra
                        const pos = intersected.object.position.clone().add(intersected.face.normal);
                        criarBloco(pos.x, pos.y, pos.z, matPedra);
                    }
                }
            });

            // Controles e Movimento
            document.body.addEventListener('click', () => document.body.requestPointerLock());
            window.addEventListener('contextmenu', e => e.preventDefault());
            
            const onKey = (e, val) => {
                if(e.code === 'KeyW') moveForward = val;
                if(e.code === 'KeyS') moveBackward = val;
                if(e.code === 'KeyA') moveLeft = val;
                if(e.code === 'KeyD') moveRight = val;
                if(e.code === 'Space' && val && canJump) { velocity.y += 5.5; canJump = false; }
            };
            document.addEventListener('keydown', (e) => onKey(e, true));
            document.addEventListener('keyup', (e) => onKey(e, false));

            let yaw = 0, pitch = 0;
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                    camera.rotation.set(pitch, yaw, 0, 'YXZ');
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 1.8 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
                const camSide = new THREE.Vector3().crossVectors(camera.up, camDir).normalize();

                if (moveForward || moveBackward) velocity.addScaledVector(camDir, 55 * delta * direction.z);
                if (moveLeft || moveRight) velocity.addScaledVector(camSide, 55 * delta * direction.x);

                camera.position.addScaledVector(velocity, delta);

                if (camera.position.y < 4) { velocity.y = 0; camera.position.y = 4; canJump = true; }

                renderer.render(scene, camera);
                prevTime = time;
            }
            animate();
        }
    </script>
</body>
</html>
