<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Survival & Craft</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* HUD de Inventário e Craft */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }

        #craft-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(40, 40, 40, 0.9);
            padding: 30px;
            border: 3px solid #8dc63f;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .craft-item {
            background: #555;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .craft-item:hover { background: #777; }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="hud">
        Madeira: <span id="wood-count">0</span><br>
        Tábuas: <span id="plank-count">0</span><br>
        <small>Pressione 'E' para Craftar</small>
    </div>

    <div id="crosshair"></div>

    <div id="craft-menu">
        <h2 style="color: white; margin-top: 0;">Crafting 2026</h2>
        <button class="craft-item" onclick="craftPlanks()">Criar Tábuas (1 Madeira -> 4 Tábuas)</button>
        <button class="craft-item" onclick="closeMenu()">Fechar (E)</button>
    </div>

    <script>
        let scene, camera, renderer, raycaster;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();
        let objects = []; // Lista de objetos que podem ser quebrados

        // Recursos do Jogador
        let inventory = { wood: 0, planks: 0 };

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xaaccff);
            scene.fog = new THREE.Fog(0xaaccff, 0, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2;

            // Luzes realistas
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // Chão
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshPhongMaterial({ color: 0x3d611c });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            // Gerar Árvores
            for(let i = 0; i < 20; i++) {
                createTree(Math.random()*80-40, Math.random()*80-40);
            }

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            // Eventos
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createTree(x, z) {
            const trunkGeo = new THREE.BoxGeometry(0.8, 4, 0.8);
            const trunkMat = new THREE.MeshPhongMaterial({ color: 0x4b3621 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 2, z);
            trunk.userData = { type: 'wood' }; // Identificador para coleta
            scene.add(trunk);
            objects.push(trunk);

            const leafGeo = new THREE.BoxGeometry(3, 3, 3);
            const leafMat = new THREE.MeshPhongMaterial({ color: 0x2d4c1e });
            const leaves = new THREE.Mesh(leafGeo, leafMat);
            leaves.position.set(x, 4.5, z);
            scene.add(leaves);
        }

        function onMouseDown(e) {
            if (document.pointerLockElement !== renderer.domElement) {
                renderer.domElement.requestPointerLock();
                return;
            }

            // Raycasting para quebrar blocos
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (obj.userData.type === 'wood') {
                    inventory.wood++;
                    updateHUD();
                    scene.remove(obj);
                    objects = objects.filter(o => o !== obj);
                }
            }
        }

        function craftPlanks() {
            if (inventory.wood > 0) {
                inventory.wood--;
                inventory.planks += 4;
                updateHUD();
            } else {
                alert("Você precisa de madeira!");
            }
        }

        function updateHUD() {
            document.getElementById('wood-count').innerText = inventory.wood;
            document.getElementById('plank-count').innerText = inventory.planks;
        }

        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 5; canJump = false; break;
                case 'KeyE': toggleMenu(); break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('craft-menu');
            if (menu.style.display === 'flex') {
                menu.style.display = 'none';
                renderer.domElement.requestPointerLock();
            } else {
                menu.style.display = 'flex';
                document.exitPointerLock();
            }
        }

        function closeMenu() { toggleMenu(); }

        function onMouseMove(e) {
            if (document.pointerLockElement === renderer.domElement) {
                camera.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 150.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 150.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 2) {
                velocity.y = 0;
                camera.position.y = 2;
                canJump = true;
            }

            camera.rotation.order = "YXZ";
            prevTime = time;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
