<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Infinite World</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; background: #87CEEB; }
        #menu { position: absolute; width: 100%; height: 100%; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); color: white; }
        .btn { padding: 15px 60px; background: #555; border: 3px solid #000; color: #fff; font-size: 20px; cursor: pointer; box-shadow: inset -4px -4px 0 #222; }
        .btn:hover { background: #55a832; }
        #hotbar { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: none; gap: 4px; padding: 4px; background: rgba(0,0,0,0.5); border: 2px solid #888; }
        .slot { width: 44px; height: 44px; border: 2px solid #444; background: rgba(255,255,255,0.1); }
        .slot.selected { border: 2px solid #fff; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); display: none; pointer-events: none; mix-blend-mode: difference; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
    </style>
</head>
<body>

    <div id="menu">
        <h1 style="text-shadow: 4px 4px #000; font-size: 4rem;">MINECRAFT INFINITE</h1>
        <button class="btn" onclick="start()">NEW GAME</button>
    </div>

    <div id="hotbar">
        <div class="slot selected"></div><div class="slot"></div><div class="slot"></div>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand;
        let moveF = false, moveB = false, moveL = false, moveR = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();
        let chunks = {}, blocks = [];
        const CHUNK_SIZE = 16;
        const RENDER_DISTANCE = 1;

        // Gerador de Texturas Pixel-Perfect
        function getMCTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            for(let x=0; x<16; x++) {
                for(let y=0; y<16; y++) {
                    let r, g, b;
                    let n = Math.random() * 15;
                    if(type === 'top') { r=72+n; g=126+n; b=37+n; }
                    else if(type === 'side') { 
                        if(y < 4) { r=72+n; g=126+n; b=37+n; }
                        else { r=93+n; g=64+n; b=55+n; }
                    }
                    else if(type === 'wood') { r=100+n; g=70+n; b=40+n; }
                    else if(type === 'leaf') { r=45+n; g=71+n; b=30+n; }
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        const materials = {
            grass: [
                new THREE.MeshLambertMaterial({map: getMCTexture('side')}), // right
                new THREE.MeshLambertMaterial({map: getMCTexture('side')}), // left
                new THREE.MeshLambertMaterial({map: getMCTexture('top')}),  // top
                new THREE.MeshLambertMaterial({map: getMCTexture('side')}), // bottom (dirt)
                new THREE.MeshLambertMaterial({map: getMCTexture('side')}), // front
                new THREE.MeshLambertMaterial({map: getMCTexture('side')}), // back
            ],
            wood: new THREE.MeshLambertMaterial({map: getMCTexture('wood')}),
            leaf: new THREE.MeshLambertMaterial({map: getMCTexture('leaf'), transparent: true, opacity: 0.9})
        };

        function start() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('hotbar').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'block';
            init();
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78a7ff);
            scene.fog = new THREE.Fog(0x78a7ff, 5, 40);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const sun = new THREE.DirectionalLight(0xffffff, 0.4);
            sun.position.set(10, 50, 10);
            scene.add(sun);

            hand = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.8), new THREE.MeshLambertMaterial({color: 0xdbac82}));
            scene.add(hand);

            raycaster = new THREE.Raycaster();
            setupControls();
            updateWorld();
            animate();
        }

        function createBlock(x, y, z, mat) {
            const block = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
            block.position.set(x, y, z);
            scene.add(block);
            blocks.push(block);
        }

        function spawnTree(x, z) {
            for(let h=1; h<=4; h++) createBlock(x, h, z, materials.wood);
            for(let ly=4; ly<=5; ly++) {
                for(let lx=-1; lx<=1; lx++) {
                    for(let lz=-1; lz<=1; lz++) createBlock(x+lx, ly, z+lz, materials.leaf);
                }
            }
        }

        function updateWorld() {
            const pX = Math.floor(camera.position.x / CHUNK_SIZE);
            const pZ = Math.floor(camera.position.z / CHUNK_SIZE);

            for(let x = pX - RENDER_DISTANCE; x <= pX + RENDER_DISTANCE; x++) {
                for(let z = pZ - RENDER_DISTANCE; z <= pZ + RENDER_DISTANCE; z++) {
                    const key = `${x},${z}`;
                    if(!chunks[key]) {
                        // Gerar Chunk
                        for(let bx=0; bx<CHUNK_SIZE; bx++) {
                            for(let bz=0; bz<CHUNK_SIZE; bz++) {
                                let realX = x * CHUNK_SIZE + bx;
                                let realZ = z * CHUNK_SIZE + bz;
                                createBlock(realX, 0, realZ, materials.grass);
                                if(Math.random() > 0.98) spawnTree(realX, realZ);
                            }
                        }
                        chunks[key] = true;
                    }
                }
            }
        }

        function setupControls() {
            document.addEventListener('mousedown', () => {
                if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
                else {
                    hand.position.z += 0.3; // Soco
                    raycaster.setFromCamera(new THREE.Vector2(), camera);
                    const hits = raycaster.intersectObjects(blocks);
                    if(hits[0] && hits[0].distance < 5) {
                        scene.remove(hits[0].object);
                        blocks = blocks.filter(b => b !== hits[0].object);
                    }
                }
            });
            window.onkeydown = (e) => {
                if(e.code === 'KeyW') moveF = true; if(e.code === 'KeyS') moveB = true;
                if(e.code === 'KeyA') moveL = true; if(e.code === 'KeyD') moveR = true;
                if(e.code === 'Space' && canJump) { velocity.y += 4; canJump = false; }
            };
            window.onkeyup = (e) => {
                if(e.code === 'KeyW') moveF = false; if(e.code === 'KeyS') moveB = false;
                if(e.code === 'KeyA') moveL = false; if(e.code === 'KeyD') moveR = false;
            };
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveF) - Number(moveB);
            direction.x = Number(moveR) - Number(moveL);
            direction.normalize();

            if (moveF || moveB) velocity.z -= direction.z * 50.0 * delta;
            if (moveL || moveR) velocity.x -= direction.x * 50.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 2.2) { velocity.y = 0; camera.position.y = 2.2; canJump = true; }

            // View Bobbing (Balanço ao andar)
            const bob = (moveF || moveB || moveL || moveR) ? Math.sin(time * 0.01) * 0.05 : 0;
            camera.position.y += bob;

            // Update mão
            hand.position.copy(camera.position);
            hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.5); hand.translateY(-0.4 + bob); hand.translateZ(-0.8);

            updateWorld(); // Carrega novos pedaços do mundo

            camera.rotation.order = 'YXZ';
            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
