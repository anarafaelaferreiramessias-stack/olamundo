<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buraco Negro Realista - Estilo NASA</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; overflow:hidden; }
        body {
            height:100vh;
            background:#000;
            perspective:2800px;
            cursor:move;
        }

        .scene {
            position:absolute;
            inset:0;
            transform-style:preserve-3d;
            transform:rotateX(18deg);
            animation:sceneSpin 600s linear infinite;
        }

        @keyframes sceneSpin {
            to { transform:rotateX(18deg) rotateY(360deg); }
        }

        /* Fundo NASA-style: estrelas + nebulosa */
        .cosmos {
            position:absolute;
            inset:0;
            background:radial-gradient(circle at 50% 50%, #0a001f 0%, #000 90%);
        }

        .stars {
            position:absolute;
            inset:0;
            background:
                radial-gradient(white 1px,transparent 1px) 0 0/120px 120px,
                radial-gradient(white 0.9px,transparent 0.9px) 60px 60px/90px 90px;
            opacity:0.75;
            animation:starsDrift 400s linear infinite;
        }

        @keyframes starsDrift { to { transform:translateZ(-5000px); } }

        .nebula {
            position:absolute;
            inset:0;
            background:
                radial-gradient(circle at 30% 70%, rgba(100,0,255,0.25) 0%,transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0,200,255,0.18) 0%,transparent 60%);
            filter:blur(80px);
            animation:nebulaBreathe 60s ease-in-out infinite alternate;
        }

        @keyframes nebulaBreathe {
            0% { opacity:0.5; transform:scale(0.95); }
            100% { opacity:0.9; transform:scale(1.1); }
        }

        /* Buraco Negro principal - grande e central */
        .blackhole {
            position:absolute;
            top:50%;
            left:50%;
            width:1100px;
            height:1100px;
            transform:translate(-50%,-50%) rotateX(12deg);
            transform-style:preserve-3d;
            z-index:10;
        }

        .horizon {
            position:absolute;
            inset:0;
            background:#000;
            border-radius:50%;
            box-shadow:0 0 300px #000, inset 0 0 200px #000;
        }

        /* Disco de acreção girando (efeito NASA: quente, assimétrico, Doppler-like) */
        .disk {
            position:absolute;
            inset:-15%;
            background:conic-gradient(
                from 45deg at 50% 50%,
                transparent 0deg 40deg,
                #ff5500 40deg 100deg,
                #ffaa00 100deg 160deg,
                #ffff00 160deg 220deg,
                #ffaa00 220deg 280deg,
                #ff5500 280deg 320deg,
                transparent 320deg 360deg
            );
            border-radius:50%;
            filter:blur(25px);
            opacity:0.95;
            animation:diskSpin 12s linear infinite;
            box-shadow:0 0 400px #ff8800, 0 0 700px #ff4400, 0 0 1000px #ff2200;
        }

        @keyframes diskSpin { to { transform:rotate(360deg); } }

        /* Photon ring (anel de luz orbitando - marca NASA) */
        .photon-ring {
            position:absolute;
            inset:-5%;
            border:18px solid #ffdd88;
            border-radius:50%;
            box-shadow:0 0 80px #ffdd88, inset 0 0 40px #ffaa00;
            filter:blur(12px);
            opacity:0.85;
            animation:ringGlow 8s ease-in-out infinite alternate;
        }

        @keyframes ringGlow {
            0% { opacity:0.7; transform:scale(1.02); }
            100% { opacity:1; transform:scale(1.08); }
        }

        /* Glow externo do disco (luz distorcida) */
        .glow {
            position:absolute;
            inset:-50%;
            background:radial-gradient(circle,#ffaa44 10%,transparent 65%);
            border-radius:50%;
            filter:blur(180px);
            animation:glowBeat 7s ease-in-out infinite alternate;
            opacity:0.75;
        }

        @keyframes glowBeat {
            0% { opacity:0.6; transform:scale(0.9); }
            100% { opacity:1.2; transform:scale(1.15); }
        }

        /* Partículas caindo no horizonte (matéria sendo sugada) */
        .particle {
            position:absolute;
            background:#ffcc99;
            border-radius:50%;
            box-shadow:0 0 25px #ff8800;
            animation:spiralIn 10s linear infinite;
            opacity:0;
        }

        @keyframes spiralIn {
            0% { transform:translate(0,-1200px) rotate(0deg) scale(0.3); opacity:0; }
            15% { opacity:1; }
            100% { transform:translate(0,0) rotate(720deg) scale(0); opacity:0; }
        }

        /* HUD NASA-style */
        .hud {
            position:absolute;
            bottom:40px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.75);
            padding:20px 50px;
            border-radius:15px;
            color:#aaffff;
            font-size:1.4rem;
            text-shadow:0 0 15px #00ffff;
            border:3px solid #00ffff;
            pointer-events:none;
            z-index:20;
        }
    </style>
</head>
<body>

    <div class="cosmos">
        <div class="stars"></div>
        <div class="nebula"></div>
    </div>

    <div class="blackhole">
        <div class="horizon"></div>
        <div class="disk"></div>
        <div class="photon-ring"></div>
        <div class="glow"></div>
    </div>

    <div class="hud">
        Buraco Negro Supermassivo • Disco de Acreção Girando • Simulação NASA-Style • Gravidade Extrema
    </div>

    <!-- Som cósmico épico (inicia com clique) -->
    <audio id="space" loop preload="auto" volume="0.3">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8d9f8e6d8e.mp3?filename=cosmos-galaxy-stars-universe-milky-way-planet-ambient-music-208619.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('space');
        document.body.addEventListener('click', () => audio.play(), {once:true});

        // Controle com mouse: vire a "câmera" como na NASA
        let rx = 18, ry = 0;
        document.addEventListener('mousemove', e => {
            ry = (e.clientX / window.innerWidth - 0.5) * 60;
            rx = 18 + (e.clientY / window.innerHeight - 0.5) * 30;
            document.querySelector('.scene').style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
        });

        // Partículas de matéria caindo (efeito foda)
        const bh = document.querySelector('.blackhole');
        function spawnParticle() {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = `${Math.random()*8 + 4}px`;
            p.style.height = p.style.width;
            p.style.left = `${50 + (Math.random()-0.5)*220}%`;
            p.style.top = `${-Math.random()*150 - 100}%`;
            p.style.animationDuration = `${6 + Math.random()*8}s`;
            p.style.animationDelay = `${Math.random()*3}s`;
            bh.appendChild(p);
            setTimeout(() => p.remove(), 20000);
        }
        setInterval(spawnParticle, 120);
        for(let i=0; i<30; i++) setTimeout(spawnParticle, i*200);
    </script>

</body>
</html>
