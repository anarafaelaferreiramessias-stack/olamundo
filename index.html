<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft HTML</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        /* Tela Inicial Estilo Minecraft */
        #tela-inicial {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://minecraft.net/static/theme/img/background/panorama_0.jpg');
            background-size: cover;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: absolute;
        }

        h1 {
            color: #fff; font-size: 80px;
            text-shadow: 4px 4px #3f3f3f;
            margin-bottom: 40px;
        }

        .botao {
            width: 300px; padding: 15px;
            margin: 5px; background: #4a4a4a;
            border: 3px solid #000; color: #fff;
            font-size: 20px; cursor: pointer;
            box-shadow: inset -4px -4px #222, inset 4px 4px #aaa;
        }

        .botao:hover { background: #5a8a4a; }

        /* Tela do Jogo */
        #jogo {
            display: none; width: 100%; height: 100%;
            background: #87CEEB; position: relative;
        }

        #steve {
            width: 40px; height: 60px;
            background: #2ecc71; border: 2px solid #1b5e20;
            position: absolute; bottom: 50%; left: 50%;
        }
    </style>
</head>
<body>

    <div id="tela-inicial">
        <h1>MINECRAFT</h1>
        <button class="botao" onclick="jogar()">JOGAR</button>
        <button class="botao">OPÇÕES</button>
    </div>

    <div id="jogo">
        <div id="steve"></div>
        <div style="padding: 20px; background: rgba(0,0,0,0.3); color: white; display: inline-block;">
            Use W, A, S, D para andar
        </div>
    </div>

    <script src="logicajogo.js"></script>
</body>
</html>
