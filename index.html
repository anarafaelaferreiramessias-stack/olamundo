<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Pro Edition - Trabalho Final</title>
    <style>
        /* DESIGN DO MENU E INTERFACE */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000;
            font-family: 'Courier New', Courier, monospace; 
        }

        #menu {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://minecraft.net/static/theme/img/background/minecraft_bg.jpg');
            background-size: cover; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }

        #logo { width: 500px; margin-bottom: 40px; filter: drop-shadow(0 5px 15px #000); }

        .mc-button {
            width: 320px; padding: 18px; font-size: 22px; color: #FFF;
            background: #4A4A4A; border: 4px solid #000;
            box-shadow: inset -4px -4px #111, inset 4px 4px #888;
            cursor: pointer; text-align: center; font-weight: bold;
            text-shadow: 2px 2px #000; transition: 0.1s;
        }

        .mc-button:hover { background-color: #618c32; border-color: #FFF; transform: scale(1.05); }

        /* HUD */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; margin: -10px;
            display: none; pointer-events: none; z-index: 50;
            color: white; font-size: 24px; text-align: center;
        }

        /* MÃO DO STEVE MELHORADA */
        #hand-container {
            position: absolute; bottom: -20px; right: 10%;
            width: 200px; height: 300px;
            display: none; z-index: 60;
            pointer-events: none;
        }

        #hand-sleeve { /* Manga da camisa azul */
            width: 100%; height: 120px; background: #00A1D3;
            border: 6px solid #005A75; border-bottom: none;
        }

        #hand-arm { /* Braço cor de pele */
            width: 100%; height: 180px; background: #C68E62;
            border-left: 6px solid #8D6545; border-right: 6px solid #8D6545;
        }

        /* ANIMAÇÃO DE SOCO */
        .punch { animation: punchAnim 0.25s ease-out; }
        @keyframes punchAnim {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-80px) rotate(-15deg) scale(1.1); }
            100% { transform: translateY(0) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div id="crosshair">+</div>
    
    <div id="hand-container">
        <div id="hand-sleeve"></div>
        <div id="hand-arm"></div>
    </div>

    <div id="menu">
        <img id="logo" src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_logo.svg">
        <div class="mc-button" onclick="iniciarJogo()">CRIAR MUNDO</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let camera, scene, renderer, objects = [];
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();

        // TEXTURAS PIXELADAS REAIS
        function createPixelTexture(c1, c2) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            for(let x=0; x<16; x++) {
                for(let y=0; y<16; y++) {
                    ctx.fillStyle = Math.random() > 0.6 ? c1 : c2;
                    ctx.fillRect(x, y, 1, 1);
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        function iniciarJogo() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('hand-container').style.display = 'block';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.01);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 15; // Começa alto para cair

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 50, 10);
            scene.add(sun);

            const matGrama = new THREE.MeshLambertMaterial({ map: createPixelTexture('#55902e', '#4a7d28') });
            const matTerra = new THREE.MeshLambertMaterial({ map: createPixelTexture('#8B4513', '#5D2906') });
            const geo = new THREE.BoxGeometry(1, 1, 1);

            // GERAR TERRENO COM RELEVO
            for(let x=-20; x<20; x++) {
                for(let z=-20; z<20; z++) {
                    let h = Math.floor(Math.sin(x*0.2)*2 + Math.cos(z*0.2)*2);
                    const b = new THREE.Mesh(geo, matGrama);
                    b.position.set(x, h, z);
                    scene.add(b);
                    objects.push(b);
                    // Coloca terra embaixo
                    const b2 = new THREE.Mesh(geo, matTerra);
                    b2.position.set(x, h-1, z);
                    scene.add(b2);
                    objects.push(b2);
                }
            }

            // SISTEMA DE QUEBRA COM PARTÍCULAS
            window.addEventListener('mousedown', (e) => {
                if(document.pointerLockElement !== document.body) return;

                // Animar mão
                const hand = document.getElementById('hand-container');
                hand.classList.remove('punch');
                void hand.offsetWidth;
                hand.classList.add('punch');

                const ray = new THREE.Raycaster();
                ray.setFromCamera(new THREE.Vector2(0,0), camera);
                const hits = ray.intersectObjects(objects);

                if(hits.length > 0 && e.button === 0) {
                    const obj = hits[0].object;
                    
                    // Pequena animação de tremor antes de sumir
                    obj.scale.set(0.8, 0.8, 0.8);
                    
                    setTimeout(() => {
                        // Criar partículas
                        for(let i=0; i<5; i++) {
                            const p = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2), obj.material);
                            p.position.copy(obj.position);
                            scene.add(p);
                            const v = new THREE.Vector3((Math.random()-0.5)*0.1, 0.2, (Math.random()-0.5)*0.1);
                            const pAnim = () => {
                                p.position.add(v); v.y -= 0.01;
                                if(p.position.y > -10) requestAnimationFrame(pAnim);
                                else scene.remove(p);
                            };
                            pAnim();
                        }
                        scene.remove(obj);
                        objects.splice(objects.indexOf(obj), 1);
                    }, 100);
                }
            });

            // CONTROLES E MOVIMENTO
            document.body.addEventListener('click', () => document.body.requestPointerLock());
            const onKey = (e, v) => {
                if(e.code === 'KeyW') moveForward = v;
                if(e.code === 'KeyS') moveBackward = v;
                if(e.code === 'KeyA') moveLeft = v;
                if(e.code === 'KeyD') moveRight = v;
                if(e.code === 'Space' && v && canJump) { velocity.y += 12; canJump = false; }
            };
            document.addEventListener('keydown', (e)=>onKey(e,true));
            document.addEventListener('keyup', (e)=>onKey(e,false));

            document.addEventListener('mousemove', (e) => {
                if(document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                }
            });

            function animate() {
                requestAnimationFrame(animate);
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.y -= 35 * delta; // Gravidade forte
                velocity.x -= velocity.x * 10 * delta;
                velocity.z -= velocity.z * 10 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir); camDir.y = 0;
                const camSide = new THREE.Vector3().crossVectors(camera.up, camDir).normalize();

                if(moveForward || moveBackward) velocity.addScaledVector(camDir, 60 * delta * direction.z);
                if(moveLeft || moveRight) velocity.addScaledVector(camSide, 60 * delta * direction.x);

                camera.position.addScaledVector(velocity, delta);

                // COLISÃO COM O CHÃO (RAIO PARA BAIXO)
                const rayGround = new THREE.Raycaster(camera.position, new THREE.Vector3(0,-1,0), 0, 1.8);
                const groundHits = rayGround.intersectObjects(objects);

                if(groundHits.length > 0) {
                    let dist = groundHits[0].distance;
                    if(dist < 1.7) {
                        velocity.y = Math.max(0, velocity.y);
                        camera.position.y += (1.7 - dist);
                        canJump = true;
                    }
                }

                // EFEITO DE BALANÇO AO CAMINHAR
                if(moveForward || moveBackward || moveLeft || moveRight) {
                    const bob = Math.sin(time * 0.01) * 0.05;
                    camera.position.y += bob;
                }

                renderer.render(scene, camera);
                prevTime = time;
            }
            animate();
        }
    </script>
</body>
</html>
