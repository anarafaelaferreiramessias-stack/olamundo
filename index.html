<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minecraft 2026 - Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Montserrat', sans-serif; background: #000; }
        
        /* --- ESTILO DO MENU INICIAL --- */
        #menu-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://i.imgur.com/u7q13eH.jpg') center/cover; /* Imagem de shader realista */
            transition: opacity 1s ease, transform 1s ease;
        }

        .logo {
            width: 550px;
            max-width: 80%;
            margin-bottom: 50px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
            animation: fadeInDown 1s ease;
        }

        .btn-minecraft {
            width: 350px;
            padding: 15px;
            margin: 10px;
            background: linear-gradient(145deg, #3a3a3a, #5a5a5a);
            border: 2px solid #000;
            color: #eee;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-minecraft:hover {
            background: linear-gradient(145deg, #6aa32a, #8dc63f);
            color: white;
            transform: scale(1.05);
        }

        /* --- INTERFACE DO JOGO (HUD) --- */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #8dc63f;
            display: none; /* Escondido até o jogo começar */
            z-index: 50;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 50;
            pointer-events: none;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="menu-container">
        <img src="https://minecraft.wiki/images/Minecraft_Logo.png" class="logo" alt="Logo">
        <button class="btn-minecraft" onclick="startExperience()">New Game</button>
        <button class="btn-minecraft" style="opacity: 0.6; cursor: default;">Settings</button>
        <p style="color: white; margin-top: 20px; text-shadow: 2px 2px 4px #000;">Minecraft 2026 Edition</p>
    </div>

    <div id="hud">
        <strong>INVENTÁRIO</strong><br>
        Troncos: <span id="wood-count">0</span><br>
        <small>W,A,S,D + Espaço | Clique para Coletar</small>
    </div>
    <div id="crosshair"></div>

    <script>
        let scene, camera, renderer, raycaster, hand;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
        let prevTime = performance.now();
        let objects = [];
        let woodCount = 0;
        let gameRunning = false;

        function startExperience() {
            // Esconde o menu com efeito
            const menu = document.getElementById('menu-container');
            menu.style.opacity = '0';
            menu.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                menu.style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.getElementById('crosshair').style.display = 'block';
                initGame();
            }, 1000);
        }

        function initGame() {
            gameRunning = true;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            const loader = new THREE.TextureLoader();
            const grassTex = loader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
            grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
            grassTex.repeat.set(80, 80);

            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(1000, 1000),
                new THREE.MeshLambertMaterial({ map: grassTex })
            );
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            // A MÃO QUADRADA DO JOGADOR (Braço de Steve)
            const handGeo = new THREE.BoxGeometry(0.4, 0.4, 1.2);
            const handMat = new THREE.MeshLambertMaterial({ color: 0xdbac82 }); // Cor de pele
            hand = new THREE.Mesh(handGeo, handMat);
            scene.add(hand);

            // Criar Árvores com Texturas
            const woodTex = loader.load('https://threejs.org/examples/textures/crate.gif');
            for(let i = 0; i < 40; i++) {
                createTree(Math.random()*120-60, Math.random()*120-60, woodTex);
            }

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            // Controles de Clique e Teclado
            document.addEventListener('mousedown', () => {
                if (document.pointerLockElement !== renderer.domElement) {
                    renderer.domElement.requestPointerLock();
                } else {
                    mineBlock();
                }
            });

            document.addEventListener('keydown', (e) => handleKey(e.code, true));
            document.addEventListener('keyup', (e) => handleKey(e.code, false));
            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === renderer.domElement) {
                    camera.rotation.y -= e.movementX * 0.002;
                    camera.rotation.x -= e.movementY * 0.002;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                }
            });

            animate();
        }

        function createTree(x, z, tex) {
            const trunk = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 5, 1.2),
                new THREE.MeshLambertMaterial({ map: tex })
            );
            trunk.position.set(x, 2.5, z);
            trunk.userData = { breakable: true };
            scene.add(trunk);
            objects.push(trunk);

            const leaves = new THREE.Mesh(
                new THREE.BoxGeometry(4, 3, 4),
                new THREE.MeshLambertMaterial({ color: 0x2d4c1e })
            );
            leaves.position.set(x, 6, z);
            scene.add(leaves);
        }

        function handleKey(code, state) {
            if(code === 'KeyW') moveForward = state;
            if(code === 'KeyS') moveBackward = state;
            if(code === 'KeyA') moveLeft = state;
            if(code === 'KeyD') moveRight = state;
            if(code === 'Space' && state && canJump) { velocity.y += 5; canJump = false; }
        }

        function mineBlock() {
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const intersects = raycaster.intersectObjects(objects);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                woodCount++;
                document.getElementById('wood-count').innerText = woodCount;
                scene.remove(obj);
                objects = objects.filter(o => o !== obj);
                
                // Animação rápida de soco
                hand.position.z += 0.5; 
            }
        }

        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 250.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 250.0 * delta;

            camera.translateX(-velocity.x * delta);
            camera.translateZ(velocity.z * delta);
            camera.position.y += velocity.y * delta;

            if (camera.position.y < 2) {
                velocity.y = 0; camera.position.y = 2; canJump = true;
            }

            // --- POSIÇÃO DA MÃO E BALANÇO ---
            const isMoving = moveForward || moveBackward || moveLeft || moveRight;
            const handCycle = Math.sin(time * 0.008) * 0.05;
            
            hand.position.copy(camera.position);
            hand.quaternion.copy(camera.quaternion);
            hand.translateX(0.6); // Direita
            hand.translateY(-0.5 + (isMoving ? handCycle : 0)); // Sobe e desce ao andar
            hand.translateZ(-1.0); // À frente da câmera

            camera.rotation.order = "YXZ";
            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if(camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
