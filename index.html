<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniCraft</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background: linear-gradient(#87CEEB,#dff6ff);
      overflow:hidden;
      font-family: Arial, sans-serif;
    }
    canvas{display:block;}
    #menu{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:rgba(0,0,0,.7);
      color:white;
      z-index:10;
    }
    h1{
      font-size:60px;
      text-shadow:4px 4px 0 #333;
      margin-bottom:20px;
    }
    button{
      padding:15px 30px;
      font-size:24px;
      border:none;
      border-radius:10px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div id="menu">
  <h1>MiniCraft</h1>
  <button onclick="startGame()">Jogar</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const tileSize = 40;
const worldWidth = 30;
const worldHeight = 20;

let gameStarted = false;

const textures = {
  grass: '#4CAF50',
  dirt: '#8B5A2B',
  stone: '#888',
  wood: '#A0522D'
};

const world = [];
for(let y=0;y<worldHeight;y++){
  world[y]=[];
  for(let x=0;x<worldWidth;x++){
    world[y][x]='grass';
  }
}

const player = {
  x: 5,
  y: 5,
  size: 30,
  speed: 4
};

const keys = {};
document.addEventListener('keydown',e=>keys[e.key]=true);
document.addEventListener('keyup',e=>keys[e.key]=false);

canvas.addEventListener('click', (e)=>{
  if(!gameStarted) return;
  const mx = Math.floor(e.clientX / tileSize);
  const my = Math.floor(e.clientY / tileSize);
  if(mx>=0 && my>=0 && mx<worldWidth && my<worldHeight){
    world[my][mx] = world[my][mx] === 'grass' ? 'wood' : 'grass';
  }
});

function drawWorld(){
  for(let y=0;y<worldHeight;y++){
    for(let x=0;x<worldWidth;x++){
      ctx.fillStyle = textures[world[y][x]];
      ctx.fillRect(x*tileSize,y*tileSize,tileSize,tileSize);
      
      ctx.strokeStyle='rgba(0,0,0,0.2)';
      ctx.strokeRect(x*tileSize,y*tileSize,tileSize,tileSize);
    }
  }
}

function drawPlayer(){
  // Corpo estilo Steve
  ctx.fillStyle='#2196F3';
  ctx.fillRect(player.x,player.y,player.size,player.size);

  // Cabeça
  ctx.fillStyle='#f1c27d';
  ctx.fillRect(player.x+5,player.y-15,20,20);

  // Mão
  ctx.fillStyle='#f1c27d';
  ctx.fillRect(player.x+25,player.y+10,10,8);
}

function update(){
  if(keys['w']) player.y -= player.speed;
  if(keys['s']) player.y += player.speed;
  if(keys['a']) player.x -= player.speed;
  if(keys['d']) player.x += player.speed;
}

function gameLoop(){
  if(!gameStarted) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawWorld();
  update();
  drawPlayer();

  requestAnimationFrame(gameLoop);
}

function startGame(){
  document.getElementById('menu').style.display='none';
  gameStarted=true;
  gameLoop();
}
</script>

</body>
</html>
