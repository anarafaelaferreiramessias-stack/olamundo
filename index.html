<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FNAF Web Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="office">
            <div id="ui">
                <div id="power">Energia: 100%</div>
                <div id="time">12 AM</div>
            </div>
            
            <button id="btn-camera" onclick="toggleCams()">ABRIR MONITOR</button>
        </div>

        <div id="camera-system" class="hidden">
            <div id="cam-display">VISUALIZANDO: CAM 1A</div>
            <div class="map">
                <button onclick="changeCam('1A')">CAM 1A</button>
                <button onclick="changeCam('1B')">CAM 1B</button>
                <button onclick="changeCam('2A')">CAM 2A</button>
            </div>
            <button id="btn-close-cam" onclick="toggleCams()">FECHAR MONITOR</button>
        </div>

        <div id="jumpscare" class="hidden">
            <h1>VOCÊ MORREU!</h1>
            <button onclick="location.reload()">Tentar Novamente</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
